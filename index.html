<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1a12">
<title>自律花园</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
:root{--bg:#0d1f14;--card:#142a1c;--card2:#1a3524;--line:#244a30;--txt:#e8f5ec;--muted:#7fa88a;--dim:#4d7a5c;--accent:#4ade80;--accent2:#22c55e;--gold:#fbbf24;--red:#f87171;--blue:#60a5fa;--purple:#a78bfa;--pink:#f472b6;--ice:#a5d8f3;--r:16px}
body.cold{--bg:#0a1520;--card:#0f2233;--card2:#14293d;--line:#1e3a52;--txt:#dbeafe;--muted:#7aa8c8;--dim:#4a6d8a;--accent:#60a5fa;--accent2:#3b82f6;--gold:#93c5fd}
body.rest{--bg:#1f1a2e;--card:#2a2440;--card2:#342c4c;--line:#403658;--txt:#f0e9ff;--muted:#a896c8;--dim:#6d5e8a;--accent:#c4b5fd;--accent2:#a78bfa;--gold:#fbbf24}
body.bd-celebration{--bg:#2a0a0a;--card:#3d1010;--card2:#4a1515;--line:#6b2020;--txt:#fff0e0;--muted:#d49090;--dim:#8a4a4a;--accent:#ff4d4d;--accent2:#ff8833;--gold:#ffd700}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .8s,color .8s;min-height:100vh;padding-bottom:80px}
.bg-sky{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(1200px 600px at 50% -10%,rgba(74,222,128,.10),transparent 60%),linear-gradient(180deg,#0d1f14 0%,#0a1710 100%);transition:background .8s}
body.cold .bg-sky{background:radial-gradient(1200px 600px at 50% -10%,rgba(96,165,250,.12),transparent 60%),linear-gradient(180deg,#0a1520 0%,#06101a 100%)}
body.rest .bg-sky{background:radial-gradient(1200px 600px at 50% -10%,rgba(196,181,253,.15),transparent 60%),linear-gradient(180deg,#1f1a2e 0%,#15102a 100%)}
body.bd-celebration .bg-sky{background:radial-gradient(1200px 600px at 50% -10%,rgba(255,80,80,.28),transparent 60%),linear-gradient(180deg,#2a0a0a 0%,#150505 100%)}
.snowflake{position:fixed;top:-30px;color:#fff;pointer-events:none;z-index:2;opacity:.85;animation:snowfall linear infinite}
@keyframes snowfall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(105vh) rotate(360deg)}}
body:not(.cold) .snowflake{display:none}
.cloud{position:fixed;top:-30px;font-size:24px;pointer-events:none;z-index:2;opacity:.3;animation:cloudfall linear infinite}
@keyframes cloudfall{0%{transform:translateY(0) translateX(0)}100%{transform:translateY(105vh) translateX(30px)}}
body:not(.rest) .cloud{display:none}
.party-ribbon{position:fixed;top:-40px;width:14px;height:32px;pointer-events:none;z-index:3;border-radius:2px;animation:partyRibbonFall linear infinite;box-shadow:0 0 8px rgba(255,215,0,.4)}
@keyframes partyRibbonFall{0%{transform:translateY(0) rotate(0deg);opacity:1}50%{transform:translateY(50vh) rotate(360deg)}100%{transform:translateY(105vh) rotate(720deg);opacity:.3}}
body:not(.bd-celebration) .party-ribbon{display:none}
.hbd-float{position:fixed;pointer-events:none;z-index:2;font-family:"Songti SC","Noto Serif SC",serif;font-weight:900;letter-spacing:10px;color:rgba(255,215,0,.22);text-shadow:0 0 24px rgba(255,80,80,.5);animation:hbdFloat 9s ease-in-out infinite;white-space:nowrap}
@keyframes hbdFloat{0%,100%{opacity:0;transform:translateY(30px) scale(.9)}50%{opacity:1;transform:translateY(-30px) scale(1.08)}}
body:not(.bd-celebration) .hbd-float{display:none}
.hbd-star{position:fixed;pointer-events:none;z-index:2;color:#ffd700;text-shadow:0 0 10px #ff4d4d,0 0 20px #ff8833;font-size:14px;animation:hbdStarTwinkle 3s ease-in-out infinite}
@keyframes hbdStarTwinkle{0%,100%{opacity:.15;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.3) rotate(180deg)}}
body:not(.bd-celebration) .hbd-star{display:none}
.firework{position:fixed;width:5px;height:5px;border-radius:50%;pointer-events:none;z-index:999;background:currentColor;box-shadow:0 0 8px 3px currentColor;animation:fireworkBurst 1.6s ease-out forwards}
@keyframes fireworkBurst{0%{transform:translate(0,0) scale(1.4);opacity:1}80%{opacity:.9}100%{transform:translate(var(--fx),var(--fy)) scale(0);opacity:0}}
.hbd-burst{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:9999;font-size:78px;font-weight:900;letter-spacing:14px;font-family:"Songti SC","Noto Serif SC",serif;color:#ffd700;text-shadow:0 0 30px #ff4d4d,0 0 60px #ff8833,5px 5px 0 #8b0000;animation:hbdBurst 3.2s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes hbdBurst{0%{transform:scale(.05) rotate(-25deg);opacity:0;filter:blur(30px)}18%{transform:scale(1.9) rotate(8deg);opacity:1;filter:blur(0)}45%{transform:scale(1.25) rotate(-4deg);opacity:1}75%{transform:scale(1.55) rotate(3deg);opacity:1}100%{transform:scale(2.4) rotate(0deg);opacity:0;filter:blur(10px)}}
.app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;z-index:3}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:12px 14px 10px;backdrop-filter:blur(18px);background:rgba(13,31,20,.82);border-bottom:1px solid rgba(36,74,48,.7);transition:background .8s}
body.cold .topbar{background:rgba(10,21,32,.82)}
body.rest .topbar{background:rgba(31,26,46,.82)}
body.bd-celebration .topbar{background:rgba(42,10,10,.88)}
.date-display{flex:1;text-align:center;padding:4px 8px}
.date-display b{display:block;font-size:14px;font-weight:700}
.date-display span{font-size:10px;color:var(--muted)}
.icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:15px;display:grid;place-items:center;cursor:pointer}
.icon-btn:active{transform:scale(.92)}
.icon-btn.on{color:var(--accent);border-color:rgba(74,222,128,.4)}
.view{padding:12px 12px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.card-t{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.card-t h3{font-size:14px;font-weight:600}
.card-t .sub{font-size:11px;color:var(--muted)}
.hero{background:linear-gradient(150deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:10px}
.hero-top{display:flex;justify-content:space-between;align-items:center}
.hero-label{font-size:11px;color:var(--muted)}
.pill{font-size:10px;padding:3px 9px;border-radius:20px;background:rgba(74,222,128,.15);color:var(--accent);border:1px solid rgba(74,222,128,.3);font-weight:500}
.hero-amount{font-size:30px;font-weight:800;letter-spacing:-1px;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.hero-sub{font-size:11.5px;color:var(--muted)}
.progress{height:7px;border-radius:7px;background:rgba(255,255,255,.06);margin:12px 0;overflow:hidden}
.progress-fill{height:100%;border-radius:7px;transition:width .6s;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.hero-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.hero-grid>div{text-align:center;background:rgba(255,255,255,.04);border-radius:10px;padding:7px 3px}
.hero-grid b{display:block;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.hero-grid span{font-size:9.5px;color:var(--muted)}
.alert{display:flex;gap:9px;padding:10px 12px;border-radius:12px;margin-bottom:8px;border:1px solid;font-size:12.5px;align-items:flex-start}
.alert.danger{background:rgba(248,113,113,.09);border-color:rgba(248,113,113,.3);color:#fca5a5}
.alert.ok{background:rgba(74,222,128,.08);border-color:rgba(74,222,128,.25);color:#86efac}
.alert.info{background:rgba(96,165,250,.08);border-color:rgba(96,165,250,.25);color:#93c5fd}
.alert.gold{background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.25);color:#fde68a}
.alert.purple{background:rgba(167,139,250,.08);border-color:rgba(167,139,250,.25);color:#c4b5fd}
.alert.rest{background:rgba(196,181,253,.1);border-color:rgba(196,181,253,.3);color:#ddd6fe}
.alert.bd{background:rgba(255,215,0,.1);border-color:rgba(255,215,0,.35);color:#ffd700}
.alert .ico{font-size:14px;flex-shrink:0;line-height:1.3}
.alert b{display:block;font-size:12.5px;font-weight:600;margin-bottom:2px}
.alert p{font-size:11.5px;opacity:.85;line-height:1.45}
.task{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.task.checked{opacity:.65;border-color:rgba(74,222,128,.3)}
.task.failed{opacity:.7;border-color:rgba(248,113,113,.4)}
.task.locked{opacity:.5}
.task.auto{opacity:.85;border-color:rgba(167,139,250,.4)}
.task.bd-disabled{opacity:.35;filter:grayscale(.5)}
.task-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.task-icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:rgba(255,255,255,.04);flex-shrink:0}
.task-title{flex:1}
.task-title h4{font-size:13.5px;font-weight:600}
.task-title p{font-size:10.5px;color:var(--muted);margin-top:2px}
.task-btn{padding:10px 16px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#062}
body.cold .task-btn,body.rest .task-btn,body.bd-celebration .task-btn{color:#fff}
.task-btn:active{transform:scale(.95)}
.task-btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.5)}
.task-btn.full{width:100%}
.task-result{font-size:11.5px;padding:7px 10px;border-radius:8px;margin-top:6px}
.task-result.ok{background:rgba(74,222,128,.1);color:#86efac}
.task-result.bad{background:rgba(248,113,113,.1);color:#fca5a5}
.task-result.wait{background:rgba(251,191,36,.1);color:#fde68a}
.task-result.jj{background:rgba(167,139,250,.12);color:#c4b5fd}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--txt);cursor:pointer;font-size:13px}
.cal-head .cal-title{font-size:13px;font-weight:600}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:5px}
.cal-week span{text-align:center;font-size:9.5px;color:var(--muted);padding:3px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-day{aspect-ratio:1/1.2;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;border:1px solid transparent;position:relative}
.cal-day.empty{cursor:default}
.cal-day:not(.empty):active{transform:scale(.9)}
.cal-day.future{opacity:.4;cursor:not-allowed}
.cal-num{font-size:10.5px;color:var(--muted);font-weight:500;position:relative;z-index:2}
.cal-day.today{border-color:var(--gold);background:rgba(251,191,36,.08)}
.cal-day.today .cal-num{color:var(--gold);font-weight:700}
.cal-day.sel{border-color:var(--accent);background:rgba(74,222,128,.1)}
.cal-day.green{background:rgba(74,222,128,.15)}
.cal-day.green .cal-num{color:#86efac}
.cal-day.partial{background:rgba(251,191,36,.1)}
.cal-day.meal{background:linear-gradient(135deg,rgba(251,191,36,.16),rgba(251,191,36,.04));border:1px solid rgba(251,191,36,.35)}
.cal-day.meal::before{content:'◆';position:absolute;top:0;right:2px;font-size:9px;color:var(--gold)}
.cal-day.reward{background:linear-gradient(135deg,rgba(251,191,36,.28),rgba(251,191,36,.10));border:1px solid rgba(251,191,36,.65)}
.cal-day.reward::before{content:'★';position:absolute;top:0;right:2px;font-size:11px;color:var(--gold)}
.cal-day.cool{background:linear-gradient(135deg,rgba(165,216,243,.3),rgba(219,234,254,.15));border:1px solid rgba(165,216,243,.6)}
.cal-day.cool::before{content:'❄';position:absolute;top:0;left:2px;font-size:8px;color:var(--ice)}
.cal-day.cool .cal-num{color:#4a90c8;font-weight:700}
.cal-day.birthday{background:linear-gradient(135deg,rgba(255,80,80,.35),rgba(255,180,60,.25));border:1px solid rgba(255,215,0,.7)}
.cal-day.birthday::before{content:'🎂';position:absolute;top:0;right:1px;font-size:11px}
.cal-day.rest{background:linear-gradient(135deg,rgba(196,181,253,.35),rgba(167,139,250,.15));border:1px solid rgba(196,181,253,.7)}
.cal-day.rest::before{content:'🏖';position:absolute;top:0;right:1px;font-size:10px}
.cal-day.rest-candidate{background:linear-gradient(135deg,rgba(167,139,250,.12),rgba(96,165,250,.08));border:1px dashed rgba(167,139,250,.6)}
.cal-day.rest-candidate::before{content:'?';position:absolute;top:0;right:2px;font-size:9px;color:#a78bfa;font-weight:700}
.cal-day.jj-release{background:linear-gradient(135deg,rgba(167,139,250,.3),rgba(139,92,246,.15));border:1px solid rgba(167,139,250,.7)}
.cal-day.jj-release::before{content:'💧';position:absolute;top:0;right:1px;font-size:9px}
.cal-day.jj-release .cal-num{color:#c4b5fd;font-weight:700}
.cal-dots{display:flex;gap:1.5px;position:relative;z-index:2}
.dot{width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.15)}
.dot.on.money{background:var(--accent)}
.dot.on.study{background:var(--blue)}
.dot.on.diet{background:var(--gold)}
.dot.on.jj{background:var(--purple)}
.dot.on.sleep{background:var(--pink)}
.dot.on.wake{background:#fb923c}
.cards-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card-item{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 6px;text-align:center;cursor:pointer}
.card-item:active{transform:scale(.95)}
.card-item.disabled{opacity:.3;pointer-events:none}
.card-item .ci-icon{font-size:22px;margin-bottom:4px}
.card-item .ci-name{font-size:11px;font-weight:600;margin-bottom:2px}
.card-item .ci-count{font-size:10.5px;color:var(--gold);font-weight:700}
.card-item .ci-count small{color:var(--muted);font-weight:400;font-size:9px}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:grid;grid-template-columns:repeat(7,1fr);background:rgba(13,31,20,.95);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:8px 2px calc(8px + env(safe-area-inset-bottom));z-index:60}
body.cold .tabbar{background:rgba(10,21,32,.95)}
body.rest .tabbar{background:rgba(31,26,46,.95)}
body.bd-celebration .tabbar{background:rgba(42,10,10,.96)}
.tab{background:none;border:none;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 0;cursor:pointer;font-family:inherit}
.tab svg{width:18px;height:18px;stroke-width:1.9}
.tab span{font-size:9px}
.tab.active{color:var(--accent)}
.tab:active{transform:scale(.92)}
.mask{position:fixed;inset:0;background:rgba(4,10,6,.75);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:86vh;overflow-y:auto}
.sheet h3{font-size:16px;margin-bottom:14px;font-weight:700}
.close-row{display:flex;gap:8px;margin-top:14px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:rgba(20,42,28,.97);border:1px solid var(--line);color:var(--txt);padding:10px 18px;border-radius:12px;font-size:12.5px;z-index:200;transition:.28s;pointer-events:none;max-width:86%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
body.cold .toast{background:rgba(15,34,51,.97)}
body.rest .toast{background:rgba(42,36,64,.97)}
body.bd-celebration .toast{background:rgba(61,16,16,.98);border-color:rgba(255,215,0,.4);color:#ffd700}
.btn{width:100%;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:.18s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-p{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#062}
body.cold .btn-p,body.rest .btn-p,body.bd-celebration .btn-p{color:#fff}
body.bd-celebration .btn-p{background:linear-gradient(135deg,#ff4d4d,#ff8833)}
.btn-g{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn-d{background:rgba(248,113,113,.12);color:#fca5a5;border:1px solid rgba(248,113,113,.25)}
.btn-sm{padding:8px 12px;font-size:12px;width:auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 12px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:12px;color:var(--muted);cursor:pointer;position:relative;user-select:none}
.chip:active{transform:scale(.95)}
.chip.junk{border-color:rgba(248,113,113,.4);color:#fca5a5}
.chip .price{font-size:10px;opacity:.6;margin-left:4px}
.chip .cat{font-size:10px;opacity:.6;margin-left:4px}
.pending-tag{display:inline-block;background:rgba(251,191,36,.15);border:1px solid rgba(251,191,36,.35);color:#fde68a;padding:5px 10px;border-radius:8px;font-size:12px;margin:2px 3px 2px 0}
.pending-tag .rm{color:#fca5a5;margin-left:6px;cursor:pointer;font-weight:700}
label.fl{display:block;font-size:11px;color:var(--muted);margin:12px 0 6px}
input.txt,select.txt{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--txt);font-size:14px;outline:none;font-family:inherit}
input.txt:focus,select.txt:focus{border-color:var(--accent)}
.hint{font-size:10.5px;color:var(--dim);margin-top:6px;line-height:1.5}
.empty{text-align:center;padding:24px 0;color:var(--dim);font-size:12px}
.jj-progress{height:5px;background:rgba(255,255,255,.06);border-radius:3px;margin-top:8px;overflow:hidden}
.jj-bar{height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#a78bfa,#8b5cf6);transition:width .4s}
.cool-detail{background:rgba(165,216,243,.06);border:1px solid rgba(165,216,243,.2);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:11.5px;color:#bfdbfe;line-height:1.7}
.cool-detail b{color:#fff;display:block;margin-bottom:5px;font-size:12px}
.cool-detail .cd-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed rgba(165,216,243,.15)}
.cool-detail .cd-row:last-child{border-bottom:none}
.cool-detail .cd-row span:last-child{color:#93c5fd;font-weight:600}
.rest-hero{text-align:center;padding:48px 22px 40px;background:linear-gradient(150deg,rgba(196,181,253,.12),rgba(167,139,250,.04));border:1px solid rgba(196,181,253,.25);border-radius:24px;margin-bottom:14px;position:relative;overflow:hidden}
.rest-icon{font-size:72px;line-height:1;margin-bottom:16px;animation:restBob 4s ease-in-out infinite}
@keyframes restBob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
.rest-title{font-size:24px;font-weight:800;margin-bottom:10px;background:linear-gradient(135deg,#c4b5fd,#a78bfa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.rest-sub{font-size:13px;color:var(--muted);line-height:1.8;max-width:320px;margin:0 auto}
.rest-tip{margin-top:22px;padding:14px;background:rgba(255,255,255,.04);border-radius:14px;border:1px solid rgba(196,181,253,.15);font-size:12.5px;color:var(--muted);line-height:1.7;text-align:left}
.rest-tip b{color:var(--accent);display:block;margin-bottom:6px;font-size:13px}
.rest-next{margin-top:18px;font-size:11.5px;color:var(--dim)}

<body>
<div class="bg-sky"></div>
<div class="app">
  <header class="topbar">
    <div class="date-display" id="dateDisplay"><b id="dateMain">—</b><span id="dateSub">—</span></div>
    <button class="icon-btn" id="undoBtn">↶</button>
  </header>
  <main class="view" id="view"></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div id="layer"></div>
<div class="toast" id="toast"></div>

<script>
/* ========== 工具 ========== */
const $=(s,r=document)=>r.querySelector(s);
const pad2=n=>String(n).padStart(2,'0');
const r2=n=>Math.round(n*100)/100;
const fmtDate=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const todayStr=()=>fmtDate(new Date());
const parseD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const diffDays=(a,b)=>Math.round((b-a)/86400000);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nid=p=>p+Math.random().toString(36).slice(2,8);
const timeToMin=t=>{if(!t)return-1;const[h,m]=t.split(':').map(Number);return h*60+m};
const nowTimeStr=()=>{const d=new Date();return pad2(d.getHours())+':'+pad2(d.getMinutes())};
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const SLEEP_WINDOW={start:23*60,end:5*60};
const WAKE_WINDOW={start:4*60,end:7*60};
const WAKE_FAIL_MIN=7*60+5;
const BD_TOLERANCE=10;
function inSleepWindow(){const m=nowMin();return m>=SLEEP_WINDOW.start||m<SLEEP_WINDOW.end}
function inWakeWindow(){const m=nowMin();return m>=WAKE_WINDOW.start&&m<WAKE_WINDOW.end}

/* ========== 状态 ========== */
const LS_STATE='garden_v16_official';
let state=null,undoStack=[],activeTab='home',calCursor=null,scrollPos=0;

function defaultState(){
  return {
    version:16,
    enabled:false,
    settings:{startDate:'',sleepDeadline:'23:30',wakeDeadline:'05:20',birthday:'',editLimitPerMonth:3,jjInitial:10,jjIncrement:5},
    birthdayCard:{used:false,usedDate:'',delayDate:'',delayResolved:false,prompted:false},
    records:{},
    // 唯一支出流水
    expenses:[],
    // 大类：isFood → 进入饮食板块；isJunk → 触发异常
    cats:[
      {id:'c_normal',name:'正常用餐',color:'#4ade80',isFood:true, isJunk:false},
      {id:'c_fruit', name:'水果',    color:'#fbbf24',isFood:true, isJunk:false},
      {id:'c_drink', name:'饮料',    color:'#60a5fa',isFood:true, isJunk:false},
      {id:'c_junk',  name:'垃圾食品',color:'#f87171',isFood:true, isJunk:true},
      {id:'c_snack', name:'零食',    color:'#f472b6',isFood:true, isJunk:true},
      {id:'c_daily', name:'日用品',  color:'#94a3b8',isFood:false,isJunk:false},
      {id:'c_traf',  name:'交通',    color:'#a3e635',isFood:false,isJunk:false},
      {id:'c_study', name:'学习',    color:'#34d399',isFood:false,isJunk:false}
    ],
    tags:[
      {id:'t1',name:'早餐',price:6,catId:'c_normal'},{id:'t2',name:'午餐',price:12,catId:'c_normal'},
      {id:'t3',name:'晚餐',price:17.5,catId:'c_normal'},{id:'t4',name:'减脂餐',price:15,catId:'c_normal'},
      {id:'t5',name:'苹果',price:5,catId:'c_fruit'},{id:'t6',name:'蓝莓',price:12,catId:'c_fruit'},
      {id:'t7',name:'无糖酸奶',price:8,catId:'c_normal'},{id:'t8',name:'奶茶',price:18,catId:'c_junk'},
      {id:'t9',name:'蛋糕',price:25,catId:'c_junk'},{id:'t10',name:'薯片',price:10,catId:'c_snack'},
      {id:'t11',name:'可乐',price:4,catId:'c_drink'},{id:'t12',name:'洗发水',price:35,catId:'c_daily'},
      {id:'t13',name:'纸巾',price:15,catId:'c_daily'},{id:'t14',name:'地铁',price:6,catId:'c_traf'}
    ],
    budget:3000,
    cards:{protect:2,sick:1,makeup:2,clean:1,birthday:1,reset:2,_periodKeys:{},_lastUse:{}},
    jj:{cycleLength:10,current:0,completed:0,lastReleaseDate:''},
    stats:{totalGreenDays:0,totalCooldowns:0,longestStreak:0,treesGrown:0},
    trees:[],editLog:[],restReschedule:{},restResolved:{},restPrompted:{}
  };
}
function saveState(s){try{localStorage.setItem(LS_STATE,JSON.stringify(state))}catch(e){if(!s)toast('存储失败')}}
function pushUndo(l){try{undoStack.push({label:l,snap:JSON.stringify(state)})}catch(e){};if(undoStack.length>12)undoStack.shift();updateUndoBtn()}
function doUndo(){const it=undoStack.pop();if(!it){toast('没有可撤销的操作');return}state=JSON.parse(it.snap);saveState(true);updateUndoBtn();render();toast('已撤销：'+it.label)}
function updateUndoBtn(){const b=$('#undoBtn');if(!b)return;b.classList.toggle('on',undoStack.length>0);b.textContent=undoStack.length?'↶'+undoStack.length:'↶'}
function getRecord(d){if(!state.records[d])state.records[d]={};return state.records[d]}

/* ========== 大类/标签/支出 派生 ========== */
function getCat(id){return state.cats.find(c=>c.id===id)||{name:'已删除',color:'#64748b',isFood:false,isJunk:false}}
function getTag(id){return state.tags.find(t=>t.id===id)}
function getDayExpenses(d){return state.expenses.filter(e=>e.date===d)}
function getDayFoods(d){return state.expenses.filter(e=>e.date===d && getCat(e.catId).isFood)}
// 用钱达标：没有 isJunk 的支出
function isMoneyOk(d){return !getDayExpenses(d).some(e=>getCat(e.catId).isJunk)}
// 饮食达标：没有 isJunk 的食物支出
function isDietOk(d){return !getDayFoods(d).some(e=>getCat(e.catId).isJunk)}

/* ========== 自动失败检查 ========== */
function autoCheckWakeFail(){
  const today=todayStr();const r=state.records[today];
  if(r&&r.wake&&r.wake.checked)return;
  if(nowMin()>=WAKE_FAIL_MIN){
    const rec=getRecord(today);
    if(!rec.wake||!rec.wake.checked){
      rec.wake={time:'07:05',fitness:false,msg:'超过7:05未打卡，自动失败',checked:true,autoFail:true};
      saveState(true);
    }
  }
}
function isBirthdayDate(dateKey){
  if(!state.settings.birthday) return false;
  const bd=parseD(state.settings.birthday);const d=parseD(dateKey);
  return bd.getMonth()===d.getMonth() && bd.getDate()===d.getDate();
}
function canUseBirthdayCard(checkDate){
  if(!state.settings.birthday) return false;
  if(state.birthdayCard.used) return false;
  if(state.birthdayCard.delayResolved && state.birthdayCard.delayDate){return checkDate===state.birthdayCard.delayDate;}
  const bd=parseD(state.settings.birthday);const cd=parseD(checkDate);
  const y1=new Date(cd.getFullYear(),bd.getMonth(),bd.getDate());
  const y2=new Date(cd.getFullYear()-1,bd.getMonth(),bd.getDate());
  const y3=new Date(cd.getFullYear()+1,bd.getMonth(),bd.getDate());
  const diff=Math.min(Math.abs(diffDays(y1,cd)),Math.abs(diffDays(y2,cd)),Math.abs(diffDays(y3,cd)));
  return diff<=BD_TOLERANCE;
}
function getStudyCooldown(tier){if(tier==='cool1')return 1;if(tier==='cool2')return 2;if(tier==='cool3')return 3;return 0;}
function getDayCooldown(rec,dateKey){
  let total=0;const breakdown=[];
  if(rec.study&&rec.study.tier&&rec.study.tier.startsWith('cool')){const d=getStudyCooldown(rec.study.tier);total+=d;breakdown.push({name:'学习'+rec.study.hours+'h',days:d});}
  // 用钱/饮食从 expenses 派生
  if(!isDietOk(dateKey)){total+=2;breakdown.push({name:'饮食异常（垃圾食品）',days:2});}
  else if(!isMoneyOk(dateKey)){total+=1;breakdown.push({name:'用钱异常',days:1});}
  if(rec.jingji&&rec.jingji.checked&&rec.jingji.ok===false){total+=2;breakdown.push({name:'养精蓄锐破戒',days:2});}
  if(rec.sleep&&rec.sleep.checked&&!rec.sleep.success){total+=1;breakdown.push({name:'睡觉失败',days:1});}
  return {total,breakdown};
}
function isGreenForCooldown(rec,dateKey,isJJReleaseDay){
  if(!rec)return false;
  const sleepOk=rec.sleep&&rec.sleep.success;
  const studyOk=rec.study&&(rec.study.tier==='normal'||rec.study.tier==='reward');
  const moneyOk=isMoneyOk(dateKey);
  const dietOk=isDietOk(dateKey);
  const jjOk=(rec.jingji&&rec.jingji.checked&&rec.jingji.ok===true)||isJJReleaseDay===true;
  return !!(sleepOk&&studyOk&&moneyOk&&dietOk&&jjOk);
}
function isGreenForCycle(rec,dateKey,isJJReleaseDay){
  if(!rec)return false;
  const sleepOk=rec.sleep&&rec.sleep.success;
  const wakeOk=rec.wake&&rec.wake.checked;
  const studyOk=rec.study&&(rec.study.tier==='normal'||rec.study.tier==='reward');
  const moneyOk=isMoneyOk(dateKey);
  const dietOk=isDietOk(dateKey);
  const jjOk=(rec.jingji&&rec.jingji.checked&&rec.jingji.ok===true)||isJJReleaseDay===true;
  return !!(sleepOk&&wakeOk&&studyOk&&moneyOk&&dietOk&&jjOk);
}

/* ========== 核心推演 ========== */
function computeSchedule(){
  const result={};const today=todayStr();
  const startDateStr=state.settings.startDate||today;
  let d=parseD(startDateStr);const endDate=addDays(parseD(today),200);
  let cooldownTotal=0,consecutiveGreen=0,wakeFailStreak=0,conservativeStreak=0,cycleDay=0,bigCycleDay=0,pendingRestKey=null,lastBigCycleComplete=0;
  let jjCurrent=0,jjCycleLength=state.settings.jjInitial||10;
  const restReschedule=state.restReschedule||{};
  let guard=0;
  while(d<=endDate&&guard++<1000){
    const key=fmtDate(d);const rec=state.records[key];const isToday=key===today;const isFuture=key>today;
    let dayInfo={key,type:'future',cycleDay:0,isReward:false,isMealDay:false,isBirthday:false,isRest:false,isRestCandidate:false,cooldownRemaining:0,isJJRelease:false,isBigCycleComplete:false,cooldownBreakdown:null};
    if(isBirthdayDate(key)) dayInfo.isBirthday=true;
    if(!isFuture && rec){
      if(rec.jingji&&rec.jingji.checked){
        if(rec.jingji.ok===true){jjCurrent++;if(jjCurrent>=jjCycleLength){dayInfo.isJJRelease=true;jjCurrent=0;jjCycleLength+=(state.settings.jjIncrement||5);}}
        else if(rec.jingji.broken){jjCurrent=0;}
      } else {jjCurrent=0;}
    } else if(isFuture){jjCurrent++;if(jjCurrent>=jjCycleLength){dayInfo.isJJRelease=true;jjCurrent=0;jjCycleLength+=(state.settings.jjIncrement||5);}}
    if(pendingRestKey===key){
      const resolution=state.restResolved[key];const delayedTo=restReschedule[key];
      if(resolution==='delay'&&delayedTo){dayInfo.isRestCandidate=true;pendingRestKey=delayedTo;}
      else {dayInfo.isRest=true;dayInfo.isRestConfirmed=resolution==='keep';result[key]=dayInfo;cycleDay=0;bigCycleDay=0;pendingRestKey=null;lastBigCycleComplete=0;d.setDate(d.getDate()+1);continue;}
    }
    let isDelayedRestDay=false;
    for(const orig in restReschedule){if(restReschedule[orig]===key&&orig!==key){isDelayedRestDay=true;break;}}
    if(isDelayedRestDay){dayInfo.isRest=true;dayInfo.isRestConfirmed=true;result[key]=dayInfo;cycleDay=0;bigCycleDay=0;pendingRestKey=null;lastBigCycleComplete=0;d.setDate(d.getDate()+1);continue;}
    if(cooldownTotal>0){
      dayInfo.type=isFuture?'future-cooldown':'cooldown';dayInfo.cooldownRemaining=cooldownTotal;
      if(rec&&!isFuture){
        if(isGreenForCooldown(rec,key,dayInfo.isJJRelease)){cooldownTotal--;consecutiveGreen++;if(consecutiveGreen>=2&&cooldownTotal>=3){cooldownTotal--;consecutiveGreen=0;}}
        else {consecutiveGreen=0;const dayCd=getDayCooldown(rec,key);if(dayCd.total>0){cooldownTotal+=dayCd.total;dayInfo.cooldownBreakdown=dayCd.breakdown;}if(rec.wake&&rec.wake.checked&&!rec.wake.fitness){wakeFailStreak++;if(wakeFailStreak>=2){cooldownTotal+=1;wakeFailStreak=0;}} else {wakeFailStreak=0;}if(rec.study&&rec.study.tier==='conservative'){conservativeStreak++;if(conservativeStreak>=3){cooldownTotal+=1;conservativeStreak=0;}} else {conservativeStreak=0;}}
        if(cooldownTotal<=0){cooldownTotal=0;consecutiveGreen=0;dayInfo.type='green';}
      } else if(isFuture){cooldownTotal--;consecutiveGreen++;if(consecutiveGreen>=2&&cooldownTotal>=3){cooldownTotal--;consecutiveGreen=0;}if(cooldownTotal<=0){cooldownTotal=0;consecutiveGreen=0;}}
    } else {
      if(rec&&!isFuture){
        if(isGreenForCycle(rec,key,dayInfo.isJJRelease)){cycleDay++;bigCycleDay++;dayInfo.type='green';dayInfo.cycleDay=cycleDay;if(cycleDay%8===4)dayInfo.isMealDay=true;if(cycleDay%8===0&&cycleDay>0)dayInfo.isReward=true;}
        else if(rec.birthdayCard||rec.sick||rec.protect){dayInfo.type='partial';}
        else {dayInfo.type='partial';const dayCd=getDayCooldown(rec,key);if(dayCd.total>0){cooldownTotal+=dayCd.total;dayInfo.cooldownBreakdown=dayCd.breakdown;}if(rec.wake&&rec.wake.checked&&!rec.wake.fitness){wakeFailStreak++;if(wakeFailStreak>=2){cooldownTotal+=1;wakeFailStreak=0;}} else {wakeFailStreak=0;}if(rec.study&&rec.study.tier==='conservative'){conservativeStreak++;if(conservativeStreak>=3){cooldownTotal+=1;conservativeStreak=0;}} else {conservativeStreak=0;}}
      } else if(isFuture){cycleDay++;bigCycleDay++;dayInfo.type='future';dayInfo.cycleDay=cycleDay;if(cycleDay%8===4)dayInfo.isMealDay=true;if(cycleDay%8===0&&cycleDay>0)dayInfo.isReward=true;}
    }
    if(cycleDay>0 && cycleDay%32===0 && cycleDay!==lastBigCycleComplete){pendingRestKey=fmtDate(addDays(d,1));lastBigCycleComplete=cycleDay;dayInfo.isBigCycleComplete=true;}
    result[key]=dayInfo;d.setDate(d.getDate()+1);
  }
  return result;
}

/* ========== 判定 ========== */
function judgeStudy(h,isReward){
  if(isReward){if(h>=7)return{tier:'normal',label:'正常',msg:'奖励日 ≥7h'};if(h>=6)return{tier:'cool1',label:'冷静1天',msg:'奖励日 6-7h'};return{tier:'cool2',label:'冷静2天',msg:'奖励日 <6h'};}
  if(h>=10)return{tier:'reward',label:'奖励加餐',msg:'≥10h，今晚可加餐'};
  if(h>=9)return{tier:'normal',label:'正常积累',msg:'9-10h'};
  if(h>=8)return{tier:'conservative',label:'保守打卡',msg:'8-9h，不计入积累'};
  if(h>=7)return{tier:'cool1',label:'冷静1天',msg:'7-8h'};
  if(h>=6)return{tier:'cool2',label:'冷静2天',msg:'6-7h'};
  return{tier:'cool3',label:'冷静3天',msg:'<6h'};
}
function judgeSleep(time,reason){
  if(!time)return{success:false,msg:'未打卡'};
  const t=timeToMin(time),d=timeToMin(state.settings.sleepDeadline);
  if(t<=d)return{success:true,msg:'按时上床 ✓'};
  if(reason==='work')return{success:true,msg:'晚起原因：工作/不可抗力 ✓'};
  return{success:false,msg:'超过23:30且非不可抗力'};
}
function judgeWake(time){
  if(!time)return{fitness:false,msg:'未打卡'};
  const t=timeToMin(time),d=timeToMin(state.settings.wakeDeadline);
  if(t<=d)return{fitness:true,msg:'起床达标 ✓'};
  return{fitness:false,msg:'超过5:20，健身变灰'};
}

/* ========== 日历（只读过去和今天） ========== */
function viewCalendar(){
  if(!calCursor){const d=parseD(todayStr());calCursor={y:d.getFullYear(),m:d.getMonth()}}
  const{y,m}=calCursor;
  const first=new Date(y,m,1);const startDay=first.getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const today=todayStr();const sch=computeSchedule();
  let html='';
  for(let i=0;i<startDay;i++)html+='<div class="cal-day empty"></div>';
  for(let day=1;day<=daysInMonth;day++){
    const key=`${y}-${pad2(m+1)}-${pad2(day)}`;
    const info=sch[key]||{};const rec=state.records[key];
    const isFuture=key>today;
    const cls=['cal-day'];
    if(key===today)cls.push('today');
    if(isFuture)cls.push('future');
    if(info.isBirthday)cls.push('birthday');
    if(info.isRest)cls.push('rest');
    if(info.isRestCandidate)cls.push('rest-candidate');
    if(info.type==='cooldown'||info.type==='future-cooldown')cls.push('cool');
    else if(info.isReward)cls.push('reward');
    else if(info.isMealDay)cls.push('meal');
    else if(info.type==='green')cls.push('green');
    else if(info.type==='partial')cls.push('partial');
    if(info.isJJRelease)cls.push('jj-release');
    const dots=[
      rec?.sleep?.success?'on sleep':'',
      rec?.study?.tier&&rec.study.tier!=='conservative'?'on study':'',
      rec?.jingji?.ok?'on jj':'',
      rec?.wake?.fitness?'on wake':''
    ].filter(Boolean).map(c=>`<i class="dot ${c}"></i>`).join('');
    html+=`<div class="${cls.join(' ')}" data-date="${key}" ${isFuture?'data-future="1"':''}><span class="cal-num">${day}</span><span class="cal-dots">${dots}</span></div>`;
  }
  const todayInfo=sch[today]||{};
  const canSmall=todayInfo.isReward===true;const canBig=todayInfo.isRest===true;
  const isLatestMonth=(y===parseD(today).getFullYear()&&m===parseD(today).getMonth());
  return `
  <div class="card"><div class="cal-head"><button data-act="calPrev">‹</button><div class="cal-title">${y}年${m+1}月</div><button data-act="calNext" ${isLatestMonth?'disabled style="opacity:.3"':''}>›</button></div>
    <div class="cal-week">${['日','一','二','三','四','五','六'].map(d=>`<span>${d}</span>`).join('')}</div>
    <div class="cal-grid">${html}</div>
  </div>
  <div class="card"><div class="card-t"><h3>图例</h3></div>
    <div style="display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--muted)">
      <span>🟢 全绿</span><span>🟡 部分</span><span>❄ 冷静</span>
      <span>◆ 减脂餐日</span><span>★ 奖励日</span><span>💧 释放日</span>
      <span>🎂 生日</span><span>🏖 休息日</span><span>? 候选</span>
    </div>
    <div class="hint" style="margin-top:8px;">日历只读过去和今天，未来日期不可查看。</div>
  </div>
  <div class="card"><div class="card-t"><h3>周期总结</h3></div>
    <div class="hint">小周期总结：小周期奖励日当天可下载。<br>大周期总结：大周期休息日当天可下载。</div>
    <div style="margin-top:10px;display:flex;flex-direction:column;gap:8px">
      <button class="btn btn-g btn-sm" style="width:100%" data-act="summarySmall" ${canSmall?'':'disabled'}>${canSmall?'下载最近小周期总结':'今日非小周期奖励日'}</button>

    </div>
  </div>`;
}

/* ========== 资金板块 ========== */
function viewFinance(){
  const today=todayStr();
  const thisMonth=state.expenses.filter(e=>e.date.slice(0,7)===today.slice(0,7));
  const spent=thisMonth.reduce((a,b)=>a+b.price,0);
  const remain=state.budget-spent;
  const pct=Math.min(100,(spent/state.budget)*100);
  const byCat={};
  thisMonth.forEach(e=>{byCat[e.catId]=(byCat[e.catId]||0)+e.price;});
  const catList=Object.entries(byCat).map(([id,v])=>({id,name:getCat(id).name,color:getCat(id).color,value:r2(v)})).sort((a,b)=>b.value-a.value);
  const ringColors=[];let acc=0;
  catList.forEach(c=>{const seg=(c.value/spent)*360;ringColors.push(`${c.color} ${acc}deg ${acc+seg}deg`);acc+=seg;});
  const ringStyle=spent>0?`conic-gradient(${ringColors.join(',')})`:`conic-gradient(rgba(255,255,255,.06) 0deg 360deg)`;
  const days7=[];
  for(let i=6;i>=0;i--){
    const d=addDays(parseD(today),-i);const k=fmtDate(d);
    const daySpent=state.expenses.filter(e=>e.date===k).reduce((a,b)=>a+b.price,0);
    const dayJunk=state.expenses.filter(e=>e.date===k).reduce((a,b)=>a+(getCat(b.catId).isJunk?b.price:0),0);
    days7.push({label:pad2(d.getDate()),spent:daySpent,junk:dayJunk});
  }
  const maxSpent=Math.max(...days7.map(x=>x.spent),1);
  return `
  <div class="fin-hero">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:12px;color:#8791a8;">本月剩余</span>
      <span style="font-size:10px;padding:3px 9px;border-radius:20px;background:rgba(91,140,255,.15);color:#8fb0ff;border:1px solid rgba(91,140,255,.3);">${pct.toFixed(0)}%</span>
    </div>
    <div class="fin-amount">¥${remain}</div>
    <div class="fin-sub">预算 ¥${state.budget} · 已花 ¥${spent}</div>
    <div style="height:6px;border-radius:6px;background:rgba(255,255,255,.06);margin:12px 0;overflow:hidden;">
      <div style="height:100%;border-radius:6px;width:${pct}%;background:${pct>90?'linear-gradient(90deg,#f87171,#fca5a5)':'linear-gradient(90deg,#5b8cff,#7c5cff)'};transition:width .5s;"></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:#8791a8;"><span>本月 ${thisMonth.length} 笔</span><span>食物 ${thisMonth.filter(e=>getCat(e.catId).isFood).length} 笔</span></div>
  </div>
  <div class="card">
    <div class="card-t"><h3>预算设置</h3></div>
    <div style="display:flex;gap:8px;align-items:center;">
      <input class="txt" type="number" id="inBudget" value="${state.budget}" placeholder="月度预算" style="flex:1">
      <button class="btn btn-p btn-sm" data-act="saveBudget" style="width:auto;padding:10px 16px;">保存</button>
    </div>
  </div>
  <div class="card">
    <div class="card-t"><h3>本月分类占比</h3><span class="sub">${catList.length} 类</span></div>
    ${spent>0?`<div class="donut-wrap">
      <div class="donut" style="background:${ringStyle}">
        <div class="donut-inner"><div><b>¥${spent}</b><span>总支出</span></div></div>
      </div>
      <div class="donut-legend">
        ${catList.slice(0,6).map(c=>`<div class="lg"><i style="background:${c.color}"></i><span class="nm">${esc(c.name)}</span><span class="vl">¥${c.value}</span></div>`).join('')}
      </div>
    </div>`:'<div class="hint">本月暂无支出</div>'}
  </div>
  <div class="card">
    <div class="card-t"><h3>最近 7 天趋势</h3></div>
    <div class="trend">
      ${days7.map(d=>`<div class="trend-bar"><div class="bar ${d.junk>0?'junk':''}" style="height:${(d.spent/maxSpent)*70}%;"></div><div class="lbl">${d.label}</div></div>`).join('')}
    </div>
    <div class="hint" style="text-align:center;">橙色 = 当天有垃圾食品支出</div>
  </div>
  <div class="card">
    <div class="card-t"><h3>最近记录</h3><span class="sub">近10笔</span></div>
    ${state.expenses.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10).map(e=>{
      const cat=getCat(e.catId);
      return `<div class="rec"><span class="rec-dot" style="background:${cat.color}"></span>
        <div class="rec-mid"><div class="rec-name">${esc(e.name)}</div>
        <div class="rec-meta"><span>${e.date}</span><span>${esc(cat.name)}</span></div></div>
        <span class="rec-amt ${cat.isJunk?'bad':''}">¥${e.price}</span>
      </div>`;
    }).join('')||'<div class="hint">还没有记录</div>'}
  </div>`;
}

  const startDate=fmtDate(addDays(parseD(today),-range+1));
  const recentFoods=state.expenses.filter(e=>e.date>=startDate&&e.date<=today&&getCat(e.catId).isFood);
  const totalCount=recentFoods.length;
  const totalAmount=recentFoods.reduce((a,b)=>a+b.price,0);
  const byCat={};
  recentFoods.forEach(e=>{byCat[e.catId]=(byCat[e.catId]||0)+1;});
  const catList=Object.entries(byCat).map(([id,count])=>{const c=getCat(id);return {id,name:c.name,color:c.color,count,isJunk:c.isJunk};}).sort((a,b)=>b.count-a.count);
  const ringColors=[];let acc=0;
  catList.forEach(c=>{const seg=(c.count/totalCount)*360;ringColors.push(`${c.color} ${acc}deg ${acc+seg}deg`);acc+=seg;});

  </div>
  <div class="card">
    <div class="card-t"><h3>今日吃了什么</h3><span class="sub">来自用钱记录</span></div>
    ${todayFoods.length>0?todayFoods.map(e=>{
      const cat=getCat(e.catId);
      return `<div class="rec"><span class="rec-dot" style="background:${cat.color}"></span>
        <div class="rec-mid"><div class="rec-name">${esc(e.name)}</div>
        <div class="rec-meta"><span>${esc(cat.name)}</span>${cat.isJunk?'<span style="color:#fca5a5">· 垃圾</span>':'<span>· 正常</span>'}</div></div>
        <span class="rec-amt ${cat.isJunk?'bad':''}">¥${e.price}</span>
      </div>`;
    }).join(''):'<div class="hint">今天还没有食物记录</div>'}
    ${todayFoods.length===0?'':dietOk?`<div class="task-result ok" style="margin-top:8px;">✓ 今日饮食正常</div>`:`<div class="task-result bad" style="margin-top:8px;">⚠ 今日饮食异常</div>`}
  </div>
  <div class="card">
    <div class="card-t"><h3>近30天分类占比</h3><span class="sub">${totalCount} 项 · ¥${totalAmount.toFixed(0)}</span></div>
    ${totalCount>0?`<div class="donut-wrap">
      <div class="donut" style="background:${ringStyle}">
        <div class="donut-inner"><div><b>${totalCount}</b><span>总食物</span></div></div>

      <div class="donut-legend">
        ${catList.map(c=>`<div class="lg"><i style="background:${c.color}"></i><span class="nm">${esc(c.name)}</span><span class="vl" style="${c.isJunk?'color:#fca5a5;':''}">${c.count}项</span></div>`).join('')}

      ${days7.map(d=>`<div class="trend-bar"><div class="bar food ${d.junk>0?'junk':''}" style="height:${(d.count/maxCount)*70}%;"></div><div class="lbl">${d.label}</div></div>`).join('')}

/* ========== Toast / Sheet ========== */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),2200)}
function openSheet(html,mount){const l=$('#layer');l.innerHTML=`<div class="mask" id="mask"><div class="sheet">${html}</div></div>`;const mk=$('#mask');mk.addEventListener('click',e=>{if(e.target===mk)closeSheet()});if(mount)mount($('.sheet'))}
function closeSheet(){$('#layer').innerHTML=''}

/* ========== 全局点击 ========== */
document.addEventListener('click',e=>{
  const tab=e.target.closest('.tab');
  if(tab){activeTab=tab.dataset.tab;scrollPos=0;render(false);window.scrollTo(0,0);return}
  if(e.target.closest('#undoBtn')){doUndo();return}
  const el=e.target.closest('[data-act],[data-date],[data-checkin],[data-reset],[data-add-tag],[data-jj-set],[data-sleep-reason],[data-card],[data-rm-tag],[data-edit-tag],[data-rm-cat],[data-edit-cat],[data-rm-pending],[data-rm-expense],[data-future]');
  if(!el)return;
  if(el.dataset.future!==undefined){toast('不能查看未来的日期');return}
  // 删除待记录
  if(el.dataset.rmPending!==undefined){e.stopPropagation();const today=todayStr();const r=getRecord(today);if(r._moneyPending)r._moneyPending=r._moneyPending.filter(p=>p.id!==el.dataset.rmPending);saveState();render();return}
  // 删除已提交支出
  if(el.dataset.rmExpense!==undefined){
    e.stopPropagation();
    if(confirm('删除这条记录？')){
      pushUndo('删除支出');
      state.expenses=state.expenses.filter(x=>x.id!==el.dataset.rmExpense);
      saveState();render();toast('已删除');
    }
    return;
  }
  // 点击标签（记录页加到 pending）
  if(el.dataset.addTag!==undefined){
    const tag=getTag(el.dataset.addTag);if(!tag)return;
    const today=todayStr();const r=getRecord(today);
    if(!r._moneyPending)r._moneyPending=[];
    r._moneyPending.push({id:nid('p'),tagId:tag.id,name:tag.name,price:tag.price,catId:tag.catId});
    saveState();render();
    const cat=getCat(tag.catId);
    toast(`已添加：${tag.name} ¥${tag.price}${cat.isJunk?' ⚠':''}`);
    return;
  }
  // 删除标签
  if(el.dataset.rmTag!==undefined){
    e.stopPropagation();
    const t=getTag(el.dataset.rmTag);
    if(confirm(`删除标签「${t.name}」？历史支出不受影响。`)){
      state.tags=state.tags.filter(x=>x.id!==el.dataset.rmTag);
      saveState();render();
    }
    return;
  }
  // 编辑标签
  if(el.dataset.editTag!==undefined && !e.target.closest('[data-rm-tag]')){
    const tag=getTag(el.dataset.editTag);if(!tag)return;
    openSheet(`
      <h3>编辑标签</h3>
      <label class="fl">名称</label>
      <input class="txt" id="etName" value="${esc(tag.name)}">
      <div class="row2" style="margin-top:0;">
        <div>
          <label class="fl">价格</label>
          <input class="txt" type="number" step="0.01" id="etPrice" value="${tag.price}">
        </div>
        <div>
          <label class="fl">所属大类</label>
          <select class="txt" id="etCat">
            ${state.cats.map(c=>{
              const cnt=state.tags.filter(t=>t.catId===c.id).length;
              return `<option value="${c.id}" ${c.id===tag.catId?'selected':''}>${esc(c.name)}（${cnt}个标签）${c.isFood?'':' ·非食物'}${c.isJunk?' ·⚠垃圾':''}</option>`;
            }).join('')}
          </select>
        </div>
      </div>
      <div class="close-row">
        <button class="btn btn-g" onclick="closeSheet()">取消</button>
        <button class="btn btn-p" id="etSave">保存</button>
      </div>
    `,sheet=>{
      sheet.querySelector('#etSave').onclick=()=>{
        const name=sheet.querySelector('#etName').value.trim();
        if(!name){toast('请输入名称');return}
        tag.name=name;
        tag.price=parseFloat(sheet.querySelector('#etPrice').value)||0;
        tag.catId=sheet.querySelector('#etCat').value;
        saveState();closeSheet();render();toast('已更新');
      };
    });
    return;
  }
  // 删除大类（连带删标签）
  if(el.dataset.rmCat!==undefined){
    const id=el.dataset.rmCat;const cat=getCat(id);
    const cnt=state.tags.filter(t=>t.catId===id).length;
    if(confirm(`删除大类「${cat.name}」？\n会连带删除该大类下的 ${cnt} 个标签。\n历史支出保留。`)){
      pushUndo('删除大类');

/* ========== 打卡 ========== */
function doCheckin(project){
  const today=todayStr();const rec=getRecord(today);
  const sch=computeSchedule();const info=sch[today]||{};
  const isReward=info.isReward;
  if(info.isRest){toast('今天是休息日，无需打卡');return}
  if(rec.birthdayCard){toast('今天是生日豁免日，无需打卡');return}
  if(rec.confirmed){toast('今天已确认');return}
  pushUndo('打卡：'+project);
  if(project==='sleep'){
    if(!inSleepWindow()){toast('不在睡觉打卡窗口（23:00-次日5:00）');return}
    const t=nowTimeStr();const j=judgeSleep(t,rec.sleepReason);
    rec.sleep={time:t,success:j.success,msg:j.msg,checked:true};
    saveState();render();
    if(!j.success)popupFail('睡觉',j.msg);else toast('睡觉打卡成功 ✓ '+t);
    return;
  }
  if(project==='wake'){
    if(!inWakeWindow()){toast('不在起床打卡窗口（4:00-7:00）');return}
    const t=nowTimeStr();const j=judgeWake(t);
    rec.wake={time:t,fitness:j.fitness,msg:j.msg,checked:true};
    saveState();render();
    if(!j.fitness)popupFail('起床',j.msg);else toast('起床打卡成功 ✓ '+t);
    return;
  }
  if(project==='fitness'){
    if(!rec.wake||!rec.wake.fitness){toast('起床未达标');return}
    rec.fitness={checked:true,time:nowTimeStr()};
    saveState();render();toast('健身打卡成功 ✓');
    return;
  }
  if(project==='study'){
    const h=parseFloat($('#in_study').value);
    if(!h||h<=0){toast('请输入学习小时数');return}
    const j=judgeStudy(h,isReward);
    rec.study={hours:h,tier:j.tier,label:j.label,msg:j.msg,checked:true};
    saveState();render();
    if(j.tier.startsWith('cool'))popupFail('学习',j.msg);
    else if(j.tier==='conservative')toast('保守打卡，不计入积累');
    else toast('学习打卡成功 ✓');
    return;
  }
  if(project==='jingji'){
    if(!rec._jjPending){toast('请先选择状态');return}
    const ok=rec._jjPending==='ok';
    rec.jingji={ok,broken:!ok,msg:ok?'坚持住了 ✓':'破戒，周期从0重新计数，释放日延后',checked:true};
    delete rec._jjPending;
    if(ok){state.jj.current++;if(state.jj.current>=state.jj.cycleLength){state.jj.completed++;state.jj.lastReleaseDate=today;state.jj.cycleLength+=state.settings.jjIncrement;state.jj.current=0;}}
    else {state.jj.current=0;}
    saveState();render();
    if(!ok)popupFail('养精蓄锐','破戒，周期从0重新计数。今天不算新周期开始，从明天才开始记新周期第1天，释放日自动延后。');
    else toast('养精蓄锐 ✓');
    return;
  }
}

  openSheet(`<h3 style="color:#fca5a5">⚠ ${project} 打卡失败</h3>
    <div style="font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:10px;">

/* ========== 卡包 ========== */
function useCard(id){
  if(state.cards[id]<=0){toast('这张卡用完了');return}
  const last=state.cards._lastUse[id];const today=todayStr();
  if(last){const diff=Math.abs(diffDays(parseD(last),parseD(today)));if(diff<7&&id!=='reset'&&id!=='birthday'){toast('同一张卡7天内只能一次');return}}
  const sch=computeSchedule();const info=sch[today]||{};
  if(info.isRest&&id!=='birthday'){toast('休息日无需用卡');return}
  if(id==='birthday'){
    if(state.birthdayCard.used){toast('生日卡已使用');return}
    if(!canUseBirthdayCard(today)){toast('生日卡只能在生日前后10天内使用');return}
  }
  const rec=getRecord(today);pushUndo('使用卡包：'+id);
  if(id==='protect'){rec.protect=true;toast('保护卡已使用')}
  else if(id==='sick'){rec.sick=true;toast('病假卡已使用')}
  else if(id==='makeup'){
    rec.jingji={ok:true,checked:true,msg:'补签'};
    if(!rec.study)rec.study={hours:9,tier:'normal',checked:true,label:'正常'};
    if(!rec.sleep)rec.sleep={time:'23:00',success:true,checked:true,msg:'补签'};
    if(!rec.wake)rec.wake={time:'05:00',fitness:true,checked:true,msg:'补签'};
    toast('补签卡已使用');
  }
  else if(id==='clean'){rec.cleanCard=true;toast('打扫卡已使用，学习减1h15min')}
  else if(id==='birthday'){
    state.birthdayCard.used=true;state.birthdayCard.usedDate=today;rec.birthdayCard=true;
    saveState();render();showBirthdayCelebration();
    toast('🎂 生日快乐！今天全部豁免');
    return;
  }
  else if(id==='reset'){rec._cycleReset=true;toast('周期已重置')}
  state.cards[id]--;state.cards._lastUse[id]=today;saveState();render();
}

/* ========== 总结下载 ========== */
function downloadSummary(type){
  const sch=computeSchedule();const today=todayStr();const ti=sch[today]||{};
  if(type==='small'&&!ti.isReward){toast('小周期总结仅奖励日可下载');return}
  if(type==='big'&&!ti.isRest){toast('大周期总结仅休息日可下载');return}
  const rds=Object.keys(sch).filter(k=>sch[k].isReward).sort();
  const rss=Object.keys(sch).filter(k=>sch[k].isRest).sort();
  let endKey=type==='small'?rds.filter(k=>k<=today).pop():rss.filter(k=>k<=today).pop();
  if(!endKey){toast('还没有可下载的总结');return}
  const endDate=parseD(endKey);const startDate=addDays(endDate,type==='small'?-7:-31);
  const lines=[`自律花园 · ${type==='small'?'小周期':'大周期'}总结`,`周期：${fmtDate(startDate)} ~ ${endKey}`,''];
  lines.push('日期,睡觉,起床,学习(h),用钱状态,饮食状态,养精蓄锐,冷静期,确认');
  let d=new Date(startDate);
  while(d<=endDate){
    const k=fmtDate(d);const r=state.records[k]||{};const info=sch[k]||{};
    const jjVal=r.jingji?.ok?'✓':(info.isJJRelease?'💧释放':(r.jingji?.broken?'破戒':''));
    lines.push([k,r.sleep?.time||'',r.wake?.time||'',r.study?.hours||'',isMoneyOk(k)?'正常':'异常',isDietOk(k)?'正常':'异常',jjVal,info.type==='cooldown'?'是':'',r.confirmed?'✓':''].join(','));
    d.setDate(d.getDate()+1);
  }
  const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=`自律花园_${type==='small'?'小周期':'大周期'}_${endKey}.csv`;a.click();URL.revokeObjectURL(url);toast('已下载');
}

  currentUser = user;
  if (!currentUser) {
    const { data, error } = await supabase.auth.signInAnonymously();
    if (error) { toast('云端连接失败，请检查网络'); return; }
    currentUser = data.user;
  }
  
  // 2. 从云端加载数据
  await loadFromCloud();
}
async function loadFromCloud() {
  if (!currentUser) return;
  const { data, error } = await supabase.from('garden_data').select('data').eq('user_id', currentUser.id).maybeSingle();
  if (error) { console.error('加载失败:', error); return; }
  
  if (data && data.data) {
    state = Object.assign(defaultState(), data.data);
    migrate();
    saveState(true); 
  } else {
    state = defaultState();
  }
  render(false);
}

async function saveState(silent) {
  state.updatedAt = new Date().toISOString();
  
  // 1. 先存到本地缓存（防止断网丢失）
  try { localStorage.setItem(LS_STATE, JSON.stringify(state)); } catch(e) {}
  
  // 2. 再同步到云端
  if (!currentUser) return;
  const { error } = await supabase.from('garden_data').upsert({
    user_id: currentUser.id,
    data: state,
    updated_at: new Date().toISOString()
  }, { onConflict: 'user_id' });
    
  if (error) {
    console.error('云端保存失败:', error);
    if (!silent) toast('数据已存本地，云端同步失败');
  }
}

// 启动云端初始化
initCloud();
</script>
</body>
</html>
