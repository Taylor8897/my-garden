  state.points = (state.points || 0) - def.cost;
  state.cards = state.cards || {};
  state.cards[id] = (state.cards[id] || 0) + 1;
  state.funcBuy.counts[id] = (state.funcBuy.counts[id] || 0) + 1;
  saveState(); render();
  toast('已兑换 ' + def.name + '，库存 +1');
  return true;
}
const MEAL_COUPONS = [
  { id:'stir',   name:'炒菜券',     cost:5,  cap:40,  cool:10, valid:30 },
  { id:'dine',   name:'堂食券',     cost:6,  cap:60,  cool:12, valid:30 },
  { id:'sweet',  name:'甜品糖水券', cost:7,  cap:35,  cool:15, valid:30 },
  { id:'grill',  name:'干锅烤肉券', cost:8,  cap:90,  cool:15, valid:45 },
  { id:'hotpot', name:'火锅券',     cost:8,  cap:90,  cool:15, valid:45 },
  { id:'gather', name:'通用聚餐券', cost:8,  cap:120, cool:15, valid:45 },
  { id:'fast',   name:'快餐券',     cost:9,  cap:50,  cool:20, valid:30 },
  { id:'buffet', name:'自助餐券',   cost:10, cap:240, cool:20, valid:45 }
];
const MEAL_WEEKEND_ONLY = [];
function isWeekendDay(dateStr){
  const d = parseD(dateStr || getDayLifeDay());
  const w = d.getDay();
  return (0 === w || 6 === w);
}
const MEAL_TIME_RULES = {
  fast:   [11*60, 15*60, '午餐 11:00-15:00'],
  sweet:  [14*60, 22*60, '下午茶 14:00-22:00'],
  hotpot: [17*60, 23*60, '晚餐 17:00-23:00'],
  grill:  [17*60, 23*60, '晚餐 17:00-23:00'],
  buffet: [17*60, 23*60, '晚餐 17:00-23:00'],
  gather: [17*60, 23*60, '晚餐 17:00-23:00']
};
function mealTimeBlocked(typeId){
  const rule = MEAL_TIME_RULES[typeId];
  if(!rule) return '';
  const m = nowMin();
  if(rule[0] > m || m > rule[1]) return '这张券只能在' + rule[2] + '使用';
  return '';
}
function mealDateBlocked(typeId, dateStr){
  if(0 > MEAL_WEEKEND_ONLY.indexOf(typeId)) return '';
  if(isWeekendDay(dateStr)) return '';
  return '这张券只能周末用（六、日）';
}
const MEAL_STACK_CAP = 150;
const MEAL_BUFFET_CAP = 240;

function getMealDef(id){
  for(let i = 0; MEAL_COUPONS.length > i; i++){ if(MEAL_COUPONS[i].id === id) return MEAL_COUPONS[i]; }
  return null;
}
function getActiveMealCoupons(){
  const today = getDayLifeDay();
  return (state.coupons || []).filter(c => c.status !== 'used' && (!c.expire || c.expire >= today));
}
function getLastMealExchange(typeId){
  const log = state.couponLog || [];
  for(let i = 0; log.length > i; i++){
    if(log[i].typeId === typeId && log[i].act === 'exchange') return log[i].date;
  }
  return '';
}
function mealCoolRemain(typeId){
  const def = getMealDef(typeId); if(!def) return 0;
  const last = getLastMealExchange(typeId);
  if(!last) return 0;
  const gap = diffDays(parseD(last), parseD(getDayLifeDay()));
  return gap >= def.cool ? 0 : (def.cool - gap);
}
function canExchangeMeal(typeId){
  const def = getMealDef(typeId);
  if(!def) return { ok:false, msg:'未知券' };
  if(def.cost > (state.points || 0)) return { ok:false, msg:'积分不足（需 ' + def.cost + ' 分）' };
  const mine = getActiveMealCoupons().filter(c => c.typeId === typeId);
  if(mine.length >= 2) return { ok:false, msg:'同类券最多同时持有 2 张' };
  const cool = mealCoolRemain(typeId);
  if(cool > 0) return { ok:false, msg:'该券冷却中，还需 ' + cool + ' 天' };
  const others = getActiveMealCoupons().filter(c => c.typeId !== 'buffet');
  let usedCap = 0;
  for(let i = 0; others.length > i; i++) usedCap += (others[i].cap || 0);
  if(typeId === 'buffet'){
    const buffetCap = getActiveMealCoupons().filter(c => c.typeId === 'buffet').reduce((a,b) => a + (b.cap||0), 0);
    if(buffetCap + def.cap > MEAL_BUFFET_CAP) return { ok:false, msg:'自助餐券叠加超上限（' + MEAL_BUFFET_CAP + '）' };
  } else if(usedCap + def.cap > MEAL_STACK_CAP){
    return { ok:false, msg:'叠加额度超上限（最多 ' + MEAL_STACK_CAP + '）' };
  }
  return { ok:true, def:def };
}
function exchangeMealCoupon(typeId){
  const r = canExchangeMeal(typeId);
  if(!r.ok){ toast(r.msg); return false; }
  const def = r.def;
  const today = getDayLifeDay();
  pushUndo('兑换' + def.name);
  state.points = (state.points || 0) - def.cost;
  logAudit('coupon', '兑换 ' + def.name + '（-' + def.cost + ' 分）');
  state.coupons = state.coupons || [];
  state.coupons.push({
    id: nid('cp_'), typeId: def.id, name: def.name, cap: def.cap,
    status: 'unused', createdAt: today,
    expire: fmtDate(addDays(parseD(today), def.valid))
  });
  state.couponLog = state.couponLog || [];
  state.couponLog.unshift({ id: nid('cl_'), act:'exchange', typeId: def.id, name: def.name, date: today, ts: Date.now() });
  if(state.couponLog.length > 300){ state.couponLog.length = 300; }
  saveState(); render();
  toast('已兑换「' + def.name + '」· 有效期至 ' + fmtDate(addDays(parseD(today), def.valid)));
  return true;
}
function submitMealCoupon(couponId, shopName, foodName, price){
  const cp = (state.coupons || []).find(c => c.id === couponId);
  if(!cp){ toast('券不存在'); return false; }
  if(cp.status === 'used'){ toast('这张券已经用过了'); return false; }
  const tB = mealTimeBlocked(cp.typeId);
  if(tB){ toast(tB); return false; }
  const amt = Number(price) || 0;
  if(!shopName || !foodName){ toast('请填写店名和吃了什么'); return false; }
  if(0 >= amt){ toast('请填写金额'); return false; }
  const over = amt > cp.cap;
  pushUndo('使用' + cp.name);
  state.expenses = state.expenses || [];
  state.expenses.push({
    id: nid('e_'), date: getDayLifeDay(), name: shopName + ' · ' + foodName,
    price: amt, catId: 'c_normal', isCoupon: true, couponId: cp.id, couponType: cp.typeId
  });
  cp.status = 'used';
  logAudit('coupon', '使用 ' + cp.name + '（¥' + amt.toFixed(2) + '）');
  cp.usedAt = getDayLifeDay();
  cp.usedPrice = amt;
  state.couponLog = state.couponLog || [];
  state.couponLog.unshift({ id: nid('cl_'), act:'use', typeId: cp.typeId, name: cp.name, date: getDayLifeDay(), price: amt, ts: Date.now() });
  saveState(); render();
  toast(over ? ('已记录，超出额度 ¥' + (amt - cp.cap).toFixed(2) + ' 按普通支出算') : '券已使用，已记账');
  return true;
}

function toast(m){
  const t = $('#toast');
  t.textContent = m;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove('show'), 2400);
}
function showDinnerPausePrompt(){
  openSheet('<h3>🍽 饭后 30 分钟</h3><div style="font-size:13px;color:var(--muted);line-height:1.9"><p>饱腹信号大约要 20–40 分钟才到位，现在还想吃是正常的。</p><p style="margin-top:8px;color:var(--accent)">再等 30 分钟，如果还想吃再决定。</p></div><div id="dinnerCd" style="text-align:center;font-size:34px;font-weight:800;color:var(--accent);margin:16px 0;font-variant-numeric:tabular-nums;">30:00</div><div class="close-row" style="flex-direction:column;gap:8px"><button class="btn btn-p" id="dinnerWin">我坚持住了 ✓</button><button class="btn btn-g" id="dinnerAte">我还是吃了</button></div>', function(s){
    let left = 30 * 60;
    const el = s.querySelector('#dinnerCd');
    if(window._dinnerTimer) clearInterval(window._dinnerTimer);
    window._dinnerTimer = setInterval(function(){ left--; if(left <= 0){ clearInterval(window._dinnerTimer); el.textContent = '时间到'; return; } el.textContent = pad2(Math.floor(left/60)) + ':' + pad2(left % 60); }, 1000);
    s.querySelector('#dinnerWin').onclick = function(){ clearInterval(window._dinnerTimer); closeSheet(); toast('坚持住了，很棒 ✓'); };
    s.querySelector('#dinnerAte').onclick = function(){ clearInterval(window._dinnerTimer); closeSheet(); toast('如实记录就好，下次继续'); };
  });
}
function openSheet(html, mount){
  const l = $('#layer');
  l.innerHTML = `<div class="mask" id="mask"><div class="sheet">${html}</div></div>`;
  const mk = $('#mask');
  mk.addEventListener('click', e => { if(e.target === mk) closeSheet(); });
  if(mount) mount($('.sheet'));
}
function closeSheet(){ $('#layer').innerHTML = ''; }

      ch.onclick = () => {
        const v = ch.dataset.val;
        if(selEmo.has(v)){ selEmo.delete(v); ch.classList.remove('on'); }
        else { selEmo.add(v); ch.classList.add('on'); }
      };
    });
    sheet.querySelectorAll('#srcChips .chip').forEach(ch => {
      ch.onclick = () => {
        const v = ch.dataset.val;
        if(selSrc.has(v)){ selSrc.delete(v); ch.classList.remove('on'); }
        else { selSrc.add(v); ch.classList.add('on'); }
      };
    });
    sheet.querySelector('#cancelBtn').onclick = closeSheet;
    sheet.querySelector('#saveBtn').onclick = () => {
      const target = sheet.querySelector('#targetInput').value.trim();
      const note = sheet.querySelector('#noteInput').value.trim();
      const intensity = parseInt(range.value, 10);
      if(!target){ toast('请填写冲动对象'); return; }
      if(!selEmo.size){ toast('请至少选一个情绪'); return; }
      const sKey = type === 'resist' ? 'resistStreak' : 'restartStreak';
      const rec = addAction({ type, result, intensity, target, emotions:[...selEmo], sources:[...selSrc], note });
      closeSheet();
      render();
      if(rec._tierReached){
        playCheer(state[sKey].current, rec._tierReached);
        setTimeout(() => toast(`🎁 已发放「${rec._tierReached.label}」到明天的卡包`), 1200);
      } else if(result === 'success' && intensity >= INTENSITY_MIN){
        playCheer(state[sKey].current, null);
      } else if(result === 'fail'){
        playCheer(0, null);
        setTimeout(() => toast('记录下来 · 从中学习'), 800);
      } else {
        toast('已记录（强度不足，未计入连续）');
      }
    };
  });
}

/* ============================================================
   核对弹窗
   ============================================================ */
function showConfirmSheet(){
  const today = getDayLifeDay();
  const rec = state.records[today] || {};
  const sch = computeSchedule();
  const info = sch[today] || {};
  const isJJRelease = info.isJJRelease;
  const rows = [];
  const push = (icon, name, val, ok, auto) => rows.push(`<div class="task-result ${ok?'ok':'bad'}" style="display:flex;align-items:center;gap:8px;margin-bottom:6px;"><span style="font-size:16px;width:22px;text-align:center;">${icon}</span><span style="flex:1;font-size:12.5px;">${name}${auto?'（自动）':''}</span><span style="font-size:12px;">${val}</span></div>`);
  const todayExpenses = getDayExpenses(today);
  push('🌙','睡觉', rec.sleep?`${rec.sleep.time} ${rec.sleep.success?'✓':'✗'}`:'—', rec.sleep?.success);
  push('☀','起床', rec.wake?`${rec.wake.time} ${rec.wake.fitness?'✓':'✗'}`:'—', rec.wake?.checked);
  push('📚','学习', rec.study?`${rec.study.hours}h · ${rec.study.label}`:'—', rec.study?.tier==='normal'||rec.study?.tier==='reward');
  push('💰','用钱', `${todayExpenses.length}笔 · ${isMoneyOk(today)?'正常':'异常'}`, isMoneyOk(today));
  push('🥗','饮食', `${getDayFoods(today).length}项 · ${isDietOk(today)?'正常':'异常'}`, isDietOk(today));
  if(isJJRelease && (!rec.jingji || !rec.jingji.checked)){ push('🧘','养精蓄锐', '💧 释放日自动成功', true, true); }
  else { push('🧘','养精蓄锐', rec.jingji?`${rec.jingji.ok?'✓':'破戒'}`:'—', rec.jingji?.ok); }
  if(rec.fitness && rec.fitness.checked){
    rows.push(`<div class="task-result" style="opacity:.7;margin-bottom:6px;"><span style="font-size:16px;width:22px;text-align:center;">💪</span><span style="flex:1;font-size:12.5px;">健身（选做）</span><span style="font-size:12px;">已打卡</span></div>`);
  }
  const cd = getDayCooldown(rec, today);
  let coolNote = '';
  if(cd.total > 0){
    coolNote = `<div class="cool-detail" style="margin-top:12px"><b>❄ 今天触发的冷静期合计：${cd.total}天</b>${cd.breakdown.map(b => `<div class="cd-row"><span>${esc(b.name)}</span><span>+${b.days}天</span></div>`).join('')}</div>`;
  }
  openSheet(`<h3>核对今天的打卡信息</h3>
    <div style="margin:12px 0;">${rows.join('')}</div>
    ${coolNote}
    <div class="close-row"><button class="btn btn-g" id="needEdit">有错误，需要修改</button><button class="btn btn-p" id="confirmOk">确认无误</button></div>`, sheet => {
    sheet.querySelector('#needEdit').onclick = () => { const r = getRecord(today); r._editMode = true; saveState(); closeSheet(); render(); toast('已进入修改模式'); };
    sheet.querySelector('#confirmOk').onclick = () => { const r = getRecord(today); r.confirmed = true; r._editMode = false; saveState(); closeSheet(); render(); toast('已确认 ✓'); };
  });
}

/* ============================================================
   打卡逻辑
   ============================================================ */
function doCheckin(project, extra){
  const today = project === 'sleep' ? getSleepLifeDay() : getDayLifeDay();
  const rec = getRecord(today);
  const info = computeSchedule()[today] || {};
  const isReward = info.isReward;
  const type = getTodayType();

  if(info.isRest){ toast('休息日无需打卡'); return; }
  if(rec.birthdayCard){ toast('生日豁免日'); return; }

  // 休息日轻打卡
  if(type === 'rest'){
    pushUndo('休息日记录：' + project);
    if(project === 'sleep') rec.sleep = { time:nowTimeStr(), success:true, msg:'休息日记录', checked:true, restDay:true };
    else if(project === 'wake') rec.wake = { time:nowTimeStr(), fitness:true, msg:'休息日记录', checked:true, restDay:true };
    else if(project === 'study'){
            const h = parseFloat($('#in_study') && $('#in_study').value);
      if(!h || 0 >= h){ toast('请输入小时数'); return; }
      rec.study = { hours:h, tier:'rest', label:'休息日记录', checked:true, restDay:true };
    }
    else if(project === 'fitness') rec.fitness = { checked:true, time:nowTimeStr(), restDay:true };
    else if(project === 'jingji') rec.jingji = { ok:true, msg:'休息日记录', checked:true, restDay:true };
    saveState(); render(); toast('已记录（休息日不作数）');
    return;
  }

  pushUndo('打卡：' + project);

  if(project === 'sleep'){
    if(!inSleepWindow()){ toast('不在打卡窗口（23:00-次日5:00）'); return; }
    const t = nowTimeStr();
    const j = judgeSleep(t, rec.sleepReason);
    // 晚睡原因弹窗
    if(!j.success && !rec.sleepReason){
      openSheet(`<h3>晚睡原因</h3>
        <div style="font-size:13px;color:var(--muted);line-height:1.8;">
          <p>当前时间 <b style="color:#fff">${t}</b>，已超过截止时间 ${state.settings.sleepDeadline}。</p>
          <p style="margin-top:10px">请选择晚睡原因：</p>
        </div>
        <div class="chips" style="margin-top:14px;">
          <div class="chip" data-pick="work">工作 / 不可抗力</div>
          <div class="chip" data-pick="fun">娱乐 / 自己拖的</div>
        </div>`, s => {
        s.querySelectorAll('[data-pick]').forEach(ch => {
          ch.onclick = () => {
            const reason = ch.dataset.pick;
            const j2 = judgeSleep(t, reason);
            const rec2 = getRecord(today);
            rec2.sleep = { time:t, success:j2.success, msg:j2.msg, checked:true };
            delete rec2.sleepReason;
            closeSheet(); saveState(); render();
            toast(j2.success ? '睡觉打卡 ✓ ' + j2.msg : '睡觉打卡 ✗ ' + j2.msg);
          };
        });
      });
      return;
    }
    rec.sleep = { time:t, success:j.success, msg:j.msg, checked:true };
    delete rec.sleepReason;
    saveState(); render();
    toast(j.success ? '睡觉打卡成功 ✓ ' + t : '睡觉未达标');
    return;
  }

  if(project === 'wake'){
    if(!inWakeWindow()){ toast('不在打卡窗口'); return; }
    const t = nowTimeStr();
    const j = judgeWake(t, isReward ? 'reward' : 'normal');
    const isRewardLate = (isReward && !j.fitness);
    rec.wake = { time:t, fitness:j.fitness, green:j.green, fail:j.fail, msg:j.msg, checked:true, isRewardLate };
    saveState(); render();
    toast(j.fitness ? '起床打卡成功 ✓ ' + t : '起床未达标 · ' + j.msg);
    return;
  }

  if(project === 'fitness'){
    if(!rec.wake || !rec.wake.checked){ toast('请先打卡起床'); return; }
    const m = [30,45,60].indexOf(Number(extra)) >= 0 ? Number(extra) : 30;
    rec.fitness = { checked:true, time:nowTimeStr(), minutes:m, label:m + ' 分钟', tier:m, points:1 };
    if(!rec.fitnessPaid){
      rec.fitnessPaid = true;
      try { addPoints(1, 'fitness', '健身 ' + m + ' 分钟'); } catch(e){}
    }
    logAudit('points', '健身完成 ' + m + ' 分钟（+1 分）');
    saveState(); render(); toast('健身完成 ' + m + ' 分钟 ✓ +1 分');
    return;
  }

    if(project === 'study'){
    const h = parseFloat($('#in_study') && $('#in_study').value);
    if(!h || 0 >= h){ toast('请输入学习小时数'); return; }
    const cleanActive = state.cardEffects && state.cardEffects.cleanDate === today;
    const j = judgeStudy(h, isReward, cleanActive);
    rec.study = { hours:h, eff: (h + (cleanActive?1:0)), tier:j.tier, label:j.label, msg:j.msg, isGreen:j.isGreen, checked:true };
    saveState(); render();
    if(j.tier.startsWith('cool')){
      toast('学习未达标 · ' + j.msg);
    } else if(j.tier === 'recovery'){
      toast('恢复日，不计入全绿');
    } else {
      toast('学习打卡成功 ✓');
    }
    return;
  }

  if(project === 'jingji'){
    if(!rec._jjPending){ toast('请先选择状态'); return; }
    const ok = rec._jjPending === 'ok';
    rec.jingji = { ok, broken:!ok, msg: ok?'坚持住了 ✓':'破戒，周期重新计数', checked:true };
    delete rec._jjPending;
    if(ok){
      state.jj.current++;
      if(state.jj.current >= state.jj.cycleLength){
        state.jj.completed++;
        state.jj.lastReleaseDate = today;
        state.jj.cycleLength += state.settings.jjIncrement;
        state.jj.current = 0;
        state.jjBank = (state.jjBank || 0) + 1;
        logAudit('points', '养精蓄锐完成 1 个周期，累积 +1（共 ' + state.jjBank + '）');
        toast('养精蓄锐周期完成！已累积 ' + state.jjBank + ' 个');
      }
    } else { state.jj.current = 0; }
    saveState(); render();
    toast(ok ? '养精蓄锐 ✓' : '破戒，周期重置');
    return;
  }
}

/* ============================================================
   总结报告生成器
   ============================================================ */
function downloadReport(type){
  const isSmall = type === 'small';
  const days = isSmall ? 7 : 31;
  const today = getDayLifeDay();
  const endDate = today;
  const startDate = fmtDate(addDays(parseD(today), -(days - 1)));
  const sch = computeSchedule();
  const dayList = [];
  for(let i = days - 1; i >= 0; i--){
    const d = addDays(parseD(today), -i);
    const k = fmtDate(d);
    const rec = state.records[k] || {};
    const info = sch[k] || {};
    const dayExp = state.expenses.filter(e => e.date === k);
    const dayFoods = dayExp.filter(e => getCat(e.catId).isFood);
    const dayJunk = dayFoods.filter(e => getCat(e.catId).isJunk);
    const dayViolations = state.violations.filter(v => v.date === k);
    let score = 0;
    if(rec.sleep && rec.sleep.success) score++;
    if(rec.wake && rec.wake.fitness) score++;
    if(rec.study && (rec.study.isGreen === true || rec.study.tier === 'normal' || rec.study.tier === 'reward')) score++;
    if(dayExp.length > 0 && isMoneyOk(k)) score++;
    if(dayExp.length > 0 && isDietOk(k)) score++;
    if((rec.jingji && rec.jingji.checked && rec.jingji.ok === true) || info.isJJRelease) score++;
    dayList.push({
      date:k, day:+k.slice(8), score, total:6,
      sleep:rec.sleep||null, wake:rec.wake||null, study:rec.study||null, jingji:rec.jingji||null,
      info, spent: dayExp.reduce((a,b) => a + (b.price||0), 0),
      foodCount: dayFoods.length, junkCount: dayJunk.length,
      violations: dayViolations, expenseCount: dayExp.length
    });
  }
  const actionsInRange = state.actions.filter(a => a.date >= startDate && endDate >= a.date);
  const resistActions = actionsInRange.filter(a => a.type === 'resist');
  const restartActions = actionsInRange.filter(a => a.type === 'restart');
  const resistOK = resistActions.filter(a => a.result === 'success').length;
  const restartOK = restartActions.filter(a => a.result === 'success').length;
  const resistRate = resistActions.length ? Math.round(resistOK/resistActions.length*100) : 0;
  const restartRate = restartActions.length ? Math.round(restartOK/restartActions.length*100) : 0;
  const emoCnt = {}, srcCnt = {};
  actionsInRange.forEach(a => {
    (a.emotions||[]).forEach(e => emoCnt[e] = (emoCnt[e]||0)+1);
    (a.sources||[]).forEach(s => srcCnt[s] = (srcCnt[s]||0)+1);
  });
  const emoList = Object.entries(emoCnt).sort((a,b) => b[1]-a[1]);
  const srcList = Object.entries(srcCnt).sort((a,b) => b[1]-a[1]);
  const maxEmo = Math.max(...emoList.map(x => x[1]), 1);
  const maxSrc = Math.max(...srcList.map(x => x[1]), 1);
  const totalSpent = dayList.reduce((a,b) => a + b.spent, 0);
  const totalFood = dayList.reduce((a,b) => a + b.foodCount, 0);
  const totalJunk = dayList.reduce((a,b) => a + b.junkCount, 0);
  const totalViolations = dayList.reduce((a,b) => a + b.violations.filter(v => !v.isEmergency).length, 0);
  const greenDays = dayList.filter(d => d.score >= 5).length;
  const perfectDays = dayList.filter(d => d.score === 6).length;
  const title = isSmall ? '小周期报告' : '大周期报告';
  const html = `<!DOCTYPE html>

document.addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if(tab){ activeTab = tab.dataset.tab; scrollPos = 0; render(false); window.scrollTo(0,0); return; }

  if(e.target.closest('#undoBtn')){ doUndo(); return; }

  const el = e.target.closest('[data-act],[data-date],[data-checkin],[data-fitmin],[data-reset],[data-add-tag],[data-jj-set],[data-sleep-reason],[data-card],[data-rm-tag],[data-edit-tag],[data-rm-cat],[data-edit-cat],[data-rm-pending],[data-rm-expense],[data-future],[data-mcat],[data-dinner-toggle]');
  if(!el) return;

  if(el.dataset.future !== undefined){ toast('不能查看未来的日期'); return; }
  if(el.dataset.mcat !== undefined){ moneyCat = el.dataset.mcat; render(); return; }

  if(el.dataset.rmPending !== undefined){
       e.stopPropagation();
    const r = getRecord(getDayLifeDay());
    if(r._moneyPending) r._moneyPending = r._moneyPending.filter(p => p.id !== el.dataset.rmPending);
    saveState(); render(); return;
  }
  if(el.dataset.rmExpense !== undefined){
    e.stopPropagation();
    if(confirm('删除这条记录？')){
      pushUndo('删除支出');
      try { deductPoints(3, 'delete-expense', '删除支出'); } catch(e){}
      state.expenses = state.expenses.filter(x => x.id !== el.dataset.rmExpense);
      saveState(); render(); toast('已删除');
    }
    return;
  }
  if(el.dataset.addTag !== undefined){
    const tag = getTag(el.dataset.addTag); if(!tag) return;
    const cat = getCat(tag.catId);

      showViolationDialog(tag.name, cat.isJunk, cat.catId, tag.id, tag.price);
      return;

    const r = getRecord(todayStr());
    if(!r._moneyPending) r._moneyPending = [];

    saveState(); render();

    return;
  }
  if(el.dataset.rmTag !== undefined){

        try {

          if(!confirm('导入将覆盖当前全部数据，确定？')) return;
          pushUndo('导入数据');
          state = Object.assign(defaultState(), data);
          migrate();
          saveState(); render(); toast('导入成功');
        } catch(err){ toast('文件格式错误'); }
      };
      fr.readAsText(f);
    };
    input.click();
    return;
  }

    if(act === 'downloadSmallReport'){
    const sch = computeSchedule();
    const info = sch[getDayLifeDay()] || {};
    if(!info.isReward){ toast('小周期报告仅奖励日可下载'); return; }
    downloadReport('small');
    return;
  }
   if(act === 'downloadBigReport'){
    const sch = computeSchedule();
    const info = sch[getDayLifeDay()] || {};
    if(!info.isRest){ toast('大周期报告仅休息日可下载'); return; }
    downloadReport('big');
    return;
  }

  if(act === 'copySyncCode'){
    const txt = syncUserId;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(() => toast('已复制：' + txt)).catch(() => toast('复制失败'));
    } else {
      const inp = $('#syncCodeDisplay');
      if(inp){ inp.select(); try { document.execCommand('copy'); toast('已复制'); } catch(e){ toast('请手动复制'); } }
    }
    return;
  }
  if(act === 'switchSyncCode'){
    const input = $('#inputSyncCode');
    if(!input || !input.value.trim()){ toast('请输入同步码'); return; }
    const newId = input.value.trim();
    if(newId === syncUserId){ toast('这与当前同步码相同'); return; }
    if(!confirm('即将切换到同步码：\n' + newId + '\n\n· 云端有数据 → 覆盖本机\n· 云端无数据 → 本机重置，重新启用\n\n确定继续吗？')) return;
    syncUserId = newId;
    localStorage.setItem(SYNC_ID_KEY, syncUserId);
    suppressSync = true;
    state = defaultState();
    try { localStorage.removeItem(LS_STATE); } catch(e){}
    try { localStorage.removeItem(LAST_CHANGE_KEY); } catch(e){}
    lastLocalChange = 0;
    suppressSync = false;
    render(false);
    cloudPull(true).then(res => {
      if(res.pulled){ toast('已从云端恢复 ✅'); render(false); }
      else if(res.empty){ toast('新同步码已就绪，请重新启用 🌱'); }
      else { toast('云端无数据或连接失败'); }
      render(false);
    });
    return;
  }
  if(act === 'cloudPushBtn'){ cloudPush(false).then(() => render(false)); return; }
  if(act === 'cloudPullBtn'){ cloudPull(false).then(res => { toast(res.pulled?'已恢复':'本机与云端一致'); render(false); }); return; }
});

    if(r.dinnerOk && !r._dinnerPromptShown){ r._dinnerPromptShown = true; saveState(true); setTimeout(showDinnerPausePrompt, 300); }

function useCard(id){
  if(0 >= state.cards[id]){ toast('这张卡用完了'); return; }
  const today = getDayLifeDay();
  const rec = getRecord(today);
  const sch = computeSchedule();
  const info = sch[today] || {};
  if(info.isRest && id !== 'birthday'){ toast('休息日无需用卡'); return; }

  // 7 天冷却（reset 和 birthday 除外）
  if(id !== 'reset' && id !== 'birthday'){
    const last = state.cards._lastUse && state.cards._lastUse[id];
    if(last){
      const diff = Math.abs(diffDays(parseD(last), parseD(today)));
      if(7 > diff){ toast('同一张卡7天内只能一次'); return; }
    }
  }

  // 生日卡：窗口校验 + 使用
  if(id === 'birthday'){
    if(state.birthdayCard.used){ toast('生日卡已使用'); return; }
    if(!canUseBirthdayCard(today)){ toast('生日卡只能在生日前后10天内使用'); return; }
    state.birthdayCard.used = true;
    state.birthdayCard.usedDate = today;
    rec.birthdayCard = true;
    saveState(); render(); showBirthdayCelebration();
    toast('🎂 生日快乐！今天全部豁免');
    return;
  }

  // 保护卡 / 病假卡：标记豁免
  if(id === 'protect'){
    rec.protect = true;
    toast('🛡️ 保护卡已使用，今日全部豁免且不计积累');
  } else if(id === 'sick'){
    rec.sick = true;
    toast('🤒 病假卡已使用，今日全部豁免且不计积累');
  } else if(id === 'clean'){
    if(!state.cardEffects) state.cardEffects = {};
    state.cardEffects.cleanDate = today;
    if(rec.study) {
      const res = judgeStudy(rec.study.hours, false, true);
      rec.study.eff = rec.study.hours + 1;
      rec.study.tier = res.tier; rec.study.label = res.label; rec.study.isGreen = res.isGreen;
    }
    toast('打扫卡已生效，学习等效时长+1h');
  } else if(id === 'makeup'){
    showMakeupDialog(id);
    return;
  } else if(id === 'reset'){
    state.cooldowns = [];
    state.displayCooldowns = [];
    rec._cycleReset = true;
    toast('周期重置卡已使用，冷静期已清空');
  }

    state.cards[id]--;
  logAudit('card', '使用卡片：' + id);
  if(!state.cards._lastUse) state.cards._lastUse = {};
  if(id !== 'reset' && id !== 'birthday'){ state.cards._lastUse[id] = today; }
  saveState(); render();
}
function showMakeupDialog(cardId){
  const yesterday = fmtDate(addDays(new Date(), -1));
  const recY = getRecord(yesterday);
  if(recY.makeup){
    toast('昨日已经补签过了');
    return;
  }
  const sch = computeSchedule();
  const infoY = sch[yesterday] || {};
  const isRewardY = infoY.isReward === true;
    openSheet(`
    <h3>✒️ 补签卡 · 选择要补的日期</h3>
    <div style="font-size:12.5px;color:var(--muted);line-height:1.8;margin-bottom:12px;">
      <p>默认补昨天，也可以选更早的日期（不能选今天或未来）。</p>
      <p style="color:#fca5a5;">注意：补签日不计入小周期积累，也不计入全绿统计。</p>
    </div>
    <label class="fl">补签日期</label>
    <input class="txt" type="date" id="mkDate" value="${yesterday}" max="${yesterday}" min="${state.settings.startDate || yesterday}">
    <label class="fl">睡觉时间（23:30前为达标）</label>
    <input class="txt" type="time" id="mkSleep" value="${(recY.sleep && recY.sleep.time) ? recY.sleep.time : '23:30'}">
    <label class="fl">起床时间（5:20前为达标）</label>
    <input class="txt" type="time" id="mkWake" value="${(recY.wake && recY.wake.time) ? recY.wake.time : '05:20'}">
    <label class="fl">学习时长（小时）</label>
    <input class="txt" type="number" step="0.1" id="mkStudy" placeholder="例如 9" min="0.1" value="${(recY.study && recY.study.hours) ? recY.study.hours : ''}">
    <div class="close-row"><button class="btn btn-g" id="mkCancel">取消</button><button class="btn btn-p" id="mkSave">确认补签</button></div>
  `, sheet => {
    sheet.querySelector('#mkCancel').onclick = closeSheet;
    sheet.querySelector('#mkSave').onclick = () => {
      const mkDateEl = sheet.querySelector('#mkDate');
      const targetDate = (mkDateEl && mkDateEl.value) ? mkDateEl.value : yesterday;
      if(targetDate > yesterday){ toast('不能补今天或未来'); return; }
      const recT = getRecord(targetDate);
      if(recT.makeup){ toast('这天已经补签过了'); return; }
      const schT = computeSchedule();
      const infoT = schT[targetDate] || {};
      const sleepTime = sheet.querySelector('#mkSleep').value;
      const wakeTime = sheet.querySelector('#mkWake').value;
      const studyHours = parseFloat(sheet.querySelector('#mkStudy').value);
      if(!sleepTime || !wakeTime || isNaN(studyHours) || 0 >= studyHours){
        toast('请填写完整数据');
        return;
      }
      pushUndo('补签昨日');
      const sleepJ = judgeSleep(sleepTime, '', true);
      const wakeJ = judgeWake(wakeTime, infoT.isReward ? 'reward' : 'normal');
      const studyJ = judgeStudy(studyHours, false, false);

      recT.makeup = true;
      recT.sleep = { time: sleepTime, success: sleepJ.success, msg: sleepJ.msg, checked: true, makeup: true };
      recT.wake = { time: wakeTime, fitness: wakeJ.fitness, msg: wakeJ.msg, checked: true, makeup: true };
      recT.study = { hours: studyHours, eff: studyHours, tier: studyJ.tier, label: studyJ.label, msg: studyJ.msg, isGreen: studyJ.isGreen, checked: true, makeup: true };
      logAudit('card', '补签 ' + targetDate + '（睡眠/起床/学习）');

      state.cards[cardId]--;
      if(!state.cards._lastUse) state.cards._lastUse = {};
      state.cards._lastUse[cardId] = todayStr();
      saveState(); closeSheet(); render();
      toast('已补签 ' + targetDate + '，系统已判定');
    };
  });
}
/* ============================================================
   迁移
   ============================================================ */
function migrate(){
  const def = defaultState();
  if(!state.settings) state.settings = def.settings;
  Object.keys(def.settings).forEach(k => {
    if(state.settings[k] === undefined) state.settings[k] = def.settings[k];
  });
  if(state.settings.startTimestamp === undefined)
    state.settings.startTimestamp = state.settings.startDate ? parseD(state.settings.startDate).getTime() : 0;
  if(state.settings.unlockAnimationPlayed === undefined)
    state.settings.unlockAnimationPlayed = !!state.settings.startDate;
  if(state.enabled === undefined) state.enabled = false;
  if(state.activated === undefined) state.activated = !!state.settings.startDate;
  if(!state.records) state.records = {};
  if(!state.cats) state.cats = def.cats;
  if(!state.tags) state.tags = def.tags;
  if(!state.expenses) state.expenses = [];
  if(state.budget === undefined) state.budget = def.budget;
  if(!state.cards) state.cards = def.cards;
  if(!state.cards._lastUse) state.cards._lastUse = {};
  if(!state.stats) state.stats = def.stats;
  if(!state.trees) state.trees = [];
  if(!state.birthdayCard) state.birthdayCard = def.birthdayCard;
  if(!state.jj) state.jj = def.jj;
  if(!state.restReschedule) state.restReschedule = {};
  if(!state.restResolved) state.restResolved = {};
  if(!state.restPrompted) state.restPrompted = {};
  if(!state.editLog) state.editLog = [];
  if(!state.actions) state.actions = [];
  if(!state.resistStreak) state.resistStreak = def.resistStreak;
  if(!state.restartStreak) state.restartStreak = def.restartStreak;
  if(!state.rewardCards) state.rewardCards = [];
  if(!state.violations) state.violations = [];
  if(!state.sleepExemptions) state.sleepExemptions = { weekStart:'', used:0 };
  if(!state.cardEffects) state.cardEffects = {};
  if(!state.cooldowns) state.cooldowns = [];
  if(!state.foodLib) state.foodLib = [
    { id: 'f1', name: '食堂套餐', price: 15, catId: 'c_normal' },
    { id: 'f2', name: '炸鸡/快餐', price: 30, catId: 'c_junk' }
  ];
   if(state.points === undefined) state.points = 10;
  if(!state.pointsLedger) state.pointsLedger = [];
  if(state.weeklyPointsCap === undefined || state.weeklyPointsCap === 8) state.weeklyPointsCap = 10;
  if(!state.weeklyPoints) state.weeklyPoints = { weekStart:'', earned:0 };
  if(!state.coupons) state.coupons = [];
  if(!state.tierPrizes) state.tierPrizes = [];
  if(!state.funcBuy) state.funcBuy = { weekStart:'', counts:{} };
  if(!state.auditLog) state.auditLog = [];
  if(state.rewardCards && state.rewardCards.length){
    let converted = 0;
    state.rewardCards.forEach(rc => {
      if(rc.status === 'pending'){ rc.status = 'converted'; rc.convertedAt = todayStr(); converted++; }
    });
    if(converted > 0){
      state.points = (state.points || 0) + converted;
      if(!state.pointsLedger) state.pointsLedger = [];
      state.pointsLedger.unshift({ id: nid('pt_'), date: todayStr(), time: '00:00', amount: converted, source: 'legacy-card', note: '旧奖励卡折算（' + converted + ' 张）', ts: Date.now() });
      logAudit('points', '旧奖励卡下线：' + converted + ' 张折算为 ' + converted + ' 积分');
    }
  }
  if(state.carryPoints === undefined) state.carryPoints = 0;
  if(state.jjBank === undefined) state.jjBank = 0;

  // 阶段3：旧 study 迁移
  // 1. conservative → recovery；补 eff / isGreen
  Object.keys(state.records).forEach(k => {
    const rec = state.records[k];
    if(!rec) return;
    if(rec.study){
      const s = rec.study;
      if(s.tier === 'conservative'){
        s.tier = 'recovery';
        s.label = '恢复日';
      }
      if(s.eff === undefined && s.hours !== undefined){
        s.eff = s.hours;
      }
      if(s.isGreen === undefined){
        s.isGreen = !!(s.tier === 'normal' || s.tier === 'reward');
      }
    }
    // 2. 旧 cleanCard 标记重算 eff 与档位
    if(rec.cleanCard === true && rec.study){
      if(!state.cardEffects.cleanDate){
        state.cardEffects.cleanDate = k;
      }
      const h = rec.study.hours || 0;
      const eff = h + 1;
      rec.study.eff = eff;
      if(eff >= 10){ rec.study.tier = 'reward'; rec.study.isGreen = true; rec.study.label = '奖励档'; }
      else if(eff >= 9){ rec.study.tier = 'normal'; rec.study.isGreen = true; rec.study.label = '正常档'; }
      else if(eff >= 8){ rec.study.tier = 'recovery'; rec.study.isGreen = false; rec.study.label = '恢复日'; }
      else if(eff >= 7){ rec.study.tier = 'cool1'; rec.study.isGreen = false; rec.study.label = '冷静1天'; }
      else if(eff >= 6){ rec.study.tier = 'cool2'; rec.study.isGreen = false; rec.study.label = '冷静2天'; }
      else { rec.study.tier = 'cool3'; rec.study.isGreen = false; rec.study.label = '冷静3天'; }
    }
  });

  // 3. 旧支出回填 catId（用 tagId 反查）
  state.expenses.forEach(e => {
    if(!e.catId && e.tagId){
      const tag = state.tags.find(t => t.id === e.tagId);
      if(tag) e.catId = tag.catId;
    }
  });

  if(!state.dailyDeduct) state.dailyDeduct = {};
  if(!state._deducted) state._deducted = {};
  if(!state.lateNightLog) state.lateNightLog = [];
  if(!state.motivations) state.motivations = [];
  if(!state.settings.wakeGreenDeadline) state.settings.wakeGreenDeadline = '07:15';
  Object.keys(state.records || {}).forEach(function(k){
    const rec = state.records[k];
    if(rec && rec.wake && rec.wake.checked && rec.wake.green === undefined){
      rec.wake.green = (rec.wake.fitness === true) || (rec.wake.time && timeToMin(rec.wake.time) <= timeToMin('07:15'));
    }
  });
  (state.expenses || []).forEach(function(e){ if(e.lateNight === undefined) e.lateNight = false; });
  // 4. 版本号升 22
  state.version = 22;
}

/* ============================================================
   启动
   ============================================================ */
(function(){
  try {
    let raw = localStorage.getItem(LS_STATE);
    if(!raw){
      raw = localStorage.getItem(OLD_KEY);
      if(raw){
        const bk = 'garden_backup_pre_v21_' + new Date().toISOString().replace(/[:.]/g,'-');
        if(!localStorage.getItem(bk)) localStorage.setItem(bk, raw);
      }
    }

    try {
      if(raw){ state = JSON.parse(raw); migrate(); }
      else { state = defaultState(); }
    } catch(e){
      console.error('初始化出错:', e);
      state = defaultState();
    }

    if(!state) state = defaultState();

    try {
      if(state.enabled && state.settings.startDate){
        autoCheckWakeFail();
      }
    } catch(e){ console.error('autoCheckWakeFail', e); }

    try { render(false); } catch(e){ console.error('首次渲染出错:', e); }

        booted = true;

    try { settleLifeDay(); } catch(e){}
    setInterval(function(){ try { settleLifeDay(); } catch(e){} }, 60000);

    setTimeout(function(){
      try {
        cloudPull(false).then(res => { if(res.pulled) render(false); });
      } catch(e){ console.error('cloudPull', e); }
    }, 300);
  } catch(e){
    console.error('启动出错:', e);
    state = state || defaultState();
    try { render(false); } catch(_){}
  }
})();
</script>
