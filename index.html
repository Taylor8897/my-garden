<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1a12">
<title>自律花园</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
:root{--bg:#0d1f14;--card:#142a1c;--card2:#1a3524;--line:#244a30;--txt:#e8f5ec;--muted:#7fa88a;--dim:#4d7a5c;--accent:#4ade80;--accent2:#22c55e;--gold:#fbbf24;--red:#f87171;--blue:#60a5fa;--purple:#a78bfa;--pink:#f472b6;--ice:#a5d8f3;--r:16px}
body.cold{--bg:#0a1520;--card:#0f2233;--card2:#14293d;--line:#1e3a52;--txt:#dbeafe;--muted:#7aa8c8;--dim:#4a6d8a;--accent:#60a5fa;--accent2:#3b82f6;--gold:#93c5fd}
body.rest{--bg:#1f1a2e;--card:#2a2440;--card2:#342c4c;--line:#403658;--txt:#f0e9ff;--muted:#a896c8;--dim:#6d5e8a;--accent:#c4b5fd;--accent2:#a78bfa;--gold:#fbbf24}
body.bd-celebration{--bg:#2a0a0a;--card:#3d1010;--card2:#4a1515;--line:#6b2020;--txt:#fff0e0;--muted:#d49090;--dim:#8a4a4a;--accent:#ff4d4d;--accent2:#ff8833;--gold:#ffd700}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .8s,color .8s;padding-bottom:90px}
.bg-sky{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(1200px 600px at 50% -10%,rgba(74,222,128,.10),transparent 60%),linear-gradient(180deg,#0d1f14 0%,#0a1710 100%);transition:background .8s}
body.cold .bg-sky{background:radial-gradient(1200px 600px at 50% -10%,rgba(96,165,250,.12),transparent 60%),linear-gradient(180deg,#0a1520 0%,#06101a 100%)}
body.rest .bg-sky{background:radial-gradient(1200px 600px at 50% -10%,rgba(196,181,253,.15),transparent 60%),linear-gradient(180deg,#1f1a2e 0%,#15102a 100%)}
body.bd-celebration .bg-sky{background:radial-gradient(1200px 600px at 50% -10%,rgba(255,80,80,.28),transparent 60%),linear-gradient(180deg,#2a0a0a 0%,#150505 100%)}
.snowflake{position:fixed;top:-30px;color:#fff;pointer-events:none;z-index:2;opacity:.85;animation:snowfall linear infinite}
@keyframes snowfall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(105vh) rotate(360deg)}}
body:not(.cold) .snowflake{display:none}
.cloud{position:fixed;top:-30px;font-size:24px;pointer-events:none;z-index:2;opacity:.3;animation:cloudfall linear infinite}
@keyframes cloudfall{0%{transform:translateY(0) translateX(0)}100%{transform:translateY(105vh) translateX(30px)}}
body:not(.rest) .cloud{display:none}
.party-ribbon{position:fixed;top:-40px;width:14px;height:32px;pointer-events:none;z-index:3;border-radius:2px;animation:partyRibbonFall linear infinite;box-shadow:0 0 8px rgba(255,215,0,.4)}
@keyframes partyRibbonFall{0%{transform:translateY(0) rotate(0deg);opacity:1}50%{transform:translateY(50vh) rotate(360deg)}100%{transform:translateY(105vh) rotate(720deg);opacity:.3}}
body:not(.bd-celebration) .party-ribbon{display:none}
.firework{position:fixed;width:5px;height:5px;border-radius:50%;pointer-events:none;z-index:999;background:currentColor;box-shadow:0 0 8px 3px currentColor;animation:fireworkBurst 1.6s ease-out forwards}
@keyframes fireworkBurst{0%{transform:translate(0,0) scale(1.4);opacity:1}80%{opacity:.9}100%{transform:translate(var(--fx),var(--fy)) scale(0);opacity:0}}
.hbd-burst{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:9999;font-size:78px;font-weight:900;letter-spacing:14px;color:#ffd700;text-shadow:0 0 30px #ff4d4d,0 0 60px #ff8833;animation:hbdBurst 3.2s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes hbdBurst{0%{transform:scale(.05) rotate(-25deg);opacity:0;filter:blur(30px)}18%{transform:scale(1.9) rotate(8deg);opacity:1;filter:blur(0)}45%{transform:scale(1.25) rotate(-4deg);opacity:1}75%{transform:scale(1.55) rotate(3deg);opacity:1}100%{transform:scale(2.4) rotate(0deg);opacity:0;filter:blur(10px)}}
.app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;z-index:3}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:12px 14px 10px;backdrop-filter:blur(18px);background:rgba(13,31,20,.82);border-bottom:1px solid rgba(36,74,48,.7)}
body.cold .topbar{background:rgba(10,21,32,.82)}
body.rest .topbar{background:rgba(31,26,46,.82)}
body.bd-celebration .topbar{background:rgba(42,10,10,.88)}
.date-display{flex:1;text-align:center;padding:4px 8px}
.date-display b{display:block;font-size:14px;font-weight:700}
.date-display span{font-size:10px;color:var(--muted)}
.icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:15px;display:grid;place-items:center;cursor:pointer}
.icon-btn:active{transform:scale(.92)}
.icon-btn.on{color:var(--accent);border-color:rgba(74,222,128,.4)}
.view{padding:12px 12px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.card-t{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.card-t h3{font-size:14px;font-weight:600}
.card-t .sub{font-size:11px;color:var(--muted)}
.hero{background:linear-gradient(150deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:10px}
.hero-top{display:flex;justify-content:space-between;align-items:center}
.hero-label{font-size:11px;color:var(--muted)}
.pill{font-size:10px;padding:3px 9px;border-radius:20px;background:rgba(74,222,128,.15);color:var(--accent);border:1px solid rgba(74,222,128,.3);font-weight:500}
.hero-amount{font-size:30px;font-weight:800;letter-spacing:-1px;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.hero-sub{font-size:11.5px;color:var(--muted)}
.progress{height:7px;border-radius:7px;background:rgba(255,255,255,.06);margin:12px 0;overflow:hidden}
.progress-fill{height:100%;border-radius:7px;transition:width .6s;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.hero-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.hero-grid>div{text-align:center;background:rgba(255,255,255,.04);border-radius:10px;padding:7px 3px}
.hero-grid b{display:block;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.hero-grid span{font-size:9.5px;color:var(--muted)}
.alert{display:flex;gap:9px;padding:10px 12px;border-radius:12px;margin-bottom:8px;border:1px solid;font-size:12.5px;align-items:flex-start}
.alert.danger{background:rgba(248,113,113,.09);border-color:rgba(248,113,113,.3);color:#fca5a5}
.alert.ok{background:rgba(74,222,128,.08);border-color:rgba(74,222,128,.25);color:#86efac}
.alert.gold{background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.25);color:#fde68a}
.alert.purple{background:rgba(167,139,250,.08);border-color:rgba(167,139,250,.25);color:#c4b5fd}
.alert.rest{background:rgba(196,181,253,.1);border-color:rgba(196,181,253,.3);color:#ddd6fe}
.alert.bd{background:rgba(255,215,0,.1);border-color:rgba(255,215,0,.35);color:#ffd700}
.alert .ico{font-size:14px;flex-shrink:0;line-height:1.3}
.alert b{display:block;font-size:12.5px;font-weight:600;margin-bottom:2px}
.alert p{font-size:11.5px;opacity:.85;line-height:1.45}
.task{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.task.checked{opacity:.65;border-color:rgba(74,222,128,.3)}
.task.failed{opacity:.7;border-color:rgba(248,113,113,.4)}
.task.locked{opacity:.5}
.task.auto{opacity:.85;border-color:rgba(167,139,250,.4)}
.task.bd-disabled{opacity:.35;filter:grayscale(.5)}
.task-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.task-icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:rgba(255,255,255,.04);flex-shrink:0}
.task-title{flex:1}
.task-title h4{font-size:13.5px;font-weight:600}
.task-title p{font-size:10.5px;color:var(--muted);margin-top:2px}
.task-btn{padding:10px 16px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#062}
body.cold .task-btn,body.rest .task-btn,body.bd-celebration .task-btn{color:#fff}
.task-btn:active{transform:scale(.95)}
.task-btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.5)}
.task-btn.full{width:100%}
.task-result{font-size:11.5px;padding:7px 10px;border-radius:8px;margin-top:6px}
.task-result.ok{background:rgba(74,222,128,.1);color:#86efac}
.task-result.bad{background:rgba(248,113,113,.1);color:#fca5a5}
.task-result.jj{background:rgba(167,139,250,.12);color:#c4b5fd}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;width:100%}
.cal-head button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--txt);cursor:pointer;font-size:16px;line-height:1;padding:0;flex-shrink:0}
.cal-head .cal-title{font-size:14px;font-weight:600;flex:1;text-align:center}
.cal-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-bottom:6px;width:100%}
.cal-week span{text-align:center;font-size:11px;color:var(--muted);padding:4px 0;display:block}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;width:100%}
.cal-day{aspect-ratio:1/1.15;min-width:0;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;border:1px solid transparent;position:relative;background:var(--card2);padding:2px;box-sizing:border-box}
.cal-day.empty{background:transparent;border:none;cursor:default}
.cal-day.future{opacity:.5}
.cal-num{font-size:12px;color:var(--muted);font-weight:500;line-height:1.1;position:relative;z-index:2}
.cal-day.today{border:2px solid var(--gold);background:rgba(251,191,36,.12)}
.cal-day.today .cal-num{color:var(--gold);font-weight:700}
.cal-day.green{background:rgba(74,222,128,.2)}
.cal-day.green .cal-num{color:#86efac}
.cal-day.nopoint{border:1px dashed rgba(148,163,184,.75)}
.cal-day.nopoint .cal-num::after{content:'·';color:#94a3b8;margin-left:2px}
.cal-day.partial{background:rgba(251,191,36,.12)}
.cal-day.meal{background:linear-gradient(135deg,rgba(251,191,36,.22),rgba(251,191,36,.06));border:1px solid rgba(251,191,36,.4)}
.cal-day.reward{background:linear-gradient(135deg,rgba(251,191,36,.35),rgba(251,191,36,.12));border:1px solid rgba(251,191,36,.7)}
.cal-day.cool{background:linear-gradient(135deg,rgba(165,216,243,.35),rgba(219,234,254,.18));border:1px solid rgba(165,216,243,.7)}
.cal-day.cool .cal-num{color:#a5d8f3;font-weight:700}
.cal-day.cool-proj{opacity:.45;border-style:dashed}
.cal-day.birthday{background:linear-gradient(135deg,rgba(255,80,80,.4),rgba(255,180,60,.28));border:1px solid rgba(255,215,0,.8)}
.cal-day.rest{background:linear-gradient(135deg,rgba(196,181,253,.4),rgba(167,139,250,.2));border:1px solid rgba(196,181,253,.8)}
.cal-day.rest-candidate{background:linear-gradient(135deg,rgba(167,139,250,.15),rgba(96,165,250,.1));border:1px dashed rgba(167,139,250,.7)}
.cal-day.jj-release{background:linear-gradient(135deg,rgba(167,139,250,.35),rgba(139,92,246,.18));border:1px solid rgba(167,139,250,.8)}
.cal-day.jj-release .cal-num{color:#c4b5fd;font-weight:700}
.cal-day::before{font-size:9px;position:absolute;top:1px;right:2px;line-height:1}
.cal-day.meal::before{content:'◆';color:var(--gold)}
.cal-day.reward::before{content:'★';color:var(--gold);font-size:11px}
.cal-day.cool::before{content:'❄';color:var(--ice);top:1px;left:2px;right:auto}
.cal-day.birthday::before{content:'🎂';font-size:10px}
.cal-day.rest::before{content:'🏖';font-size:10px}
.cal-day.rest-candidate::before{content:'?';color:#a78bfa;font-weight:700}
.cal-day.jj-release::before{content:'💧';font-size:9px}
.cal-dots{display:flex;gap:2px;position:relative;z-index:2;justify-content:center}
.dot{width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.15);display:inline-block}
.dot.on.sleep{background:var(--pink)}
.dot.on.study{background:var(--blue)}
.dot.on.jj{background:var(--purple)}
.dot.on.wake{background:#fb923c}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:grid;grid-template-columns:repeat(8,1fr);background:rgba(13,31,20,.95);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:8px 2px calc(10px + env(safe-area-inset-bottom));z-index:60}
body.cold .tabbar{background:rgba(10,21,32,.95)}
body.rest .tabbar{background:rgba(31,26,46,.95)}
body.bd-celebration .tabbar{background:rgba(42,10,10,.96)}
.tab{background:none;border:none;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 0;cursor:pointer;font-family:inherit}
.tab svg{width:18px;height:18px;stroke-width:1.9}
.tab span{font-size:9px}
.tab.active{color:var(--accent)}
.tab:active{transform:scale(.92)}
.mask{position:fixed;inset:0;background:rgba(4,10,6,.75);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:86vh;overflow-y:auto}
.sheet h3{font-size:16px;margin-bottom:14px;font-weight:700}
.close-row{display:flex;gap:8px;margin-top:14px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:rgba(20,42,28,.97);border:1px solid var(--line);color:var(--txt);padding:10px 18px;border-radius:12px;font-size:12.5px;z-index:200;transition:.28s;pointer-events:none;max-width:86%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.btn{width:100%;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:.18s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-p{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#062}
body.cold .btn-p,body.rest .btn-p,body.bd-celebration .btn-p{color:#fff}
.btn-g{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn-sm{padding:8px 12px;font-size:12px;width:auto}
.btn-purple{background:linear-gradient(135deg,#a78bfa,#8b5cf6);color:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 12px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:12px;color:var(--muted);cursor:pointer;user-select:none}
.chip:active{transform:scale(.95)}
.chip.on{background:rgba(74,222,128,.16);border-color:rgba(74,222,128,.5);color:var(--accent);font-weight:500}
.chip.emotion.on{background:rgba(167,139,250,.18);border-color:rgba(167,139,250,.5);color:#c4b5fd}
.chip.source.on{background:rgba(96,165,250,.18);border-color:rgba(96,165,250,.5);color:#93c5fd}
.chip.junk{border-color:rgba(248,113,113,.4);color:#fca5a5}
.chip .price{font-size:10px;opacity:.6;margin-left:4px}
.pending-tag{display:inline-block;background:rgba(251,191,36,.15);border:1px solid rgba(251,191,36,.35);color:#fde68a;padding:5px 10px;border-radius:8px;font-size:12px;margin:2px 3px 2px 0}
.pending-tag .rm{color:#fca5a5;margin-left:6px;cursor:pointer;font-weight:700}
label.fl{display:block;font-size:11px;color:var(--muted);margin:12px 0 6px}
input.txt,select.txt,textarea.txt{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--txt);font-size:14px;outline:none;font-family:inherit;resize:vertical}
input.txt:focus,select.txt:focus,textarea.txt:focus{border-color:var(--accent)}
textarea.txt{min-height:60px}
.hint{font-size:10.5px;color:var(--dim);margin-top:6px;line-height:1.5}
.empty{text-align:center;padding:24px 0;color:var(--dim);font-size:12px}
.jj-progress{height:5px;background:rgba(255,255,255,.06);border-radius:3px;margin-top:8px;overflow:hidden}
.jj-bar{height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#a78bfa,#8b5cf6);transition:width .4s}
.cool-detail{background:rgba(165,216,243,.06);border:1px solid rgba(165,216,243,.2);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:11.5px;color:#bfdbfe;line-height:1.7}
.cool-detail b{color:#fff;display:block;margin-bottom:5px;font-size:12px}
.cool-detail .cd-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed rgba(165,216,243,.15)}
.cool-detail .cd-row:last-child{border-bottom:none}
.cool-detail .cd-row span:last-child{color:#93c5fd;font-weight:600}
.rest-hero{text-align:center;padding:48px 22px 40px;background:linear-gradient(150deg,rgba(196,181,253,.12),rgba(167,139,250,.04));border:1px solid rgba(196,181,253,.25);border-radius:24px;margin-bottom:14px}
.rest-icon{font-size:72px;line-height:1;margin-bottom:16px}
.rest-title{font-size:24px;font-weight:800;margin-bottom:10px;color:#c4b5fd}
.rest-sub{font-size:13px;color:var(--muted);line-height:1.8;max-width:320px;margin:0 auto}
.bd-hero{text-align:center;padding:48px 22px 40px;background:linear-gradient(150deg,rgba(255,80,80,.15),rgba(255,140,60,.08));border:1px solid rgba(255,215,0,.3);border-radius:26px;margin-bottom:14px}
.bd-icon{font-size:76px;line-height:1;margin-bottom:18px}
.bd-title{font-size:32px;font-weight:900;letter-spacing:8px;margin-bottom:14px;color:#ffd700}
.bd-sub{font-size:13px;color:#ffd7c0;line-height:2;max-width:300px;margin:0 auto}
.fin-hero{background:linear-gradient(150deg,#1a2137,#141827);border:1px solid #27304a;border-radius:18px;padding:18px;margin-bottom:10px}
.fin-amount{font-size:32px;font-weight:800;letter-spacing:-1px;margin:6px 0 2px;color:#8fb0ff}
.fin-sub{font-size:12px;color:#8791a8}
.diet-hero{background:linear-gradient(150deg,#1f2a1c,#151d12);border:1px solid #2a3d24;border-radius:18px;padding:18px;margin-bottom:10px}
.diet-amount{font-size:32px;font-weight:800;letter-spacing:-1px;margin:6px 0 2px;color:#86efac}
.diet-sub{font-size:12px;color:var(--muted)}
.trend{display:flex;align-items:flex-end;justify-content:space-between;gap:4px;height:80px;margin:10px 0 4px;padding:0 2px}
.trend-bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%}
.trend-bar .bar{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,#5b8cff,#3b6edb);min-height:2px;transition:height .6s}
.trend-bar .bar.junk{background:linear-gradient(180deg,#f0883e,#db6d28)}
.trend-bar .bar.food{background:linear-gradient(180deg,#4ade80,#22c55e)}
.trend-bar .lbl{font-size:9px;color:var(--dim)}
.rec{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.rec:last-child{border-bottom:none}
.rec-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.rec-mid{flex:1;min-width:0}
.rec-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-meta{font-size:10.5px;color:var(--muted);margin-top:1px;display:flex;gap:6px;flex-wrap:wrap}
.rec-amt{font-size:13.5px;font-weight:600;flex-shrink:0}
.rec-amt.bad{color:var(--red)}
.rec-rm{padding:4px 8px;border-radius:7px;border:1px solid rgba(248,113,113,.3);background:rgba(248,113,113,.08);color:#fca5a5;font-size:11px;cursor:pointer;flex-shrink:0}

  for(let i = state.pointsLedger.length - 1; i >= 0; i--){
    const it = state.pointsLedger[i];
    if(it.source === 'expire') continue;
    if(it._expired) continue;
    const gap = Math.abs(diffDays(parseD(it.date), parseD(today)));
    if(gap > 90){
      const d = Math.min(it.amount || 0, state.points || 0);

        state.points -= d;
        lost += d;
      }
      it._expired = true;
    }

    const gap = Math.abs(diffDays(parseD(it.date), parseD(today)));

function deductPoints(amount, source, note, dateStr){

  const date = dateStr || getDayLifeDay();

  const key = date + '|' + (source || 'other');
  if(state._deducted[key]) return { ok:false, reason:'同因已扣' };
  if(!state.dailyDeduct) state.dailyDeduct = {};
  const used = state.dailyDeduct[date] || 0;
  const room = Math.max(0, 5 - used);
  if(room <= 0) return { ok:false, reason:'今日扣分已达上限' };
  const real = Math.min(amt, room);
  const applied = Math.min(real, state.points || 0);
  state.points = Math.max(0, (state.points || 0) - applied);
  state.dailyDeduct[date] = used + real;

  const wakeOk = !!(rec.wake && rec.wake.checked && (rec.wake.green === true || (rec.wake.green === undefined && rec.wake.fitness === true)));
  const studyOk = !!(rec.study && (rec.study.isGreen === true || rec.study.tier === 'normal' || rec.study.tier === 'reward'));

/* ============================================================
   云同步：逐字段合并（避免多设备互相覆盖）
   ============================================================ */
function unionById(localArr, remoteArr, preferStatus){
  const out = [];
  const seen = {};
  const push = it => {
    if(!it || !it.id) return;
    if(seen[it.id]) return;
    seen[it.id] = true;
    out.push(it);
  };
  (localArr || []).forEach(push);
  (remoteArr || []).forEach(it => {
    if(!it || !it.id) return;
    if(seen[it.id]){
      if(preferStatus && it.status === preferStatus){
        for(let i = 0; out.length > i; i++){
          if(out[i].id === it.id){ out[i].status = it.status; if(it.usedAt) out[i].usedAt = it.usedAt; break; }
        }
      }
      return;
    }
    push(it);
  });
  return out;
}
function mergeRecords(localRec, remoteRec){
  const out = {};
  const keys = {};
  Object.keys(localRec || {}).forEach(k => { keys[k] = true; });
  Object.keys(remoteRec || {}).forEach(k => { keys[k] = true; });
  Object.keys(keys).forEach(k => {
    const l = (localRec || {})[k];
    const r = (remoteRec || {})[k];
    if(!l){ out[k] = r; return; }
    if(!r){ out[k] = l; return; }
    const m = Object.assign({}, r);
    Object.keys(l).forEach(f => { m[f] = l[f]; });
    out[k] = m;
  });
  return out;
}
function maxNum(a, b){ return (Number(a) || 0) >= (Number(b) || 0) ? (Number(a) || 0) : (Number(b) || 0); }
function mergeRemoteState(remote){
  if(!remote) return false;
  state.records = mergeRecords(state.records, remote.records);
  state.expenses = unionById(state.expenses, remote.expenses);
  state.actions = unionById(state.actions, remote.actions);
  state.violations = unionById(state.violations, remote.violations);
  state.pointsLedger = unionById(state.pointsLedger, remote.pointsLedger).slice(0, 200);
  state.auditLog = unionById(state.auditLog, remote.auditLog)
    .sort((a, b) => (b.ts || 0) - (a.ts || 0)).slice(0, 500);
  state.coupons = unionById(state.coupons, remote.coupons, 'used');
  state.rewardCards = unionById(state.rewardCards, remote.rewardCards);
  state.tierPrizes = unionById(state.tierPrizes, remote.tierPrizes);
  state.editLog = unionById(state.editLog, remote.editLog);
  state.points = Number(remote.points) || 0;
  state.carryPoints = Number(remote.carryPoints) || 0;
  state.jjBank = maxNum(state.jjBank, remote.jjBank);
  if(state.cards && remote.cards){
    ['protect','sick','makeup','clean','birthday','reset'].forEach(k => {
      state.cards[k] = maxNum(state.cards[k], remote.cards[k]);
    });
    const lu = Object.assign({}, remote.cards._lastUse || {}, state.cards._lastUse || {});
    state.cards._lastUse = lu;
  }
  if(state.shards && remote.shards){
    ['clean','protect','makeup'].forEach(k => { state.shards[k] = maxNum(state.shards[k], remote.shards[k]); });
  }
  if(state.stats && remote.stats){
    ['totalGreenDays','totalCooldowns','longestStreak','treesGrown'].forEach(k => {
      state.stats[k] = maxNum(state.stats[k], remote.stats[k]);
    });
  }
  if(state.jj && remote.jj){
    state.jj.completed = maxNum(state.jj.completed, remote.jj.completed);
  }
  state.restResolved = Object.assign({}, remote.restResolved || {}, state.restResolved || {});
  state.restReschedule = Object.assign({}, remote.restReschedule || {}, state.restReschedule || {});
  return true;
}

  }).then(data => {
    if(!data || data.length === 0){
      if(state && state.enabled) cloudPush(true);
      setSyncStatus('ok', '云端暂无数据');
      return { pulled:false, empty:true };
    }
    const row = data[0];
    const cloudTime = new Date(row.updated_at).getTime();
    const payload = row.items;
    if(!payload || typeof payload!=='object' || payload.__type!=='garden' || !payload.state){
      if(state && state.enabled) cloudPush(true);
      return { pulled:false };
    }
    const localEmpty = !state || !state.enabled;
    if(localEmpty || cloudTime > lastLocalChange + 1500){
      suppressSync = true;
      if(localEmpty){
        state = payload.state;
      } else {
        try { mergeRemoteState(payload.state); }
        catch(e){ state = payload.state; }
      }
      try { migrate(); } catch(e){}
      try { localStorage.setItem(LS_STATE, JSON.stringify(state)); } catch(e){}
      lastLocalChange = cloudTime;
      try { localStorage.setItem(LAST_CHANGE_KEY, String(lastLocalChange)); } catch(e){}
      suppressSync = false;
      render(false);
      setSyncStatus('ok', '已合并云端数据 · ' + new Date(cloudTime).toLocaleString('zh-CN'));
      return { pulled:true };
    }
    if(lastLocalChange > cloudTime + 1500){ cloudPush(true); setSyncStatus('ok', '本机较新，已上传'); }
    else { setSyncStatus('ok', '本机与云端一致'); }
    return { pulled:false };
  }).catch(e => {
    setSyncStatus('err', '下载失败：' + (e.message || e));
    return { pulled:false, error:e };
  });
}

function checkStreakTimeout(){

    const s = state[k];
    if(0 >= s.current || !s.lastSuccessDate) return;
    const gap = diffDays(parseD(s.lastSuccessDate), new Date());
    if(gap > GAP_TOLERANCE + 1){

      s.breakReason = `间隔超${GAP_TOLERANCE}天（最后：${s.lastSuccessDate}）`;
    }

}

function addAction(info){
  const rec = {
    id: nid('a_'), date: getDayLifeDay(), time: nowTimeStr(),
    type: info.type, result: info.result,
    intensity: Number(info.intensity) || 0,
    target: (info.target || '').trim(),
    emotions: info.emotions || [],
    sources: info.sources || [],
    note: (info.note || '').trim(),
    ts: Date.now()
  };
  state.actions.unshift(rec);
  const countsForStreak = rec.intensity >= INTENSITY_MIN;
  try { checkActionMilestone(info.type); } catch(e){}
  const sKey = info.type === 'resist' ? 'resistStreak' : 'restartStreak';
  const s = state[sKey];
  if(info.result === 'success'){
    if(countsForStreak){
      if(s.lastSuccessDate){
        const gap = diffDays(parseD(s.lastSuccessDate), parseD(rec.date));
        if(gap > GAP_TOLERANCE + 1) s.current = 0;
      }
           s.current += 1;
      s.lastSuccessDate = rec.date;
      if(s.current > s.max) s.max = s.current;
      const tier = recordTierPrize(info.type, s.current);

function judgeSleep(time, reason, isMakeup){
  if(!time) return { success:false, msg:'未打卡' };
  const t = timeToMin(time);
  const d = timeToMin(state.settings.sleepDeadline || '23:30');
  const adj = ((d - 12*60) > t) ? t + 24*60 : t;
  if(d >= adj) return { success:true, msg:'按时上床 ✓' };
  if(isMakeup) return { success:false, msg:'补签判定：超过23:30' };
  const now = new Date();
  const day = now.getDay();
  const monday = addDays(now, -(day === 0 ? 6 : day-1));
  const weekStart = fmtDate(monday);
  if(!state.sleepExemptions) state.sleepExemptions = { weekStart:'', used:0 };
  if(state.sleepExemptions.weekStart !== weekStart){
    state.sleepExemptions.weekStart = weekStart;
    state.sleepExemptions.used = 0;
  }
  if(reason === 'work' && 2 > state.sleepExemptions.used){
    state.sleepExemptions.used++;
    return { success:true, msg:`工作/不可抗力 ✓ (本周${state.sleepExemptions.used}/2)` };

/* ============================================================
   冷静期计算
   ============================================================ */
function capCooldowns(list, max){
  let total = 0;
  for(let i = 0; list.length > i; i++) total += list[i].daysRemaining;
  for(let i = list.length - 1; i >= 0 && total > max; i--){
    const excess = total - max;
    const cut = Math.min(list[i].daysRemaining, excess);
    list[i].daysRemaining -= cut;
    total -= cut;
  }
  return list.filter(cd => cd.daysRemaining > 0);
}
function getStudyCooldown(t){ if(t==='cool1')return 1; if(t==='cool2')return 2; if(t==='cool3')return 3; return 0; }
function getDayCooldown(rec, dateKey){
  let total = 0;
  const bd = [];
  if(rec.study && rec.study.tier && rec.study.tier.startsWith('cool')){
    const d = getStudyCooldown(rec.study.tier);
    total += d;
    bd.push({ name: '学习' + rec.study.hours + 'h', days: d });
  }
  const lateExp = getDayExpenses(dateKey).filter(e => e.lateNight === true && e.emergency !== true);
  const lateJunk = lateExp.some(e => getCat(e.catId).isJunk);
  let dietDays = 0, dietName = '';
  if(!isDietOk(dateKey)){ dietDays = 2; dietName = '饮食异常'; }
  if(lateExp.length){
    const ld = lateJunk ? 2 : 1;
    if(ld > dietDays){ dietDays = ld; dietName = lateJunk ? '宵夜（垃圾食品）' : '宵夜'; }
  }
  if(dietDays){ total += dietDays; bd.push({ name: dietName, days: dietDays }); }
  else if(!isMoneyOk(dateKey)){ total += 1; bd.push({ name:'用钱异常', days:1 }); }
  if(rec.jingji && rec.jingji.checked && rec.jingji.ok === false){ total += 2; bd.push({ name:'养精蓄锐破戒', days:2 }); }
  if(rec.sleep && rec.sleep.checked && !rec.sleep.success){ total += 1; bd.push({ name:'睡觉失败', days:1 }); }
  return { total, breakdown: bd };
}

  if(!state.settings.birthday) return false;

function canUseBirthdayCard(checkDate){
  if(!state.settings.birthday) return false;
  if(state.birthdayCard.used) return false;
  if(state.birthdayCard.delayResolved && state.birthdayCard.delayDate) return checkDate === state.birthdayCard.delayDate;
  const bd = parseD(state.settings.birthday);
  const cd = parseD(checkDate);
  const y1 = new Date(cd.getFullYear(), bd.getMonth(), bd.getDate());
  const y2 = new Date(cd.getFullYear()-1, bd.getMonth(), bd.getDate());
  const y3 = new Date(cd.getFullYear()+1, bd.getMonth(), bd.getDate());
  const diff = Math.min(Math.abs(diffDays(y1,cd)), Math.abs(diffDays(y2,cd)), Math.abs(diffDays(y3,cd)));
  return BD_TOLERANCE >= diff;
}

function computeSchedule(){

  let d = parseD(state.settings.startDate || today);

  let cycleDay = 0;

    guard++;
    const key = fmtDate(d);
    const rec = state.records[key];
    const isFuture = key > today;
    const isExemptDay = rec && (rec.protect === true || rec.sick === true);
    const isMakeupDay = rec && rec.makeup === true;
    const dayInfo = {
      key, type: 'future', cycleDay: 0, cooldownRemaining: 0,
      isReward: false, isMealDay: false, isRest: false, isRestCandidate: false,
      isBirthday: false, isJJRelease: false, isBigCycleComplete: false,
      cooldownBreakdown: null, isRestConfirmed: false,
      isExempt: false, isMakeup: false
    };

    if(isExemptDay){ dayInfo.isExempt = true; }
    if(isMakeupDay){ dayInfo.isMakeup = true; }

    if(isBirthdayDate(key)) dayInfo.isBirthday = true;

    if(rec && rec._cycleReset){
      activeCooldowns = [];
    }

    activeCooldowns = activeCooldowns.filter(cd => cd.daysRemaining > 0);
    activeCooldowns = activeCooldowns.filter(cd => cd.expireDate === undefined || cd.expireDate >= key);

    // 休息候选日 / 休息日 / 延后处理
    if(pendingRestKey === key){
      const resolution = state.restResolved[key];
      const delayedTo = state.restReschedule[key];
      if(resolution === 'keep'){
        dayInfo.isRest = true;
        dayInfo.isRestConfirmed = true;
        result[key] = dayInfo;
        cycleDay = 0;
        pendingRestKey = null;
        lastBigCycleComplete = 0;
        d.setDate(d.getDate() + 1);
        continue;
      }
      if(resolution === 'delay' && delayedTo){
        pendingRestKey = delayedTo;
      } else {
        dayInfo.isRestCandidate = true;
        result[key] = dayInfo;
        d.setDate(d.getDate() + 1);
        continue;
      }
    }

    // 延后休息日到达
    let isDelayedRestDay = false;
    for(const orig in state.restReschedule){
      if(state.restReschedule[orig] === key && orig !== key){ isDelayedRestDay = true; break; }
    }
    if(isDelayedRestDay){
      dayInfo.isRest = true;
      dayInfo.isRestConfirmed = true;
      result[key] = dayInfo;
      cycleDay = 0;
      pendingRestKey = null;
      lastBigCycleComplete = 0;
      d.setDate(d.getDate() + 1);
      continue;
    }

    // JJ 释放日
    if(rec && !isFuture){
      if(rec.jingji && rec.jingji.checked){
        if(rec.jingji.ok === true){
          jjCurrent++;
          if(jjCurrent >= jjCycleLength){
            dayInfo.isJJRelease = true;
            jjCurrent = 0;
            jjCycleLength += (state.settings.jjIncrement || 5);
          }
        } else {
          jjCurrent = 0;
        }
      } else {
        jjCurrent = 0;
      }
    } else if(isFuture){
      jjCurrent++;
      if(jjCurrent >= jjCycleLength){
        dayInfo.isJJRelease = true;
        jjCurrent = 0;
        jjCycleLength += (state.settings.jjIncrement || 5);
      }
    }

    // 冷静期处理
    if(activeCooldowns.length > 0){
      dayInfo.type = isFuture ? 'future-cooldown' : 'cooldown';
      dayInfo.cycleDay = cycleDay;
      dayInfo.cooldownRemaining = activeCooldowns.reduce((sum, cd) => sum + cd.daysRemaining, 0);

      if(rec && !isFuture){
        const isGreen = isGreenForCooldown(rec, key, dayInfo.isJJRelease);

                if(isGreen){
          activeCooldowns.forEach(cd => {
            if(cd.daysTotal >= 3){
              cd.greenStreak = (cd.greenStreak || 0) + 1;
              if(cd.greenStreak >= 2){
                cd.daysRemaining = Math.max(0, cd.daysRemaining - 1);
                cd.greenStreak = 0;
              }
            }
          });
        }

        // 豁免日：不产生新冷静期；补签日：正常走冷静期来源收集
        if(!isExemptDay){
          const dayCd = getDayCooldown(rec, key);
          let newBreakdown = dayCd.breakdown.slice();

          if(rec.wake && rec.wake.checked && !(rec.wake.green === true || (rec.wake.green === undefined && rec.wake.fitness === true))){
            if(rec.wake.isRewardLate){
              wakeFailStreak = 0;
            } else {
              wakeFailStreak++;
              if(wakeFailStreak >= 2){
                newBreakdown.push({ name: '连续2次起床超时', days: 1 });
                wakeFailStreak = 0;
              }
            }
          } else {
            wakeFailStreak = 0;
          }

          if(rec.study && (rec.study.tier === 'conservative' || rec.study.tier === 'recovery')){
            recoveryStreak++;
            if(recoveryStreak >= 3){
              newBreakdown.push({ name: '连续3次恢复日', days: 1 });
              recoveryStreak = 0;
            }
          } else {
            recoveryStreak = 0;
          }

          if(newBreakdown.length){
            dayInfo.cooldownBreakdown = newBreakdown;
            newBreakdown.forEach(b => {
              activeCooldowns.push({
                id: nid('cd_'),
                sourceDate: key,
                reason: b.name,
                daysTotal: b.days,
                daysRemaining: b.days,
                greenStreak: 0,
                fresh: true,
                expireDate: fmtDate(addDays(parseD(key), Math.min(7, b.days + 3)))
              });
            activeCooldowns = capCooldowns(activeCooldowns, 7);
            });
          }
        }

                activeCooldowns.forEach(cd => {
          if(!cd.fresh){
            if(cd.daysTotal >= 3){
              if(!isGreen){ cd.greenStreak = 0; }
            } else {
              cd.daysRemaining--;
            }
          }
          cd.fresh = false;
        });
        activeCooldowns = activeCooldowns.filter(cd => cd.daysRemaining > 0);

        if(activeCooldowns.length === 0){
          dayInfo.type = 'green';
          dayInfo.cooldownRemaining = 0;
        } else {
          dayInfo.cooldownRemaining = activeCooldowns.reduce((sum, cd) => sum + cd.daysRemaining, 0);
        }
                  } else if(isFuture){
        activeCooldowns.forEach(cd => {
          if(!cd.fresh){
            if(cd.daysTotal >= 3){
              /* 未来日：按“不再新增失败”预测，不直接扣，见下方 projClean */
            } else {
              cd.daysRemaining--;
            }
          }
          cd.fresh = false;
        });
        /* 预测：每 3 天无新增失败，从尾部减 1 天 */
        projClean++;
        if(projClean >= 3){
          for(let i = activeCooldowns.length - 1; i >= 0; i--){
            if(activeCooldowns[i].daysTotal >= 3 && activeCooldowns[i].daysRemaining > 0){
              activeCooldowns[i].daysRemaining--;
              break;
            }
          }
          projClean = 0;
        }
        activeCooldowns = activeCooldowns.filter(cd => cd.daysRemaining > 0);
        if(activeCooldowns.length === 0){
          dayInfo.type = 'future';
        } else {
          dayInfo.cooldownRemaining = activeCooldowns.reduce((sum, cd) => sum + cd.daysRemaining, 0);
        }
      }
    } else {
      if(rec && !isFuture){
                const canAdvanceCycle = !isExemptDay;
        const studyCounted = !!(rec.study && (rec.study.isGreen === true || rec.study.tier === 'normal' || rec.study.tier === 'reward' || rec.study.tier === 'recovery' || rec.study.tier === 'conservative'));
        const fullGreen = canAdvanceCycle && isGreenForCycle(rec, key, dayInfo.isJJRelease);
        if(canAdvanceCycle && fullGreen){
          cycleDay++;
          dayInfo.cycleDay = cycleDay;
          if(cycleDay % 8 === 4) dayInfo.isMealDay = true;
          if(cycleDay % 8 === 0 && cycleDay > 0) dayInfo.isReward = true;
        }
        if(fullGreen){
          dayInfo.type = 'green';
        } else {
          dayInfo.type = 'partial';
          if(!isExemptDay){
            const dayCd = getDayCooldown(rec, key);
            let newBreakdown = dayCd.breakdown.slice();

            if(rec.wake && rec.wake.checked && !(rec.wake.green === true || (rec.wake.green === undefined && rec.wake.fitness === true))){
              if(rec.wake.isRewardLate){
                wakeFailStreak = 0;
              } else {
                wakeFailStreak++;
                if(wakeFailStreak >= 2){
                  newBreakdown.push({ name: '连续2次起床超时', days: 1 });
                  wakeFailStreak = 0;
                }
              }
            } else {
              wakeFailStreak = 0;
            }

            if(rec.study && (rec.study.tier === 'conservative' || rec.study.tier === 'recovery')){
              recoveryStreak++;
              if(recoveryStreak >= 3){
                newBreakdown.push({ name: '连续3次恢复日', days: 1 });
                recoveryStreak = 0;
              }
            } else {
              recoveryStreak = 0;
            }

            if(newBreakdown.length){
              dayInfo.cooldownBreakdown = newBreakdown;
              newBreakdown.forEach(b => {
                activeCooldowns.push({
                  id: nid('cd_'),
                  sourceDate: key,
                  reason: b.name,
                  daysTotal: b.days,
                  daysRemaining: b.days,
                  greenStreak: 0,
                  fresh: true,
                  expireDate: fmtDate(addDays(parseD(key), Math.min(7, b.days + 3)))
                });
            activeCooldowns = capCooldowns(activeCooldowns, 7);
              });
            }
          }
        }
      } else if(isFuture){
        cycleDay++;
        dayInfo.type = 'future';
        dayInfo.cycleDay = cycleDay;
        if(cycleDay % 8 === 4) dayInfo.isMealDay = true;
        if(cycleDay % 8 === 0 && cycleDay > 0) dayInfo.isReward = true;
      }
    }

    if(cycleDay > 0 && cycleDay % 32 === 0 && cycleDay !== lastBigCycleComplete){
      pendingRestKey = fmtDate(addDays(d, 1));
      lastBigCycleComplete = cycleDay;
      dayInfo.isBigCycleComplete = true;
    }

    /* 连续 3 天无新增失败 → 从尾部减 1 天 */
    let didReduce = false;
    if(rec && !isFuture && !isExemptDay && !isMakeupDay){
      let hadNew = false;
      for(let i = 0; activeCooldowns.length > i; i++){
        if(activeCooldowns[i].sourceDate === key) hadNew = true;
      }
      if(hadNew){
        cleanStreak = 0;
      } else {
        cleanStreak++;
        if(cleanStreak >= 3){
          for(let i = activeCooldowns.length - 1; i >= 0; i--){
            if(activeCooldowns[i].daysTotal >= 3 && activeCooldowns[i].daysRemaining > 0){
              activeCooldowns[i].daysRemaining--;
              break;
            }
          }
          cleanStreak = 0;
          activeCooldowns = activeCooldowns.filter(cd => cd.daysRemaining > 0);
          didReduce = true;
        }
      }
    }
    dayInfo.cleanStreak = cleanStreak;
    if(didReduce){
      dayInfo.cooldownRemaining = activeCooldowns.reduce((sum, cd) => sum + cd.daysRemaining, 0);
      if(0 === dayInfo.cooldownRemaining && (dayInfo.type === 'cooldown' || dayInfo.type === 'future-cooldown')){
        dayInfo.type = isFuture ? 'future' : 'green';
      }
    }
    if(key === getDayLifeDay()){
      state.todayCooldowns = activeCooldowns
        .filter(cd => cd.daysRemaining > 0)
        .map(cd => ({
          sourceDate: cd.sourceDate, reason: cd.reason,
          daysRemaining: cd.daysRemaining, daysTotal: cd.daysTotal,
          greenStreak: cd.greenStreak || 0
        }));
    }

    if(isFuture && (dayInfo.type === 'future-cooldown')){
      dayInfo.projected = true;
    }
    result[key] = dayInfo;
    d.setDate(d.getDate() + 1);
  }

  state.displayCooldowns = JSON.parse(JSON.stringify(activeCooldowns));
  return result;
}
/* ============================================================
   今日类型 / 自动失败
   ============================================================ */
function getTodayType(){
  let t = 'normal';
  try {
    const sch = computeSchedule();
    const info = sch[getDayLifeDay()] || {};
    if(info.isRest) t = 'rest';
    else if(info.isReward) t = 'reward';
  } catch(e){}
  return t;
}
function autoCheckWakeFail(){
  const today = getDayLifeDay();
  const r = state.records[today];
  if(r && r.wake && r.wake.checked) return;
  const type = getTodayType();
  if(type === 'rest') return;
  const cutoffMin = (type === 'reward') ? 9*60 : 7*60 + 15;
  const cutoffLabel = (type === 'reward') ? '超过9:00未打卡' : '超过7:15未打卡';
  const timeLabel = (type === 'reward') ? '09:00' : '07:15';
  if(nowMin() >= cutoffMin){
    const rec = getRecord(today);
    if(!rec.wake || !rec.wake.checked){
      rec.wake = {
        time: timeLabel, fitness: false, green: false, fail: true,
        msg: cutoffLabel + '，今日不算全绿',
        checked: true, autoFail: true, cutoffLabel
      };
      saveState(true);
    }
  }
}
function settleLifeDay(){
  if(!state || !state.enabled) return;
  const today = getDayLifeDay();
  const yesterday = fmtDate(addDays(parseD(today), -1));
  if(!state.records[yesterday]) state.records[yesterday] = {};
  const rec = state.records[yesterday];
  if(rec._settled) return;
  const sch = computeSchedule();
  const info = sch[yesterday] || {};
  if(info.isRest){
    rec._settled = { date: yesterday, at: nowTimeStr(), green: false, rest: true };
    saveState(true);
    return;
  }
  const green = isDayStrictGreen(yesterday, sch);
  const pointOk = green && sleepBeforeDeadline(rec.sleep);
  rec._settled = { date: yesterday, at: nowTimeStr(), green: green, points: pointOk };
  if(green){ state.stats.totalGreenDays = (state.stats.totalGreenDays || 0) + 1; }
  if(pointOk && !rec._pointsAwarded){
    rec._pointsAwarded = true;
    try { addPoints(2, 'full-green', '全绿', yesterday); } catch(e){}
    try { checkGreenStreak(yesterday); } catch(e){}
  }
  try { applyDayDeductions(yesterday, rec); } catch(e){}
  try { awardQuietNight(yesterday); } catch(e){}
  try { awardDinnerStreak(yesterday); } catch(e){}
  saveState(true);
}
function awardDinnerStreak(dateKey){
  const today = getDayLifeDay();
  let streak = 0;
  let d = parseD(dateKey);
  for(let i = 0; 60 > i; i++){
    const k = fmtDate(d);
    if(today === k) break;
    const rec = state.records[k];
    if(!rec) break;
    if(rec.dinnerOk !== true) break;
    if(state.violations.some(v => v.date === k && !v.isEmergency)) break;
    streak++;
    d = addDays(d, -1);
  }
  let pts = 0, src = '';
  if(streak === 3){ pts = 1; src = '健康晚餐 3 天'; }
  else if(streak === 7){ pts = 2; src = '健康晚餐 7 天'; }
  else if(streak === 14){ pts = 3; src = '健康晚餐 14 天'; }
  else if(streak === 30){ pts = 5; src = '健康晚餐 30 天'; }
  if(!pts) return;
  if(!state._dinnerAwarded) state._dinnerAwarded = {};
  const key = src + '|' + dateKey;
  if(state._dinnerAwarded[key]) return;
  state._dinnerAwarded[key] = true;
  addPoints(pts, 'healthy-dinner', src, dateKey);
}
function awardQuietNight(dateKey){
  const today = getDayLifeDay();
  let streak = 0;
  let d = parseD(dateKey);
  for(let i = 0; 45 > i; i++){
    const k = fmtDate(d);
    if(today === k) break;
    if(!state.records[k]) break;
    const bad = state.violations.some(v => v.date === k && !v.isEmergency) || getDayExpenses(k).some(e => e.lateNight === true && e.emergency !== true);
    if(bad) break;
    streak++;
    d = addDays(d, -1);
  }
  let pts = 0, src = '';
  if(streak === 3){ pts = 1; src = '无宵夜 3 天'; }
  else if(streak === 7){ pts = 2; src = '无宵夜 7 天'; }
  else if(streak === 14){ pts = 3; src = '无宵夜 14 天'; }
  if(!pts) return;
  if(!state._quietAwarded) state._quietAwarded = {};
  const key = src + '|' + dateKey;
  if(state._quietAwarded[key]) return;
  state._quietAwarded[key] = true;
  addPoints(pts, 'quiet-night', src, dateKey);
}

/* ============================================================
   热力图数据
   ============================================================ */
function buildOverallHeatmap(){
  const sch = computeSchedule();
  const today = todayStr();
  const arr = [];
  for(let i=29;i>=0;i--){
    const d = addDays(new Date(), -i); const k = fmtDate(d);
    const rec = state.records[k] || {};
    const info = sch[k] || {};
    let score = 0;
    if(rec.sleep && rec.sleep.success) score++;
    if(rec.wake && rec.wake.fitness) score++;
        if(rec.study && (rec.study.isGreen === true || rec.study.tier === 'normal' || rec.study.tier === 'reward')) score++;
    if(getDayExpenses(k).length > 0 && isMoneyOk(k)) score++;
    if(getDayExpenses(k).length > 0 && isDietOk(k)) score++;
    if((rec.jingji && rec.jingji.checked && rec.jingji.ok===true) || info.isJJRelease) score++;
    arr.push({ date:k, day:+k.slice(8), score, total:6, info, isToday:k===today });
  }
  return arr;
}
function buildStudyHeatmap(){
  const today = todayStr();
  const arr = [];
  for(let i=29;i>=0;i--){
    const d = addDays(new Date(), -i); const k = fmtDate(d);
    const rec = state.records[k] || {};
    const hours = (rec.study && rec.study.hours) ? rec.study.hours : 0;
    arr.push({ date:k, day:+k.slice(8), hours, isToday:k===today });
  }
  return arr;
}
function buildMoneyHeatmap(){
  const today = todayStr();
  const arr = [];
  for(let i=29;i>=0;i--){
    const d = addDays(new Date(), -i); const k = fmtDate(d);
    const spent = state.expenses.filter(e => e.date===k).reduce((a,b) => a + (b.price||0), 0);
    const junk  = state.expenses.filter(e => e.date===k && getCat(e.catId).isJunk).reduce((a,b) => a + (b.price||0), 0);
    arr.push({ date:k, day:+k.slice(8), spent, junk, isToday:k===today });
  }
  return arr;
}
function overallColor(score, total){
  if(score===0) return { color:'rgba(255,255,255,.04)', alpha:1 };
  const r = score/total;
  if(r>=1)     return { color:'#16a34a', alpha:1 };
  if(r>=0.83)  return { color:'#22c55e', alpha:0.85 };
  if(r>=0.66)  return { color:'#4ade80', alpha:0.7 };
  if(r>=0.5)   return { color:'#fbbf24', alpha:0.65 };
  if(r>=0.33)  return { color:'#fb923c', alpha:0.6 };
  return { color:'#f87171', alpha:0.55 };
}
function studyColor(hours){
  if(0 >= hours)  return { color:'rgba(255,255,255,.04)', alpha:1 };
  if(hours>=10) return { color:'#14532d', alpha:1 };
  if(hours>=9)  return { color:'#166534', alpha:1 };
  if(hours>=8)  return { color:'#15803d', alpha:1 };
  if(hours>=6)  return { color:'#16a34a', alpha:0.85 };
  if(hours>=4)  return { color:'#22c55e', alpha:0.7 };
  if(hours>=2)  return { color:'#4ade80', alpha:0.6 };
  return { color:'#86efac', alpha:0.5 };
}
function moneyColor(spent){
  if(0 >= spent)  return { color:'rgba(255,255,255,.04)', alpha:1 };
  if(spent>=100)return { color:'#1e3a8a', alpha:1 };
  if(spent>=80) return { color:'#1e40af', alpha:1 };
  if(spent>=60) return { color:'#1d4ed8', alpha:0.9 };
  if(spent>=40) return { color:'#3b82f6', alpha:0.8 };
  if(spent>=20) return { color:'#60a5fa', alpha:0.7 };
  if(spent>=10) return { color:'#93c5fd', alpha:0.6 };
  return { color:'#bfdbfe', alpha:0.5 };
}

function render(preserve){

  try { expireShards(); } catch(e){}

  const notActivated = !state.enabled || !state.settings.startDate;

  }

  if(startTs && startTs > Date.now()){
    document.querySelector('.app').style.display = 'none';

    else if(activeTab === 'diet') v.innerHTML = viewDiet();

  } catch(err){

    v.innerHTML = `<div class="alert danger"><span class="ico">⚠</span><div><b>渲染出错</b><p>${esc(err.message)}</p></div></div>`;

   日历卡片 + 冷静期来源卡片
   ============================================================ */
function getCooldownSourcesSummary(){
  const sch = computeSchedule();
  const all = [];
  let hasCooldown = false;
  for(let i=0;60 > i;i++){
    const k = fmtDate(addDays(new Date(), i));
    const info = sch[k];
    if(!info) continue;
    if(info.type === 'cooldown' || info.type === 'future-cooldown'){ hasCooldown = true; }
    if(info.cooldownBreakdown && info.cooldownBreakdown.length){
      info.cooldownBreakdown.forEach(b => { all.push({ name: b.name, days: b.days }); });
    }
  }
  if(!hasCooldown) return { hasCooldown:false, items:[] };
  const merged = {};
  all.forEach(it => { merged[it.name] = (merged[it.name]||0) + it.days; });
  const items = Object.entries(merged).map(([name, days]) => ({ name, days }));
  return { hasCooldown:true, items };
}

  if(md){ e.stopPropagation(); state.motivations = (state.motivations || []).filter(function(x){ return x.id !== md.dataset.motivDel; }); saveState(); render(); return; }
  const am = e.target.closest('[data-act="addMotiv"]');
  if(am){ e.stopPropagation(); openMotivationSheet(); return; }
});
function renderHomeCalendarCard(){
  if(!calCursor){ const d = parseD(getDayLifeDay()); calCursor = { y:d.getFullYear(), m:d.getMonth() }; }
  const { y, m } = calCursor;
  const first = new Date(y, m, 1);
  const startDay = first.getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const today = todayStr();
  const sch = computeSchedule();
  let html = '';
  for(let i=0;startDay > i;i++) html += '<div class="cal-day empty"></div>';
  for(let day=1; daysInMonth >= day; day++){
    const key = `${y}-${pad2(m+1)}-${pad2(day)}`;
    const info = sch[key] || {};
    const rec = state.records[key];
    const isFuture = key > today;
    const cls = ['cal-day'];
    if(key === today) cls.push('today');
    if(isFuture) cls.push('future');
    if(info.isBirthday) cls.push('birthday');
    if(info.isRest) cls.push('rest');
    if(info.isRestCandidate) cls.push('rest-candidate');
    if(info.type === 'cooldown' || info.type === 'future-cooldown'){
      cls.push('cool');
      if(isFuture) cls.push('cool-proj');
    }
    else if(info.isReward) cls.push('reward');
    else if(info.isMealDay) cls.push('meal');
    else if(info.type === 'green') cls.push('green');
    if(info.type === 'green' && rec && rec.sleep && !sleepBeforeDeadline(rec.sleep)) cls.push('nopoint');
    else if(info.type === 'partial') cls.push('partial');
    if(info.isJJRelease) cls.push('jj-release');
    const dots = [
      rec && rec.sleep && rec.sleep.success ? 'on sleep' : '',
      rec && rec.study && (rec.study.isGreen === true || rec.study.tier === 'normal' || rec.study.tier === 'reward') ? 'on study' : '',
      rec && rec.jingji && rec.jingji.ok ? 'on jj' : '',
      rec && rec.wake && rec.wake.fitness ? 'on wake' : ''
    ].filter(Boolean).map(c => `<i class="dot ${c}"></i>`).join('');
    html += `<div class="${cls.join(' ')}" data-date="${key}"${isFuture?' data-future="1"':''}><span class="cal-num">${day}</span><span class="cal-dots">${dots}</span></div>`;
  }
  return `
  <div class="card">
    <div class="card-t"><h3>📅 日历 · 未来安排</h3><span class="sub">冰冻/奖励/食堂日</span></div>
    <div class="cal-head" style="margin-top:0">
      <button data-act="calPrev">‹</button>
      <div class="cal-title">${y}年${m+1}月</div>
      <button data-act="calNext">›</button>
    </div>
    <div class="cal-week">${['日','一','二','三','四','五','六'].map(d => `<span>${d}</span>`).join('')}</div>
    <div class="cal-grid">${html}</div>
    <div class="heat-legend" style="margin-top:10px">
      <span>❄ 冷静</span><span>❄ 虚线=预测</span><span>◆ 食堂日</span><span>★ 奖励日</span><span>💧 释放日</span><span>🏖 休息日</span>
    </div>
    ${(() => {
      let last = '';
      const t0 = getDayLifeDay();
      for(let i = 0; 90 > i; i++){
        const kk = fmtDate(addDays(parseD(t0), i));
        const ii = sch[kk];
        if(ii && (ii.type === 'future-cooldown' || ii.type === 'cooldown')) last = kk;
        else if(last) break;
      }
      if(!last) return '';
      if(last === t0) return '<div class="hint" style="margin-top:8px;">今天之后冷静期就结束了。</div>';
      return '<div class="hint" style="margin-top:8px;">预测：若不再新增失败，冷静期预计 <b style="color:#a5d8f3">' + last + '</b> 结束（虚线为预测）。<br>每条冷静期最长持续 7 天，到期自动消散。</div>';
    })()}
  </div>`;
}

/* ============================================================
   情绪页
   ============================================================ */
function viewEmotion(){
  const all = state.actions.filter(a => a.emotions && a.emotions.length);
  const r = state.resistStreak, rs = state.restartStreak;
  const totalResist = state.actions.filter(a => a.type==='resist').length;
  const totalRestart = state.actions.filter(a => a.type==='restart').length;
  const resistSuccess = state.actions.filter(a => a.type==='resist' && a.result==='success').length;
  const resistFail = state.actions.filter(a => a.type==='resist' && a.result==='fail').length;
  const restartSuccess = state.actions.filter(a => a.type==='restart' && a.result==='success').length;
  const restartFail = state.actions.filter(a => a.type==='restart' && a.result==='fail').length;
  const resistRate = totalResist ? Math.round(resistSuccess/totalResist*100) : 0;
  const restartRate = totalRestart ? Math.round(restartSuccess/totalRestart*100) : 0;

  const emoCnt = {}; all.forEach(a => a.emotions.forEach(e => emoCnt[e] = (emoCnt[e]||0)+1));
  const emoList = Object.entries(emoCnt).sort((a,b) => b[1]-a[1]).slice(0,8);
  const maxEmo = Math.max(...emoList.map(x => x[1]), 1);
  const srcCnt = {}; all.forEach(a => a.sources.forEach(s => srcCnt[s] = (srcCnt[s]||0)+1));
  const srcList = Object.entries(srcCnt).sort((a,b) => b[1]-a[1]).slice(0,8);
  const maxSrc = Math.max(...srcList.map(x => x[1]), 1);
  const cross = {};
  all.forEach(a => a.emotions.forEach(e => {
    if(!cross[e]) cross[e] = { ok:0, total:0 };
    cross[e].total++;
    if(a.result === 'success') cross[e].ok++;
  }));
  const crossList = Object.entries(cross).filter(([_,v]) => v.total >= 2)
    .map(([k,v]) => ({ name:k, rate: Math.round(v.ok/v.total*100), total: v.total }))
    .sort((a,b) => b.total-a.total).slice(0,6);

  const day7 = [];
  for(let i=6;i>=0;i--){
    const d = addDays(new Date(), -i); const k = fmtDate(d);
    const dayActs = state.actions.filter(a => a.date===k && a.emotions && a.emotions.length);
    const dayEmos = {};
    dayActs.forEach(a => a.emotions.forEach(e => dayEmos[e] = (dayEmos[e]||0)+1));
    const top = Object.entries(dayEmos).sort((a,b) => b[1]-a[1])[0];
    day7.push({ date:k, day:['日','一','二','三','四','五','六'][d.getDay()], topEmo: top?top[0]:null, count: dayActs.length });
  }
  const weekEmos = {};
  day7.forEach(d => { if(d.topEmo) weekEmos[d.topEmo] = (weekEmos[d.topEmo]||0)+1; });
  const weekTop = Object.entries(weekEmos).sort((a,b) => b[1]-a[1])[0];
  const weekTopEmo = weekTop ? weekTop[0] : '—';
  const weekTopCount = weekTop ? weekTop[1] : 0;
  const weekSrc = {};
  day7.forEach(d => { state.actions.filter(a => a.date===d.date).forEach(a => a.sources.forEach(s => weekSrc[s]=(weekSrc[s]||0)+1)); });
  const weekTopSrc = Object.entries(weekSrc).sort((a,b) => b[1]-a[1])[0];
  const heat = [];
  for(let i=29;i>=0;i--){
    const d = addDays(new Date(), -i); const k = fmtDate(d);
    const dayActs = state.actions.filter(a => a.date===k && a.emotions && a.emotions.length);
    const dayEmos = {};
    dayActs.forEach(a => a.emotions.forEach(e => dayEmos[e]=(dayEmos[e]||0)+1));
    const top = Object.entries(dayEmos).sort((a,b) => b[1]-a[1])[0];
    heat.push({ date:k, day:+k.slice(8), emo: top?top[0]:null, count: dayActs.length, isToday: k===todayStr() });
  }
    let tip = '';
  if(crossList.length){
    const worst = crossList.reduce((a,b) => b.rate > a.rate ? a : b);
    if(50 > worst.rate){
      tip = `<div class="weather-tip">💡 当你在「${worst.name}」状态下，成功率只有 <b style="color:#fde68a">${worst.rate}%</b>。<br>下次出现这种情绪时，可以试试先深呼吸 5 分钟，或者先记录再决定。</div>`;
    } else {
      tip = `<div class="weather-tip">💡 目前各个状态下你都表现得很稳，继续保持！</div>`;
    }
  }
  return `
  <div class="dash-hero">
    <div class="dash-hero-t"><h3>💪 意志力总览</h3><span>${state.actions.length} 条记录</span></div>
    <div class="dash-grid">
      <div class="dash-cell resist"><div class="lbl">💪 抵抗连续</div><div class="val">${r.current}</div><div class="sub2">历史最长 ${r.max} · 成功率 ${resistRate}%</div></div>
      <div class="dash-cell restart"><div class="lbl">🔄 重启连续</div><div class="val">${rs.current}</div><div class="sub2">历史最长 ${rs.max} · 成功率 ${restartRate}%</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;">
      <div style="background:rgba(0,0,0,.18);border-radius:10px;padding:8px 10px;font-size:11.5px;">
        <div style="color:var(--muted);font-size:10.5px;">抵抗</div>
        <div style="margin-top:3px;"><span style="color:#86efac;font-weight:600;">${resistSuccess} 成功</span> · <span style="color:#fca5a5;font-weight:600;">${resistFail} 失败</span></div>
      </div>
      <div style="background:rgba(0,0,0,.18);border-radius:10px;padding:8px 10px;font-size:11.5px;">
        <div style="color:var(--muted);font-size:10.5px;">重启</div>
        <div style="margin-top:3px;"><span style="color:#86efac;font-weight:600;">${restartSuccess} 成功</span> · <span style="color:#fca5a5;font-weight:600;">${restartFail} 失败</span></div>
      </div>
    </div>
  </div>

  <div class="weather-card">
    <div class="weather-title">🌤 本周情绪天气</div>
    <div class="weather-main">主导情绪：<b>${esc(weekTopEmo)}</b>（出现 ${weekTopCount} 天）${weekTopSrc?`<br>最常触发情境：<b>${esc(weekTopSrc[0])}</b>`:''}</div>
    ${tip}
  </div>

  <div class="card">
    <div class="card-t"><h3>📅 最近 30 天情绪热力图</h3><span class="sub">颜色 = 当天主导情绪</span></div>
    <div class="heatmap">
      ${heat.map(h => { const c = h.emo ? (EMO_COLORS[h.emo]||'#64748b') : 'rgba(255,255,255,.04)'; const alpha = h.emo ? 0.55 + Math.min(h.count*0.15, 0.45) : 1; return `<div class="heat-cell ${h.emo?'has':''} ${h.isToday?'today':''}" style="background:${c};opacity:${alpha}" title="${h.date}${h.emo?' · '+h.emo:''}">${h.day}</div>`; }).join('')}
    </div>
    <div class="heat-legend">
      ${[...new Set(heat.filter(h => h.emo).map(h => h.emo))].slice(0,6).map(e => `<span><i style="background:${EMO_COLORS[e]||'#64748b'}"></i>${esc(e)}</span>`).join('')}
    </div>
  </div>

  ${(() => {
    const tips = {
      '焦虑':['先写下 3 件你真正能控制的事','只做其中最小的一步，5 分钟算数','剩下的事设个时间再想'],
      '疲惫':['先闭眼 10 分钟，别硬撑','补水 + 站起来走两圈','今晚提前 30 分钟睡'],
      '压力':['把任务拆成 15 分钟一段','先做最容易启动的那段','完成后奖励自己 5 分钟休息'],
      '孤独':['给一个朋友发条消息，不用有理由','出门走 10 分钟','把今天写下来'],
      '委屈':['先把事情写下来，不评价','问自己：我真正需要的是什么','找一个人说出来'],
      '愤怒':['先离开现场 5 分钟','喝杯水、深呼吸 4 次','等情绪降下来再决定'],
      '兴奋':['把冲动记下来，等 24 小时','先做一件正事再奖励自己','别在这时候做花钱决定'],
      '无聊':['换一个环境','做一件 5 分钟的小事','列 3 个想做但一直没开始的'],
      '自责':['只写事实，不写评价','问：下次具体改哪一步','允许自己这一次'],
      '空虚':['做一件有具体结果的小事','出门晒太阳 10 分钟','联系一个人']
    };
    const cnt = {};
    state.actions.forEach(a => (a.emotions || []).forEach(e => cnt[e] = (cnt[e] || 0) + 1));
    const list = Object.keys(cnt).map(k => ({ k: k, n: cnt[k] })).sort((a,b) => b.n - a.n);

    const top = list[0].k;
    const acts = tips[top] || ['先记录一次，再决定要不要做'];

      <div class="card-t"><h3>🎯 给你的建议</h3><span class="sub">基于「${esc(top)}」${list[0].n} 次</span></div>

      ${acts.map((t, i) => `<div class="rec"><span class="rec-dot" style="background:#fbbf24"></span><div class="rec-mid"><div class="rec-name" style="font-size:12.5px">${i + 1}. ${esc(t)}</div></div></div>`).join('')}
      <div class="hint" style="margin-top:8px;">做完了再决定：要不要吃、要不要破戒。记录的瞬间，冲动就已经减弱了。</div>
    </div>`;
  })()}
  <div class="card">
    <div class="card-t"><h3>💭 情绪分布</h3><span class="sub">${all.length} 条</span></div>
    ${emoList.length ? emoList.map(([name,cnt]) => `<div class="bar-row"><span class="bar-name">${esc(name)}</span><div class="bar-track"><div class="bar-fill" style="width:${cnt/maxEmo*100}%;background:linear-gradient(90deg,${EMO_COLORS[name]||'#a78bfa'},${EMO_COLORS[name]||'#8b5cf6'})"></div></div><span class="bar-cnt">${cnt}</span></div>`).join('') : '<div class="empty">还没有情绪记录</div>'}
  </div>

  <div class="card">
    <div class="card-t"><h3>🎯 源头分布</h3><span class="sub">最容易触发</span></div>
    ${srcList.length ? srcList.map(([name,cnt]) => `<div class="bar-row"><span class="bar-name">${esc(name)}</span><div class="bar-track"><div class="bar-fill blue" style="width:${cnt/maxSrc*100}%"></div></div><span class="bar-cnt">${cnt}</span></div>`).join('') : '<div class="empty">还没有源头记录</div>'}
  </div>

  <div class="card">
    <div class="card-t"><h3>📊 情绪 × 成功率</h3><span class="sub">什么状态下最容易破戒</span></div>
    ${crossList.length ? crossList.map(c => `<div class="cross-row"><span>${esc(c.name)} <span style="color:var(--dim);font-size:10.5px;">(${c.total}条)</span></span><span class="cross-rate" style="color:${c.rate>=60?'#86efac':c.rate>=40?'#fde68a':'#fca5a5'};">${c.rate}% 成功</span></div>`).join('') : '<div class="empty">至少需要 2 条同情绪记录</div>'}
  </div>

  ${(() => {
    const sch = computeSchedule();
    const cdDays = {};
    Object.keys(sch).forEach(k => { if(sch[k] && sch[k].cooldownBreakdown && sch[k].cooldownBreakdown.length) cdDays[k] = true; });
    const emoCd = {}, emoAll = {};
    state.actions.forEach(a => {
      (a.emotions || []).forEach(e => {
        emoAll[e] = (emoAll[e] || 0) + 1;
        if(cdDays[a.date]) emoCd[e] = (emoCd[e] || 0) + 1;
      });
    });
    const rows = Object.keys(emoAll).map(e => ({ name:e, total: emoAll[e], cd: emoCd[e] || 0, rate: Math.round((emoCd[e] || 0) / emoAll[e] * 100) }))
      .filter(x => x.total >= 2).sort((a,b) => b.rate - a.rate).slice(0, 6);
    if(!rows.length) return '';
    return `<div class="card"><div class="card-t"><h3>❄ 情绪 × 冷静期</h3><span class="sub">哪种情绪最容易掉进去</span></div>
      ${rows.map(r => `<div class="cross-row"><span>${esc(r.name)} <span style="color:var(--dim);font-size:10.5px;">(${r.total}次)</span></span><span class="cross-rate" style="color:${r.rate >= 50 ? '#fca5a5' : (r.rate >= 25 ? '#fde68a' : '#86efac')};">${r.rate}% 当天进冷静</span></div>`).join('')}

    </div>`;
  })()}

    <div class="card-t"><h3>📜 时间轴</h3><span class="sub">最近 20 条</span></div>

  </div>`;
}

    <div class="card-t"><h3>📊 最近 30 天支出</h3><span class="sub">越深花费越高</span></div>
    <div class="heatmap">
      ${moneyHeat.map(h => { const {color,alpha} = moneyColor(h.spent); return `<div class="heat-cell ${h.spent>0?'has':''} ${h.isToday?'today':''}" style="background:${color};opacity:${alpha}" title="${h.date} · ¥${h.spent.toFixed(0)}">${h.day}</div>`; }).join('')}
    </div>
    <div class="heat-grad"><span>¥0</span><div class="bar" style="background:linear-gradient(90deg,#bfdbfe,#93c5fd,#60a5fa,#3b82f6,#1d4ed8,#1e40af,#1e3a8a)"></div><span>¥100+</span></div>
  </div>

function viewDiet(){

  const dietOk = isDietOk(today);
  const range = 30;
  const startDate = fmtDate(addDays(parseD(today), -range+1));
  const recentFoods = state.expenses.filter(e => e.date >= startDate && today >= e.date && getCat(e.catId).isFood);
  const byCat = {};
  recentFoods.forEach(e => { const cid = e.catId || 'unknown'; if(!byCat[cid]) byCat[cid] = {count:0,amount:0,junk:0}; byCat[cid].count++; byCat[cid].amount += (e.price||0); if(getCat(e.catId).isJunk) byCat[cid].junk++; });
  const catRows = Object.entries(byCat).map(([id,v]) => { const c = getCat(id); return { name: c.name, color: c.color, count: v.count, amount: v.amount, junk: v.junk }; }).sort((a,b) => b.count - a.count);
  const days7 = [];
  for(let i=6;i>=0;i--){
    const d = addDays(parseD(today), -i); const k = fmtDate(d);
    const foods = getDayFoods(k);
    const junkCount = foods.filter(f => getCat(f.catId).isJunk).length;
    const spent = foods.reduce((a,b) => a + (b.price||0), 0);
    const hasViolation = state.violations.some(v => v.date === k && !v.isEmergency);
    days7.push({ date:k, label: pad2(d.getDate()), day:['日','一','二','三','四','五','六'][d.getDay()], count: foods.length, junkCount, spent, hasViolation });
  }
  const maxCount = Math.max(...days7.map(x => x.count), 1);
  return `
  <div class="diet-hero">
    <div style="display:flex;justify-content:space-between;align-items:center;"><span style="font-size:12px;color:var(--muted);">今日食物</span><span style="font-size:10px;padding:3px 9px;border-radius:20px;background:rgba(74,222,128,.15);color:#86efac;">${todayFoods.length} 项</span></div>
    <div class="diet-amount">${todayFoods.length===0?'—':(dietOk?'✓ 正常':'⚠ 异常')}</div>
    <div class="diet-sub">今日食物花费 ¥${todayFoods.reduce((a,b) => a + (b.price||0), 0).toFixed(2)}</div>
  </div>
  <div class="card">
    <div class="card-t"><h3>📅 最近 7 天日报</h3></div>
    <table class="data-table"><thead><tr><th>日期</th><th class="num">食物</th><th class="num">垃圾</th><th class="num">花费</th><th class="num">违规</th></tr></thead><tbody>
      ${days7.map(d => `<tr><td>${d.label} 周${d.day}</td><td class="num">${d.count}</td><td class="num ${d.junkCount>0?'bad':''}">${d.junkCount}</td><td class="num">¥${d.spent.toFixed(0)}</td><td class="num ${d.hasViolation?'bad':'ok'}">${d.hasViolation?'是':'—'}</td></tr>`).join('')}
    </tbody></table>
  </div>
  <div class="card">
    <div class="card-t"><h3>📊 近 30 天分类汇总</h3><span class="sub">${recentFoods.length} 项</span></div>
    ${catRows.length ? `<table class="data-table"><thead><tr><th>分类</th><th class="num">次数</th><th class="num">金额</th><th class="num">垃圾</th></tr></thead><tbody>${catRows.map(c => `<tr><td><span class="color-dot" style="background:${c.color}"></span>${esc(c.name)}</td><td class="num">${c.count}</td><td class="num">¥${c.amount.toFixed(0)}</td><td class="num ${c.junk>0?'bad':''}">${c.junk>0?c.junk:'—'}</td></tr>`).join('')}</tbody></table>` : '<div class="hint">近30天没有食物记录</div>'}
  </div>
  <div class="card">
    <div class="card-t"><h3>📈 最近 7 天趋势</h3></div>
    <div class="trend">${days7.map(d => `<div class="trend-bar"><div class="bar food ${d.junkCount>0?'junk':''}" style="height:${(d.count/maxCount)*70}%;"></div><div class="lbl">${d.label}</div></div>`).join('')}</div>
  </div>
  <div class="card">
    <div class="card-t"><h3>🍽 今日吃了什么</h3><span class="sub">来自记录页</span></div>
    ${todayFoods.length ? todayFoods.map(e => { const cat = getCat(e.catId); return `<div class="rec"><span class="rec-dot" style="background:${cat.color}"></span><div class="rec-mid"><div class="rec-name">${esc(e.name)}</div><div class="rec-meta"><span>${esc(cat.name)}</span>${cat.isJunk?'<span style="color:#fca5a5">· 垃圾</span>':''}</div></div><span class="rec-amt ${cat.isJunk?'bad':''}">¥${(e.price||0).toFixed(2)}</span></div>`; }).join('') : '<div class="hint">今天还没有食物记录</div>'}
  </div>
  ${state.violations.length ? `<div class="card"><div class="card-t"><h3>⚠️ 19:00 后违规</h3><span class="sub">${state.violations.length} 条</span></div>${state.violations.map(v => `<div class="violation-item ${v.isEmergency?'emergency':''}"><b>${v.date} ${v.time}</b> · ${esc(v.itemName)} ${v.isEmergency?'<span style="color:#fde68a;">（紧急例外）</span>':'<span style="color:#fca5a5;">（违规）</span>'}${v.note?`<div style="color:var(--muted);margin-top:3px;font-size:11.5px;">${esc(v.note)}</div>`:''}</div>`).join('')}</div>` : ''}
  `;
}

/* ============================================================
   食物库（店 → 食物，带风险等级/标签/黑白名单）
   ============================================================ */
const FOOD_TAGS = [
  { id:'fried',  name:'油炸' }, { id:'sugar',  name:'高糖' },
  { id:'bread',  name:'面包' }, { id:'cream',  name:'奶油' },
  { id:'spicy',  name:'辛辣' }, { id:'oily',   name:'油腻' },
  { id:'dairy',  name:'含奶' }, { id:'nuts',   name:'坚果' },
  { id:'cold',   name:'生冷' }
];
const FOOD_RISK_LABEL = ['', '低', '中低', '中', '中高', '高' ];
const MEAL_RISK_MAX = {
  stir:2, dine:3, sweet:3, grill:4, hotpot:4, gather:4, fast:4, buffet:5
};
function ensureFoodLib(){
  if(!state.foodLib || Array.isArray(state.foodLib)){
    const old = Array.isArray(state.foodLib) ? state.foodLib : [];
    state.foodLib = { shops: [], foods: [] };
    for(let i = 0; old.length > i; i++){
      const f = old[i];
      state.foodLib.foods.push({
        id: f.id || nid('fd_'), shopId: '', name: f.name || '未命名',
        price: f.price || 0, catId: f.catId || 'c_normal',
        risk: (getCat(f.catId).isJunk ? 5 : 2), tags: [], list: 'white', note: ''
      });
    }
  }
  if(!state.foodLib.shops) state.foodLib.shops = [];
  if(!state.foodLib.foods) state.foodLib.foods = [];
  return state.foodLib;
}
function getShopName(id){
  const lib = ensureFoodLib();
  const sp = lib.shops.find(x => x.id === id);
  return sp ? sp.name : '';
}
function addFoodShop(name){
  const lib = ensureFoodLib();
  const n = (name || '').trim();
  if(!n){ toast('请输入店名'); return null; }
  if(lib.shops.some(x => x.name === n)){ toast('这家店已经有了'); return null; }
  const sp = { id: nid('sh_'), name: n };
  lib.shops.push(sp);
  saveState(); return sp;
}
function addFoodItem(data){
  const lib = ensureFoodLib();
  const name = (data.name || '').trim();
  if(!name){ toast('请输入食物名称'); return false; }
  let shopId = data.shopId || '';
  if(data.shopName){
    const sp = addFoodShop(data.shopName);
    if(sp) shopId = sp.id;
  }
  lib.foods.push({
    id: nid('fd_'), shopId: shopId, name: name,
    price: Number(data.price) || 0, catId: data.catId || 'c_normal',
    risk: Number(data.risk) || 2,
    tags: data.tags || [],
    list: data.list === 'black' ? 'black' : 'white',
    note: (data.note || '').trim()
  });
  saveState(); render();
  toast('已加入食物库');
  return true;
}
function removeFoodItem(id){
  const lib = ensureFoodLib();
  const before = lib.foods.length;
  lib.foods = lib.foods.filter(f => f.id !== id);
  if(before === lib.foods.length) return;
  saveState(); render();
  toast('已移出食物库');
}
function getFoodsForCoupon(typeId){
  const lib = ensureFoodLib();
  const maxRisk = MEAL_RISK_MAX[typeId] || 3;
  return lib.foods.map(f => {
    let ok = true, why = '';
    if(f.list === 'black'){ ok = false; why = '黑名单'; }
    else if(f.risk > maxRisk){ ok = false; why = '风险等级超出本券（上限 ' + FOOD_RISK_LABEL[maxRisk] + '）'; }
    return { f: f, ok: ok, why: why };
  });
}
function openFoodLibrary(){
  ensureFoodLib();
  const lib = state.foodLib;
  const rows = lib.foods.length
    ? lib.foods.map(f => {
        const shop = getShopName(f.shopId);
        const tl = (f.tags || []).map(t => { const d = FOOD_TAGS.find(x => x.id === t); return d ? d.name : t; }).join('/');
        return `<div class="rec"><span class="rec-dot" style="background:${f.list === 'black' ? '#f87171' : '#4ade80'}"></span><div class="rec-mid"><div class="rec-name">${esc(f.name)} <span style="font-size:10px;color:var(--muted)">${esc(shop || '未指定店')}</span></div><div class="rec-meta"><span>¥${f.price}</span><span>风险${FOOD_RISK_LABEL[f.risk] || f.risk}</span>${tl ? '<span>' + esc(tl) + '</span>' : ''}${f.list === 'black' ? '<span style="color:#fca5a5">黑名单</span>' : ''}</div></div><button class="rec-rm" data-food-del="${f.id}">×</button></div>`;
      }).join('')
    : '<div class="hint">食物库还是空的，先加一条试试</div>';

/* ============================================================
   卡片碎片（3 个碎片合成 1 张卡）
   ============================================================ */
const SHARD_KINDS = [
  { id:'clean',   name:'打扫卡碎片', card:'打扫卡',   cost:1 },
  { id:'protect', name:'保护卡碎片', card:'保护卡',   cost:2 },
  { id:'makeup',  name:'补签卡碎片', card:'补签卡',   cost:2 }
];
const SHARD_NEED = 3;
const SHARD_WEEK_LIMIT = 3;
const SHARD_VALID_DAYS = 60;
function ensureShards(){
  if(!state.shards) state.shards = { clean:0, protect:0, makeup:0 };
  if(!state.shardDates) state.shardDates = { clean:[], protect:[], makeup:[] };
  const k = ['clean','protect','makeup'];
  for(let i = 0; k.length > i; i++){
    const kk = k[i];
    if(state.shards[kk] === undefined) state.shards[kk] = 0;
    if(!state.shardDates[kk]) state.shardDates[kk] = [];
    while(state.shardDates[kk].length > state.shards[kk]) state.shardDates[kk].pop();
    while(state.shards[kk] > state.shardDates[kk].length) state.shardDates[kk].push(getDayLifeDay());
  }
  return state.shards;
}
function expireShards(){
  ensureShards();
  const today = getDayLifeDay();
  const k = ['clean','protect','makeup'];
  let lost = 0;
  for(let i = 0; k.length > i; i++){
    const kk = k[i];
    const keep = [];
    for(let j = 0; state.shardDates[kk].length > j; j++){
      const d = state.shardDates[kk][j];
      const gap = Math.abs(diffDays(parseD(d), parseD(today)));
      if(SHARD_VALID_DAYS >= gap) keep.push(d);
      else lost++;
    }
    state.shardDates[kk] = keep;
    state.shards[kk] = keep.length;
  }
  if(lost > 0){
    logAudit('shard', '有 ' + lost + ' 个碎片超过 ' + SHARD_VALID_DAYS + ' 天已过期');
  }
}
function shardExpireHint(kind){
  ensureShards();
  const arr = state.shardDates[kind] || [];
  if(!arr.length) return '';
  let oldest = arr[0];
  for(let i = 0; arr.length > i; i++){ if(oldest > arr[i]) oldest = arr[i]; }
  const left = SHARD_VALID_DAYS - Math.abs(diffDays(parseD(oldest), parseD(getDayLifeDay())));
  if(0 >= left) return '即将过期';
  if(14 >= left) return '最早 ' + left + ' 天后过期';
  return '';
}
function shardBuyLeft(){
  const ws = getWeekStart();
  if(!state.shardWeek || state.shardWeek.weekStart !== ws) state.shardWeek = { weekStart: ws, used: 0 };
  return SHARD_WEEK_LIMIT - state.shardWeek.used;
}
function buyShard(kind){
  const def = SHARD_KINDS.find(x => x.id === kind);
  if(!def){ toast('未知碎片'); return false; }
  ensureShards();
  if(0 >= shardBuyLeft()){ toast('本周碎片已换满 ' + SHARD_WEEK_LIMIT + ' 个'); return false; }
  if(def.cost > (state.points || 0)){ toast('积分不足'); return false; }
  pushUndo('兑换' + def.name);
  state.points = (state.points || 0) - def.cost;
  state.shards[kind] += 1;
  if(!state.shardDates) state.shardDates = { clean:[], protect:[], makeup:[] };
  state.shardDates[kind].push(getDayLifeDay());
  state.shardWeek.used += 1;
  logAudit('shard', '兑换 ' + def.name + '（-' + def.cost + ' 分）');
  saveState(); render();
  toast('获得 1 个' + def.name + '（' + state.shards[kind] + '/' + SHARD_NEED + '）');
  return true;
}
function craftCard(kind){
  const def = SHARD_KINDS.find(x => x.id === kind);
  if(!def){ toast('未知碎片'); return false; }
  ensureShards();
  if(SHARD_NEED > state.shards[kind]){ toast('碎片不够（' + state.shards[kind] + '/' + SHARD_NEED + '）'); return false; }
  pushUndo('合成' + def.card);
  state.shards[kind] -= SHARD_NEED;
  if(state.shardDates && state.shardDates[kind]) state.shardDates[kind] = state.shardDates[kind].slice(SHARD_NEED);
  logAudit('shard', '用 ' + SHARD_NEED + ' 个碎片合成 ' + def.card);
  state.cards = state.cards || {};
  state.cards[kind] = (state.cards[kind] || 0) + 1;
  saveState(); render();
  toast('合成成功：' + def.card + ' +1');
  return true;
}

const FUNC_CARDS = [
  { id:'clean',   name:'打扫卡',     cost:4 },

function funcBuyLeft(){
  const ws = getWeekStart();
  if(!state.funcBuy || state.funcBuy.weekStart !== ws) state.funcBuy = { weekStart: ws, counts: {} };
  return function(id){ return 1 - (state.funcBuy.counts[id] || 0); };
}
function buyFuncCard(id){
  const def = FUNC_CARDS.find(x => x.id === id);
  if(!def){ toast('未知卡片'); return false; }
  const left = funcBuyLeft();
  if(0 >= left(id)){ toast('本周已经换过这张卡了'); return false; }
