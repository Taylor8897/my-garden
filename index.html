<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1a12">
<title>自律花园</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
:root{--bg:#0d1f14;--card:#142a1c;--card2:#1a3524;--line:#244a30;--txt:#e8f5ec;--muted:#7fa88a;--dim:#4d7a5c;--accent:#4ade80;--accent2:#22c55e;--gold:#fbbf24;--red:#f87171;--blue:#60a5fa;--purple:#a78bfa;--pink:#f472b6;--ice:#a5d8f3;--r:16px}
body.cold{--bg:#0a1520;--card:#0f2233;--card2:#14293d;--line:#1e3a52;--txt:#dbeafe;--muted:#7aa8c8;--dim:#4a6d8a;--accent:#60a5fa;--accent2:#3b82f6;--gold:#93c5fd}
body.rest{--bg:#1f1a2e;--card:#2a2440;--card2:#342c4c;--line:#403658;--txt:#f0e9ff;--muted:#a896c8;--dim:#6d5e8a;--accent:#c4b5fd;--accent2:#a78bfa;--gold:#fbbf24}
body.bd-celebration{--bg:#2a0a0a;--card:#3d1010;--card2:#4a1515;--line:#6b2020;--txt:#fff0e0;--muted:#d49090;--dim:#8a4a4a;--accent:#ff4d4d;--accent2:#ff8833;--gold:#ffd700}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .8s,color .8s;min-height:100vh;padding-bottom:80px}
.bg-sky{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(1200px 600px at 50% -10%,rgba(74,222,128,.10),transparent 60%),linear-gradient(180deg,#0d1f14 0%,#0a1710 100%);transition:background .8s}
body.cold .bg-sky{background:radial-gradient(1200px 600px at 50% -10%,rgba(96,165,250,.12),transparent 60%),linear-gradient(180deg,#0a1520 0%,#06101a 100%)}
body.rest .bg-sky{background:radial-gradient(1200px 600px at 50% -10%,rgba(196,181,253,.15),transparent 60%),linear-gradient(180deg,#1f1a2e 0%,#15102a 100%)}
body.bd-celebration .bg-sky{background:radial-gradient(1200px 600px at 50% -10%,rgba(255,80,80,.28),transparent 60%),linear-gradient(180deg,#2a0a0a 0%,#150505 100%)}
.snowflake{position:fixed;top:-30px;color:#fff;pointer-events:none;z-index:2;opacity:.85;animation:snowfall linear infinite}
@keyframes snowfall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(105vh) rotate(360deg)}}
body:not(.cold) .snowflake{display:none}
.cloud{position:fixed;top:-30px;font-size:24px;pointer-events:none;z-index:2;opacity:.3;animation:cloudfall linear infinite}
@keyframes cloudfall{0%{transform:translateY(0) translateX(0)}100%{transform:translateY(105vh) translateX(30px)}}
body:not(.rest) .cloud{display:none}
.party-ribbon{position:fixed;top:-40px;width:14px;height:32px;pointer-events:none;z-index:3;border-radius:2px;animation:partyRibbonFall linear infinite;box-shadow:0 0 8px rgba(255,215,0,.4)}
@keyframes partyRibbonFall{0%{transform:translateY(0) rotate(0deg);opacity:1}50%{transform:translateY(50vh) rotate(360deg)}100%{transform:translateY(105vh) rotate(720deg);opacity:.3}}
body:not(.bd-celebration) .party-ribbon{display:none}
.firework{position:fixed;width:5px;height:5px;border-radius:50%;pointer-events:none;z-index:999;background:currentColor;box-shadow:0 0 8px 3px currentColor;animation:fireworkBurst 1.6s ease-out forwards}
@keyframes fireworkBurst{0%{transform:translate(0,0) scale(1.4);opacity:1}80%{opacity:.9}100%{transform:translate(var(--fx),var(--fy)) scale(0);opacity:0}}
.hbd-burst{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:9999;font-size:78px;font-weight:900;letter-spacing:14px;color:#ffd700;text-shadow:0 0 30px #ff4d4d,0 0 60px #ff8833;animation:hbdBurst 3.2s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes hbdBurst{0%{transform:scale(.05) rotate(-25deg);opacity:0;filter:blur(30px)}18%{transform:scale(1.9) rotate(8deg);opacity:1;filter:blur(0)}45%{transform:scale(1.25) rotate(-4deg);opacity:1}75%{transform:scale(1.55) rotate(3deg);opacity:1}100%{transform:scale(2.4) rotate(0deg);opacity:0;filter:blur(10px)}}
.app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;z-index:3}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:12px 14px 10px;backdrop-filter:blur(18px);background:rgba(13,31,20,.82);border-bottom:1px solid rgba(36,74,48,.7)}
body.cold .topbar{background:rgba(10,21,32,.82)}
body.rest .topbar{background:rgba(31,26,46,.82)}
body.bd-celebration .topbar{background:rgba(42,10,10,.88)}
.date-display{flex:1;text-align:center;padding:4px 8px}
.date-display b{display:block;font-size:14px;font-weight:700}
.date-display span{font-size:10px;color:var(--muted)}
.icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:15px;display:grid;place-items:center;cursor:pointer}
.icon-btn:active{transform:scale(.92)}
.icon-btn.on{color:var(--accent);border-color:rgba(74,222,128,.4)}
.view{padding:12px 12px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.card-t{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.card-t h3{font-size:14px;font-weight:600}
.card-t .sub{font-size:11px;color:var(--muted)}
.hero{background:linear-gradient(150deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:10px}
.hero-top{display:flex;justify-content:space-between;align-items:center}
.hero-label{font-size:11px;color:var(--muted)}
.pill{font-size:10px;padding:3px 9px;border-radius:20px;background:rgba(74,222,128,.15);color:var(--accent);border:1px solid rgba(74,222,128,.3);font-weight:500}
.hero-amount{font-size:30px;font-weight:800;letter-spacing:-1px;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.hero-sub{font-size:11.5px;color:var(--muted)}
.progress{height:7px;border-radius:7px;background:rgba(255,255,255,.06);margin:12px 0;overflow:hidden}
.progress-fill{height:100%;border-radius:7px;transition:width .6s;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.hero-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.hero-grid>div{text-align:center;background:rgba(255,255,255,.04);border-radius:10px;padding:7px 3px}
.hero-grid b{display:block;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.hero-grid span{font-size:9.5px;color:var(--muted)}
.alert{display:flex;gap:9px;padding:10px 12px;border-radius:12px;margin-bottom:8px;border:1px solid;font-size:12.5px;align-items:flex-start}
.alert.danger{background:rgba(248,113,113,.09);border-color:rgba(248,113,113,.3);color:#fca5a5}
.alert.ok{background:rgba(74,222,128,.08);border-color:rgba(74,222,128,.25);color:#86efac}
.alert.info{background:rgba(96,165,250,.08);border-color:rgba(96,165,250,.25);color:#93c5fd}
.alert.gold{background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.25);color:#fde68a}
.alert.purple{background:rgba(167,139,250,.08);border-color:rgba(167,139,250,.25);color:#c4b5fd}
.alert.rest{background:rgba(196,181,253,.1);border-color:rgba(196,181,253,.3);color:#ddd6fe}
.alert.bd{background:rgba(255,215,0,.1);border-color:rgba(255,215,0,.35);color:#ffd700}
.alert .ico{font-size:14px;flex-shrink:0;line-height:1.3}
.alert b{display:block;font-size:12.5px;font-weight:600;margin-bottom:2px}
.alert p{font-size:11.5px;opacity:.85;line-height:1.45}
.task{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.task.checked{opacity:.65;border-color:rgba(74,222,128,.3)}
.task.failed{opacity:.7;border-color:rgba(248,113,113,.4)}
.task.auto{opacity:.85;border-color:rgba(167,139,250,.4)}
.task.bd-disabled{opacity:.35;filter:grayscale(.5)}
.task-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.task-icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:rgba(255,255,255,.04);flex-shrink:0}
.task-title{flex:1}
.task-title h4{font-size:13.5px;font-weight:600}
.task-title p{font-size:10.5px;color:var(--muted);margin-top:2px}
.task-btn{padding:10px 16px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#062}
body.cold .task-btn,body.rest .task-btn,body.bd-celebration .task-btn{color:#fff}
.task-btn:active{transform:scale(.95)}
.task-btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.5)}
.task-btn.full{width:100%}
.task-result{font-size:11.5px;padding:7px 10px;border-radius:8px;margin-top:6px}
.task-result.ok{background:rgba(74,222,128,.1);color:#86efac}
.task-result.bad{background:rgba(248,113,113,.1);color:#fca5a5}
.task-result.wait{background:rgba(251,191,36,.1);color:#fde68a}
.task-result.jj{background:rgba(167,139,250,.12);color:#c4b5fd}
.rec{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.rec:last-child{border-bottom:none}
.rec-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.rec-mid{flex:1;min-width:0}
.rec-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-meta{font-size:10.5px;color:var(--muted);margin-top:1px;display:flex;gap:6px;flex-wrap:wrap}
.rec-amt{font-size:13.5px;font-weight:600;flex-shrink:0}
.rec-amt.bad{color:var(--red)}
.rec-rm{padding:4px 8px;border-radius:7px;border:1px solid rgba(248,113,113,.3);background:rgba(248,113,113,.08);color:#fca5a5;font-size:11px;cursor:pointer;flex-shrink:0}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:grid;grid-template-columns:repeat(7,1fr);background:rgba(13,31,20,.95);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:8px 2px calc(8px + env(safe-area-inset-bottom));z-index:60}
body.cold .tabbar{background:rgba(10,21,32,.95)}
body.rest .tabbar{background:rgba(31,26,46,.95)}
body.bd-celebration .tabbar{background:rgba(42,10,10,.96)}
.tab{background:none;border:none;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 0;cursor:pointer;font-family:inherit}
.tab svg{width:18px;height:18px;stroke-width:1.9}
.tab span{font-size:9px}
.tab.active{color:var(--accent)}
.tab:active{transform:scale(.92)}
.mask{position:fixed;inset:0;background:rgba(4,10,6,.75);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:86vh;overflow-y:auto}
.sheet h3{font-size:16px;margin-bottom:14px;font-weight:700}
.close-row{display:flex;gap:8px;margin-top:14px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:rgba(20,42,28,.97);border:1px solid var(--line);color:var(--txt);padding:10px 18px;border-radius:12px;font-size:12.5px;z-index:200;transition:.28s;pointer-events:none;max-width:86%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.btn{width:100%;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:.18s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-p{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#062}
body.cold .btn-p,body.rest .btn-p,body.bd-celebration .btn-p{color:#fff}
.btn-g{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn-sm{padding:8px 12px;font-size:12px;width:auto}
.btn-purple{background:linear-gradient(135deg,#a78bfa,#8b5cf6);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 12px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:12px;color:var(--muted);cursor:pointer;user-select:none}
.chip:active{transform:scale(.95)}
.chip.on{background:rgba(74,222,128,.16);border-color:rgba(74,222,128,.5);color:var(--accent);font-weight:500}
.chip.emotion.on{background:rgba(167,139,250,.18);border-color:rgba(167,139,250,.5);color:#c4b5fd}
.chip.source.on{background:rgba(96,165,250,.18);border-color:rgba(96,165,250,.5);color:#93c5fd}
.chip.junk{border-color:rgba(248,113,113,.4);color:#fca5a5}
.chip .price{font-size:10px;opacity:.6;margin-left:4px}
.pending-tag{display:inline-block;background:rgba(251,191,36,.15);border:1px solid rgba(251,191,36,.35);color:#fde68a;padding:5px 10px;border-radius:8px;font-size:12px;margin:2px 3px 2px 0}
.pending-tag .rm{color:#fca5a5;margin-left:6px;cursor:pointer;font-weight:700}
label.fl{display:block;font-size:11px;color:var(--muted);margin:12px 0 6px}
input.txt,select.txt,textarea.txt{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--txt);font-size:14px;outline:none;font-family:inherit;resize:vertical}
input.txt:focus,select.txt:focus,textarea.txt:focus{border-color:var(--accent)}
textarea.txt{min-height:60px}
.hint{font-size:10.5px;color:var(--dim);margin-top:6px;line-height:1.5}
.empty{text-align:center;padding:24px 0;color:var(--dim);font-size:12px}
.jj-progress{height:5px;background:rgba(255,255,255,.06);border-radius:3px;margin-top:8px;overflow:hidden}
.jj-bar{height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#a78bfa,#8b5cf6);transition:width .4s}
.rest-hero{text-align:center;padding:48px 22px 40px;background:linear-gradient(150deg,rgba(196,181,253,.12),rgba(167,139,250,.04));border:1px solid rgba(196,181,253,.25);border-radius:24px;margin-bottom:14px}
.rest-icon{font-size:72px;line-height:1;margin-bottom:16px}
.rest-title{font-size:24px;font-weight:800;margin-bottom:10px;color:#c4b5fd}
.rest-sub{font-size:13px;color:var(--muted);line-height:1.8;max-width:320px;margin:0 auto}
.bd-hero{text-align:center;padding:48px 22px 40px;background:linear-gradient(150deg,rgba(255,80,80,.15),rgba(255,140,60,.08));border:1px solid rgba(255,215,0,.3);border-radius:26px;margin-bottom:14px}
.bd-icon{font-size:76px;line-height:1;margin-bottom:18px}
.bd-title{font-size:32px;font-weight:900;letter-spacing:8px;margin-bottom:14px;color:#ffd700}
.bd-sub{font-size:13px;color:#ffd7c0;line-height:2;max-width:300px;margin:0 auto}
.fin-hero{background:linear-gradient(150deg,#1a2137,#141827);border:1px solid #27304a;border-radius:18px;padding:18px;margin-bottom:10px}
.fin-amount{font-size:32px;font-weight:800;letter-spacing:-1px;margin:6px 0 2px;color:#8fb0ff}
.fin-sub{font-size:12px;color:#8791a8}
.diet-hero{background:linear-gradient(150deg,#1f2a1c,#151d12);border:1px solid #2a3d24;border-radius:18px;padding:18px;margin-bottom:10px}
.diet-amount{font-size:32px;font-weight:800;letter-spacing:-1px;margin:6px 0 2px;color:#86efac}
.diet-sub{font-size:12px;color:var(--muted)}
.trend{display:flex;align-items:flex-end;justify-content:space-between;gap:4px;height:80px;margin:10px 0 4px;padding:0 2px}
.trend-bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%}
.trend-bar .bar{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,#5b8cff,#3b6edb);min-height:2px;transition:height .6s}
.trend-bar .bar.junk{background:linear-gradient(180deg,#f0883e,#db6d28)}
.trend-bar .lbl{font-size:9px;color:var(--dim)}
.rec-list{display:flex;flex-direction:column;gap:8px}
.rec-item{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:12.5px}
.rec-item.fail{border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.06)}
.rec-item.success{border-color:rgba(74,222,128,.28)}
.rec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.rec-date{font-size:11px;color:var(--dim)}
.rec-badge{font-size:10.5px;padding:2px 8px;border-radius:6px;font-weight:600}
.rec-badge.ok{background:rgba(74,222,128,.15);color:#86efac}
.rec-badge.bad{background:rgba(248,113,113,.15);color:#fca5a5}
.rec-badge.intensity{background:rgba(251,191,36,.15);color:#fde68a;margin-left:6px}
.rec-target{font-size:13px;font-weight:600;margin-bottom:4px}
.rec-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.rec-tag{font-size:10.5px;padding:2px 7px;border-radius:5px;background:rgba(167,139,250,.15);color:#c4b5fd}
.rec-tag.src{background:rgba(96,165,250,.15);color:#93c5fd}
.rec-note{font-size:11.5px;color:var(--muted);margin-top:5px;font-style:italic}
.slider-wrap{display:flex;align-items:center;gap:10px}
.slider-wrap input[type=range]{flex:1;accent-color:var(--accent)}
.slider-val{min-width:38px;text-align:right;font-weight:700;font-size:15px;color:var(--accent)}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px}
.bar-name{width:60px;color:var(--muted);flex-shrink:0}
.bar-track{flex:1;height:10px;background:rgba(255,255,255,.06);border-radius:5px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#a78bfa,#8b5cf6);border-radius:5px;transition:width .5s}
.bar-fill.blue{background:linear-gradient(90deg,#60a5fa,#3b82f6)}
.bar-cnt{width:30px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:11.5px}
.cross-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed rgba(255,255,255,.06);font-size:12.5px}
.cross-row:last-child{border-bottom:none}
.cross-rate{font-weight:600;font-variant-numeric:tabular-nums}
.reward-card{background:linear-gradient(135deg,#4a2a1a,#2a1a10);border:1.5px solid var(--gold);border-radius:16px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden;animation:cardIn .5s}
@keyframes cardIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.reward-ico{font-size:44px;text-align:center;margin-bottom:8px}
.reward-title{font-size:17px;font-weight:800;color:var(--gold);text-align:center;margin-bottom:6px}
.reward-desc{font-size:12.5px;color:#ffd7c0;text-align:center;line-height:1.6;margin-bottom:10px}
.reward-expire{font-size:11px;text-align:center;color:#fca5a5;margin-bottom:12px;font-weight:600}
.reward-actions{display:flex;gap:8px}
.violation-item{padding:8px 10px;background:rgba(248,113,113,.08);border-radius:8px;margin-bottom:6px;font-size:12.5px;border:1px solid rgba(248,113,113,.2)}
.violation-item.emergency{background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.3)}
.big-cheer{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:9999;font-weight:900;text-align:center;padding:0 20px;white-space:pre-line;line-height:1.3}
.cheer-tier1{font-size:52px;letter-spacing:10px;color:#fbbf24;text-shadow:0 0 40px #fbbf24,0 0 80px #ff8833;animation:cheer1 3s forwards}
@keyframes cheer1{0%{transform:scale(.1) rotate(-30deg);opacity:0;filter:blur(30px)}15%{transform:scale(2) rotate(12deg);opacity:1;filter:blur(0)}30%{transform:scale(1.4) rotate(-8deg);opacity:1}50%{transform:scale(1.8) rotate(5deg);opacity:1}70%{transform:scale(1.5) rotate(-3deg);opacity:1}100%{transform:scale(3) rotate(0);opacity:0;filter:blur(15px)}}
.cheer-tier2{font-size:44px;letter-spacing:8px;color:#4ade80;text-shadow:0 0 30px #4ade80,0 0 60px #22c55e;animation:cheer2 2.8s forwards}

function cloudPush(silent){
  if(!state||!state.enabled){if(!silent)setSyncStatus('warn','系统尚未启用');return Promise.resolve({ok:false});}
  if(!silent)setSyncStatus('warn','正在上传…');

    .then(r=>{if(!r.ok)return r.text().then(t=>{throw new Error(t)});if(!silent){const t=new Date();setSyncStatus('ok','已上传 · '+pad2(t.getHours())+':'+pad2(t.getMinutes()));}return{ok:true};})

function cloudPull(silent){
  if(!silent)setSyncStatus('warn','正在下载…');
  return fetch(SUPABASE_URL+'/rest/v1/user_data?user_id=eq.'+encodeURIComponent(syncUserId),{method:'GET',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}})
    .then(r=>{if(!r.ok)return r.text().then(t=>{throw new Error(t)});return r.json();})
    .then(data=>{
      if(!data||data.length===0){if(state&&state.enabled)cloudPush(true);setSyncStatus('ok','云端暂无数据');return{pulled:false};}
      const row=data[0];const cloudTime=new Date(row.updated_at).getTime();const payload=row.items;
      if(!payload||typeof payload!=='object'||payload.__type!=='garden'||!payload.state){if(state&&state.enabled)cloudPush(true);return{pulled:false};}
      const localEmpty=!state||!state.enabled;
      if(localEmpty||cloudTime>lastLocalChange+1500){
        suppressSync=true;state=payload.state;
        try{migrate();}catch(e){}
        try{localStorage.setItem(LS_STATE,JSON.stringify(state));}catch(e){}
        lastLocalChange=cloudTime;
        try{localStorage.setItem(LAST_CHANGE_KEY,String(lastLocalChange));}catch(e){}
        suppressSync=false;render(false);
        setSyncStatus('ok','已从云端恢复 · '+new Date(cloudTime).toLocaleString('zh-CN'));
        return{pulled:true};
      }
      if(lastLocalChange>cloudTime+1500){cloudPush(true);setSyncStatus('ok','本机较新，已上传');}
      else{setSyncStatus('ok','本机与云端一致');}
      return{pulled:false};
    })
    .catch(e=>{setSyncStatus('err','下载失败：'+(e.message||e));return{pulled:false,error:e};});
}

/* ========== 保存 ========== */
function saveState(silent){
  if(!state)return;
  state.updatedAt=new Date().toISOString();
  try{localStorage.setItem(LS_STATE,JSON.stringify(state));}catch(e){if(!silent)toast('本地存储失败');}
  if(!booted||suppressSync)return;
  if(!state||!state.enabled)return;
  lastLocalChange=Date.now();
  try{localStorage.setItem(LAST_CHANGE_KEY,String(lastLocalChange));}catch(e){}
  scheduleCloudSync();
}
function pushUndo(l){try{undoStack.push({label:l,snap:JSON.stringify(state)})}catch(e){};if(undoStack.length>12)undoStack.shift();updateUndoBtn();}
function doUndo(){const it=undoStack.pop();if(!it){toast('没有可撤销的操作');return;}state=JSON.parse(it.snap);saveState(true);updateUndoBtn();render();toast('已撤销：'+it.label);}
function updateUndoBtn(){const b=$('#undoBtn');if(!b)return;b.classList.toggle('on',undoStack.length>0);b.textContent=undoStack.length?'↶'+undoStack.length:'↶';}
function getRecord(d){if(!state.records[d])state.records[d]={};return state.records[d];}
function getCat(id){return state.cats.find(c=>c.id===id)||{name:'已删除',color:'#64748b',isFood:false,isJunk:false};}
function getTag(id){return state.tags.find(t=>t.id===id);}
function getDayExpenses(d){return state.expenses.filter(e=>e.date===d);}
function getDayFoods(d){return state.expenses.filter(e=>e.date===d&&getCat(e.catId).isFood);}
function isMoneyOk(d){return !getDayExpenses(d).some(e=>getCat(e.catId).isJunk);}
function isDietOk(d){return !getDayFoods(d).some(e=>getCat(e.catId).isJunk);}

/* ========== 意志力/重启核心 ========== */
function checkStreakTimeout(){
  ['resistStreak','restartStreak'].forEach(k=>{
    const s=state[k];if(s.current<=0||!s.lastSuccessDate)return;
    const gap=diffDays(parseD(s.lastSuccessDate),new Date());
    if(gap>GAP_TOLERANCE+1){s.current=0;s.breakReason=`间隔超${GAP_TOLERANCE}天（最后：${s.lastSuccessDate}）`;}
  });
}
function addAction({type,result,intensity,target,emotions,sources,note}){
  const rec={id:nid('a_'),date:todayStr(),time:nowTimeStr(),type,result,intensity:Number(intensity)||0,target:target.trim(),emotions:emotions||[],sources:sources||[],note:(note||'').trim(),ts:Date.now()};
  state.actions.unshift(rec);
  const countsForStreak=rec.intensity>=INTENSITY_MIN;
  const sKey=type==='resist'?'resistStreak':'restartStreak';
  const s=state[sKey];
  if(result==='success'){
    if(countsForStreak){
      if(s.lastSuccessDate){const gap=diffDays(parseD(s.lastSuccessDate),parseD(rec.date));if(gap>GAP_TOLERANCE+1)s.current=0;}
      s.current+=1;s.lastSuccessDate=rec.date;
      if(s.current>s.max)s.max=s.current;
      const tier=tryCreateReward(type,s.current);
      if(tier)rec._tierReached=tier;
    } else {rec._excludedFromStreak=true;}
  } else if(result==='fail'){
    if(s.current>0||s.lastSuccessDate){s.current=0;s.breakReason=`主动记录失败（${rec.date}）`;}
  }
  saveState();
  return rec;
}
function tryCreateReward(type,count){
  const tiers=type==='resist'?TIERS_RESIST:TIERS_RESTART;
  const tier=tiers.find(t=>t.count===count);
  if(!tier)return null;
  const exist=state.rewardCards.find(c=>c.type===tier.type&&c.sourceType===type&&c.status==='pending');
  if(exist)return null;
  const displayDate=fmtDate(addDays(new Date(),1));
  state.rewardCards.push({id:nid('card_'),type:tier.type,tier:tier.count,icon:tier.icon,label:tier.label,desc:tier.desc,status:'pending',createdAt:todayStr(),displayDate,resolvedAt:'',sourceType:type});
  saveState();
  return tier;
}
function getActiveCards(){
  const today=todayStr();const nowM=nowMin();
  let changed=false;
  state.rewardCards.forEach(c=>{
    if(c.status==='pending'&&c.displayDate===today&&nowM>=CUTOFF_MIN){c.status='expired';c.resolvedAt=today+' '+nowTimeStr();changed=true;}
    if(c.status==='pending'&&c.displayDate<today){c.status='expired';c.resolvedAt=today;changed=true;}
  });
  if(changed)saveState();
  return state.rewardCards.filter(c=>c.status==='pending'&&c.displayDate===today&&nowM<CUTOFF_MIN);
}
function resolveCard(cardId,action){
  const c=state.rewardCards.find(x=>x.id===cardId);
  if(!c)return;
  if(action==='use'){
    c.status='used';c.resolvedAt=todayStr()+' '+nowTimeStr();saveState();
    toast('已使用 · 计划内加餐 ✓');
  } else if(action==='decline'){
    c.status='declined';c.resolvedAt=todayStr()+' '+nowTimeStr();
    const s=state.resistStreak;s.current+=1;if(s.current>s.max)s.max=s.current;s.lastSuccessDate=todayStr();
    state.actions.unshift({id:nid('a_'),date:todayStr(),time:nowTimeStr(),type:'resist',result:'success',intensity:10,target:`拒绝${c.label}奖励`,emotions:['坚定'],sources:['奖励诱惑'],note:'主动拒绝奖励卡',ts:Date.now(),_fromRewardDecline:true});
    saveState();
    tryCreateReward('resist',s.current);
    playCheer(s.current,{type:c.type,count:c.tier});
    toast('彩蛋：额外 +1 意志力抵抗成功！');
  }
  render();
}

/* ========== 特效 ========== */
function playCheer(currentCount,tier){
  let cls='cheer-tier2',text='+1',waveCount=2,shake=false;
  if(tier&&tier.type==='praise'&&currentCount===3){cls='cheer-tier1';text='意志力突破！\n连续 3 次 🎉';waveCount=4;shake=true;}
  else if(tier&&tier.type==='quick-carb'){cls='cheer-tier2';text='解锁\n食堂套餐卡 🍚';waveCount=3;}
  else if(tier&&tier.type==='outside'){cls='cheer-tier3';text='解锁\n白名单堂食 🍱';waveCount=3;}
  else if(tier&&tier.type==='bagel'){cls='cheer-tier4';text='解锁\n贝果面包 🥯';waveCount=5;}
  else if(tier&&tier.type==='praise-restart'){cls='cheer-tier1';text='重启成功\n连续 3 次 🎉';waveCount=4;shake=true;}
  const el=document.createElement('div');
  el.className='big-cheer '+cls;el.textContent=text;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),3500);
  if(shake){document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),500);}
  for(let k=0;k<waveCount;k++){setTimeout(()=>spawnFireworks(tier?tier.type:'normal'),k*320);}
}
function spawnFireworks(tierType){
  const colorMap={
    'praise':['#fbbf24','#f59e0b','#fde68a','#fcd34d'],
    'praise-restart':['#a78bfa','#c4b5fd','#fbbf24'],
    'quick-carb':['#4ade80','#22c55e','#86efac'],
    'outside':['#a78bfa','#fbbf24','#c4b5fd','#fde68a'],
    'bagel':['#f87171','#fbbf24','#4ade80','#60a5fa','#a78bfa','#f472b6'],
    'normal':['#4ade80','#fbbf24','#60a5fa']
  };
  const colors=colorMap[tierType]||colorMap.normal;
  const cx=25+Math.random()*50,cy=25+Math.random()*40;
  const color=colors[Math.floor(Math.random()*colors.length)];
  for(let i=0;i<18;i++){
    const ang=(i/18)*Math.PI*2,dist=80+Math.random()*70;
    const p=document.createElement('div');
    p.className='firework';p.style.left=cx+'%';p.style.top=cy+'%';p.style.color=color;
    p.style.setProperty('--fx',(Math.cos(ang)*dist).toFixed(0)+'px');
    p.style.setProperty('--fy',(Math.sin(ang)*dist).toFixed(0)+'px');
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),1900);
  }
}

/* ========== 打卡判断 ========== */
function autoCheckWakeFail(){
  const today=todayStr();const r=state.records[today];
  if(r&&r.wake&&r.wake.checked)return;
  if(nowMin()>=WAKE_FAIL_MIN){
    const rec=getRecord(today);
    if(!rec.wake||!rec.wake.checked){rec.wake={time:'07:05',fitness:false,msg:'超过7:05未打卡',checked:true,autoFail:true};saveState(true);}
  }
}
function isBirthdayDate(dateKey){
  if(!state.settings.birthday)return false;
  const bd=parseD(state.settings.birthday),d=parseD(dateKey);
  return bd.getMonth()===d.getMonth()&&bd.getDate()===d.getDate();
}
function canUseBirthdayCard(checkDate){
  if(!state.settings.birthday)return false;
  if(state.birthdayCard.used)return false;
  if(state.birthdayCard.delayResolved&&state.birthdayCard.delayDate)return checkDate===state.birthdayCard.delayDate;
  const bd=parseD(state.settings.birthday),cd=parseD(checkDate);
  const y1=new Date(cd.getFullYear(),bd.getMonth(),bd.getDate());
  const y2=new Date(cd.getFullYear()-1,bd.getMonth(),bd.getDate());
  const y3=new Date(cd.getFullYear()+1,bd.getMonth(),bd.getDate());
  const diff=Math.min(Math.abs(diffDays(y1,cd)),Math.abs(diffDays(y2,cd)),Math.abs(diffDays(y3,cd)));
  return diff<=BD_TOLERANCE;
}
function getStudyCooldown(t){if(t==='cool1')return 1;if(t==='cool2')return 2;if(t==='cool3')return 3;return 0;}
function getDayCooldown(rec,dateKey){
  let total=0;const bd=[];
  if(rec.study&&rec.study.tier&&rec.study.tier.startsWith('cool')){const d=getStudyCooldown(rec.study.tier);total+=d;bd.push({name:'学习'+rec.study.hours+'h',days:d});}
  if(!isDietOk(dateKey)){total+=2;bd.push({name:'饮食异常',days:2});}
  else if(!isMoneyOk(dateKey)){total+=1;bd.push({name:'用钱异常',days:1});}
  if(rec.jingji&&rec.jingji.checked&&rec.jingji.ok===false){total+=2;bd.push({name:'养精蓄锐破戒',days:2});}
  if(rec.sleep&&rec.sleep.checked&&!rec.sleep.success){total+=1;bd.push({name:'睡觉失败',days:1});}
  return{total,breakdown:bd};
}
function isGreenForCooldown(rec,d,jjR){
  if(!rec)return false;
  return !!(rec.sleep&&rec.sleep.success)&&!!(rec.study&&(rec.study.tier==='normal'||rec.study.tier==='reward'))&&isMoneyOk(d)&&isDietOk(d)&&((rec.jingji&&rec.jingji.checked&&rec.jingji.ok===true)||jjR===true);
}
function isGreenForCycle(rec,d,jjR){
  if(!rec)return false;
  return !!(rec.sleep&&rec.sleep.success)&&!!(rec.wake&&rec.wake.checked)&&!!(rec.study&&(rec.study.tier==='normal'||rec.study.tier==='reward'))&&isMoneyOk(d)&&isDietOk(d)&&((rec.jingji&&rec.jingji.checked&&rec.jingji.ok===true)||jjR===true);
}
function computeSchedule(){
  const result={};const today=todayStr();
  const startDateStr=state.settings.startDate||today;
  let d=parseD(startDateStr);const endDate=addDays(parseD(today),200);
  let cooldownTotal=0,consecutiveGreen=0,wakeFailStreak=0,conservativeStreak=0,cycleDay=0,bigCycleDay=0,pendingRestKey=null,lastBigCycleComplete=0;
  let jjCurrent=0,jjCycleLength=state.settings.jjInitial||10;
  const restReschedule=state.restReschedule||{};
  let guard=0;
  while(d<=endDate&&guard++<1000){
    const key=fmtDate(d);const rec=state.records[key];const isFuture=key>today;
    let dayInfo={key,type:'future',cycleDay:0,isReward:false,isMealDay:false,isBirthday:false,isRest:false,isRestCandidate:false,cooldownRemaining:0,isJJRelease:false,isBigCycleComplete:false,cooldownBreakdown:null};
    if(isBirthdayDate(key))dayInfo.isBirthday=true;
    if(!isFuture&&rec){
      if(rec.jingji&&rec.jingji.checked){
        if(rec.jingji.ok===true){jjCurrent++;if(jjCurrent>=jjCycleLength){dayInfo.isJJRelease=true;jjCurrent=0;jjCycleLength+=(state.settings.jjIncrement||5);}}
        else if(rec.jingji.broken){jjCurrent=0;}
      } else {jjCurrent=0;}
    } else if(isFuture){jjCurrent++;if(jjCurrent>=jjCycleLength){dayInfo.isJJRelease=true;jjCurrent=0;jjCycleLength+=(state.settings.jjIncrement||5);}}
    if(pendingRestKey===key){
      const resolution=state.restResolved[key],delayedTo=restReschedule[key];
      if(resolution==='delay'&&delayedTo){dayInfo.isRestCandidate=true;pendingRestKey=delayedTo;}
      else{dayInfo.isRest=true;dayInfo.isRestConfirmed=resolution==='keep';result[key]=dayInfo;cycleDay=0;bigCycleDay=0;pendingRestKey=null;lastBigCycleComplete=0;d.setDate(d.getDate()+1);continue;}
    }
    let isDelayedRestDay=false;
    for(const orig in restReschedule){if(restReschedule[orig]===key&&orig!==key){isDelayedRestDay=true;break;}}
    if(isDelayedRestDay){dayInfo.isRest=true;dayInfo.isRestConfirmed=true;result[key]=dayInfo;cycleDay=0;bigCycleDay=0;pendingRestKey=null;lastBigCycleComplete=0;d.setDate(d.getDate()+1);continue;}
    if(cooldownTotal>0){
      dayInfo.type=isFuture?'future-cooldown':'cooldown';dayInfo.cooldownRemaining=cooldownTotal;
      if(rec&&!isFuture){
        if(isGreenForCooldown(rec,key,dayInfo.isJJRelease)){cooldownTotal--;consecutiveGreen++;if(consecutiveGreen>=2&&cooldownTotal>=3){cooldownTotal--;consecutiveGreen=0;}}
        else{consecutiveGreen=0;const dayCd=getDayCooldown(rec,key);if(dayCd.total>0){cooldownTotal+=dayCd.total;dayInfo.cooldownBreakdown=dayCd.breakdown;}if(rec.wake&&rec.wake.checked&&!rec.wake.fitness){wakeFailStreak++;if(wakeFailStreak>=2){cooldownTotal+=1;wakeFailStreak=0;}}else{wakeFailStreak=0;}if(rec.study&&rec.study.tier==='conservative'){conservativeStreak++;if(conservativeStreak>=3){cooldownTotal+=1;conservativeStreak=0;}}else{conservativeStreak=0;}}
        if(cooldownTotal<=0){cooldownTotal=0;consecutiveGreen=0;dayInfo.type='green';}
      } else if(isFuture){cooldownTotal--;consecutiveGreen++;if(consecutiveGreen>=2&&cooldownTotal>=3){cooldownTotal--;consecutiveGreen=0;}if(cooldownTotal<=0){cooldownTotal=0;consecutiveGreen=0;}}
    } else {
      if(rec&&!isFuture){
        if(isGreenForCycle(rec,key,dayInfo.isJJRelease)){cycleDay++;bigCycleDay++;dayInfo.type='green';dayInfo.cycleDay=cycleDay;if(cycleDay%8===4)dayInfo.isMealDay=true;if(cycleDay%8===0&&cycleDay>0)dayInfo.isReward=true;}
        else if(rec.birthdayCard||rec.sick||rec.protect){dayInfo.type='partial';}
        else{dayInfo.type='partial';const dayCd=getDayCooldown(rec,key);if(dayCd.total>0){cooldownTotal+=dayCd.total;dayInfo.cooldownBreakdown=dayCd.breakdown;}if(rec.wake&&rec.wake.checked&&!rec.wake.fitness){wakeFailStreak++;if(wakeFailStreak>=2){cooldownTotal+=1;wakeFailStreak=0;}}else{wakeFailStreak=0;}if(rec.study&&rec.study.tier==='conservative'){conservativeStreak++;if(conservativeStreak>=3){cooldownTotal+=1;conservativeStreak=0;}}else{conservativeStreak=0;}}
      } else if(isFuture){cycleDay++;bigCycleDay++;dayInfo.type='future';dayInfo.cycleDay=cycleDay;if(cycleDay%8===4)dayInfo.isMealDay=true;if(cycleDay%8===0&&cycleDay>0)dayInfo.isReward=true;}
    }
    if(cycleDay>0&&cycleDay%32===0&&cycleDay!==lastBigCycleComplete){pendingRestKey=fmtDate(addDays(d,1));lastBigCycleComplete=cycleDay;dayInfo.isBigCycleComplete=true;}
    result[key]=dayInfo;d.setDate(d.getDate()+1);
  }
  return result;
}
function judgeStudy(h,isReward){
  if(isReward){if(h>=7)return{tier:'normal',label:'正常',msg:'奖励日 ≥7h'};if(h>=6)return{tier:'cool1',label:'冷静1天',msg:'奖励日 6-7h'};return{tier:'cool2',label:'冷静2天',msg:'奖励日 <6h'};}
  if(h>=10)return{tier:'reward',label:'奖励加餐',msg:'≥10h'};
  if(h>=9)return{tier:'normal',label:'正常积累',msg:'9-10h'};
  if(h>=8)return{tier:'conservative',label:'保守打卡',msg:'8-9h，不计入'};
  if(h>=7)return{tier:'cool1',label:'冷静1天',msg:'7-8h'};
  if(h>=6)return{tier:'cool2',label:'冷静2天',msg:'6-7h'};
  return{tier:'cool3',label:'冷静3天',msg:'<6h'};
}
function judgeSleep(time,reason){
  if(!time)return{success:false,msg:'未打卡'};
  const t=timeToMin(time),d=timeToMin(state.settings.sleepDeadline);
  if(t<=d)return{success:true,msg:'按时上床 ✓'};
  if(reason==='work')return{success:true,msg:'工作/不可抗力 ✓'};
  return{success:false,msg:'超过截止且非不可抗力'};
}
function judgeWake(time){
  if(!time)return{fitness:false,msg:'未打卡'};
  const t=timeToMin(time),d=timeToMin(state.settings.wakeDeadline);
  if(t<=d)return{fitness:true,msg:'起床达标 ✓'};
  return{fitness:false,msg:'超时，健身变灰'};
}

/* ========== 热力图数据生成 ========== */
// 总体完成度热力图：返回最近 30 天每日完成度（0-6 项）
function buildOverallHeatmap(){
  const sch=computeSchedule();
  const today=todayStr();
  const arr=[];
  for(let i=29;i>=0;i--){
    const d=addDays(new Date(),-i);const k=fmtDate(d);
    const rec=state.records[k]||{};
    const info=sch[k]||{};
    let score=0;
    if(rec.sleep&&rec.sleep.success)score++;
    if(rec.wake&&rec.wake.fitness)score++;
    if(rec.study&&(rec.study.tier==='normal'||rec.study.tier==='reward'))score++;
    if(getDayExpenses(k).length>0&&isMoneyOk(k))score++;
    if(getDayExpenses(k).length>0&&isDietOk(k))score++;
    if((rec.jingji&&rec.jingji.checked&&rec.jingji.ok===true)||info.isJJRelease)score++;
    arr.push({date:k,day:+k.slice(8),score,total:6,info,isToday:k===today});
  }
  return arr;
}
// 学习热力图：每天学习小时数
function buildStudyHeatmap(){
  const today=todayStr();
  const arr=[];
  for(let i=29;i>=0;i--){
    const d=addDays(new Date(),-i);const k=fmtDate(d);
    const rec=state.records[k]||{};
    const hours=rec.study&&rec.study.hours?rec.study.hours:0;
    arr.push({date:k,day:+k.slice(8),hours,isToday:k===today});
  }

}
// 资金热力图：每天花费
function buildMoneyHeatmap(){
  const today=todayStr();
  const arr=[];
  for(let i=29;i>=0;i--){
    const d=addDays(new Date(),-i);const k=fmtDate(d);
    const spent=state.expenses.filter(e=>e.date===k).reduce((a,b)=>a+(b.price||0),0);
    const junk=state.expenses.filter(e=>e.date===k&&getCat(e.catId).isJunk).reduce((a,b)=>a+(b.price||0),0);
    arr.push({date:k,day:+k.slice(8),spent,junk,isToday:k===today});
  }
  return arr;
}
// 完成度颜色（总体热力图）
function overallColor(score,total){
  if(score===0)return{color:'rgba(255,255,255,.04)',alpha:1};
  const ratio=score/total;
  if(ratio>=1)return{color:'#16a34a',alpha:1};      // 全绿
  if(ratio>=0.83)return{color:'#22c55e',alpha:0.85}; // 5/6
  if(ratio>=0.66)return{color:'#4ade80',alpha:0.7};  // 4/6
  if(ratio>=0.5)return{color:'#fbbf24',alpha:0.65};  // 3/6
  if(ratio>=0.33)return{color:'#fb923c',alpha:0.6};  // 2/6
  return{color:'#f87171',alpha:0.55};                 // 1/6
}
// 学习热力图颜色（深绿=时长高）
function studyColor(hours){
  if(hours<=0)return{color:'rgba(255,255,255,.04)',alpha:1};
  if(hours>=10)return{color:'#14532d',alpha:1};
  if(hours>=9)return{color:'#166534',alpha:1};
  if(hours>=8)return{color:'#15803d',alpha:1};
  if(hours>=6)return{color:'#16a34a',alpha:0.85};
  if(hours>=4)return{color:'#22c55e',alpha:0.7};
  if(hours>=2)return{color:'#4ade80',alpha:0.6};
  return{color:'#86efac',alpha:0.5};
}
// 资金热力图颜色（蓝，深=花费高）
function moneyColor(spent){
  if(spent<=0)return{color:'rgba(255,255,255,.04)',alpha:1};
  if(spent>=100)return{color:'#1e3a8a',alpha:1};
  if(spent>=80)return{color:'#1e40af',alpha:1};
  if(spent>=60)return{color:'#1d4ed8',alpha:0.9};
  if(spent>=40)return{color:'#3b82f6',alpha:0.8};
  if(spent>=20)return{color:'#60a5fa',alpha:0.7};
  if(spent>=10)return{color:'#93c5fd',alpha:0.6};
  return{color:'#bfdbfe',alpha:0.5};
}

  const notActivated = !state.enabled || !state.settings.startDate;
  if(notActivated){
    document.body.classList.remove('cold','rest','bd-celebration');

  }

  updateUndoBtn();
  const v=$('#view');if(!v)return;
  try{
    if(activeTab==='home')v.innerHTML=viewHome();

/* ========== 情绪仪表盘 ========== */
function viewEmotion(){
  const all=state.actions.filter(a=>a.emotions&&a.emotions.length);
  const r=state.resistStreak,rs=state.restartStreak;
  const totalResist=state.actions.filter(a=>a.type==='resist').length;
  const totalRestart=state.actions.filter(a=>a.type==='restart').length;
  const resistSuccess=state.actions.filter(a=>a.type==='resist'&&a.result==='success').length;
  const resistFail=state.actions.filter(a=>a.type==='resist'&&a.result==='fail').length;
  const restartSuccess=state.actions.filter(a=>a.type==='restart'&&a.result==='success').length;
  const restartFail=state.actions.filter(a=>a.type==='restart'&&a.result==='fail').length;
  const resistRate=totalResist?Math.round(resistSuccess/totalResist*100):0;
  const restartRate=totalRestart?Math.round(restartSuccess/totalRestart*100):0;
  const emoCnt={};all.forEach(a=>a.emotions.forEach(e=>emoCnt[e]=(emoCnt[e]||0)+1));
  const emoList=Object.entries(emoCnt).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const maxEmo=Math.max(...emoList.map(x=>x[1]),1);
  const srcCnt={};all.forEach(a=>a.sources.forEach(s=>srcCnt[s]=(srcCnt[s]||0)+1));
  const srcList=Object.entries(srcCnt).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const maxSrc=Math.max(...srcList.map(x=>x[1]),1);
  const cross={};all.forEach(a=>a.emotions.forEach(e=>{if(!cross[e])cross[e]={ok:0,total:0};cross[e].total++;if(a.result==='success')cross[e].ok++;}));
  const crossList=Object.entries(cross).filter(([_,v])=>v.total>=2).map(([k,v])=>({name:k,rate:Math.round(v.ok/v.total*100),total:v.total})).sort((a,b)=>b.total-a.total).slice(0,6);
  const day7=[];
  for(let i=6;i>=0;i--){
    const d=addDays(new Date(),-i);const k=fmtDate(d);
    const dayActs=state.actions.filter(a=>a.date===k&&a.emotions&&a.emotions.length);
    const dayEmos={};
    dayActs.forEach(a=>a.emotions.forEach(e=>dayEmos[e]=(dayEmos[e]||0)+1));
    const top=Object.entries(dayEmos).sort((a,b)=>b[1]-a[1])[0];
    day7.push({date:k,day:['日','一','二','三','四','五','六'][d.getDay()],topEmo:top?top[0]:null,count:dayActs.length});
  }
  const weekEmos={};
  day7.forEach(d=>{if(d.topEmo)weekEmos[d.topEmo]=(weekEmos[d.topEmo]||0)+1;});
  const weekTop=Object.entries(weekEmos).sort((a,b)=>b[1]-a[1])[0];
  const weekTopEmo=weekTop?weekTop[0]:'—';
  const weekTopCount=weekTop?weekTop[1]:0;
  const weekSrc={};
  day7.forEach(d=>{state.actions.filter(a=>a.date===d.date).forEach(a=>a.sources.forEach(s=>weekSrc[s]=(weekSrc[s]||0)+1));});
  const weekTopSrc=Object.entries(weekSrc).sort((a,b)=>b[1]-a[1])[0];
  const heat=[];
  for(let i=29;i>=0;i--){
    const d=addDays(new Date(),-i);const k=fmtDate(d);
    const dayActs=state.actions.filter(a=>a.date===k&&a.emotions&&a.emotions.length);
    const dayEmos={};
    dayActs.forEach(a=>a.emotions.forEach(e=>dayEmos[e]=(dayEmos[e]||0)+1));
    const top=Object.entries(dayEmos).sort((a,b)=>b[1]-a[1])[0];
    heat.push({date:k,day:+k.slice(8),emo:top?top[0]:null,count:dayActs.length,isToday:k===todayStr()});
  }
  let tip='';
  if(crossList.length){
    const worst=crossList.reduce((a,b)=>a.rate<b.rate?a:b);
    if(worst.rate<50){
      tip=`<div class="weather-tip">💡 当你在「${worst.name}」状态下，成功率只有 <b style="color:#fde68a">${worst.rate}%</b>。<br>下次出现这种情绪时，可以试试先深呼吸 5 分钟，或者先记录再决定。</div>`;
    } else {
      tip=`<div class="weather-tip">💡 目前各个状态下你都表现得很稳，继续保持！</div>`;
    }
  }
  return `
  <div class="dash-hero">
    <div class="dash-hero-t"><h3>💪 意志力总览</h3><span>${state.actions.length} 条记录</span></div>
    <div class="dash-grid">
      <div class="dash-cell resist"><div class="lbl">💪 抵抗连续</div><div class="val">${r.current}</div><div class="sub2">历史最长 ${r.max} · 成功率 ${resistRate}%</div></div>
      <div class="dash-cell restart"><div class="lbl">🔄 重启连续</div><div class="val">${rs.current}</div><div class="sub2">历史最长 ${rs.max} · 成功率 ${restartRate}%</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;">
      <div style="background:rgba(0,0,0,.18);border-radius:10px;padding:8px 10px;font-size:11.5px;">
        <div style="color:var(--muted);font-size:10.5px;">抵抗</div>
        <div style="margin-top:3px;"><span style="color:#86efac;font-weight:600;">${resistSuccess} 成功</span> · <span style="color:#fca5a5;font-weight:600;">${resistFail} 失败</span></div>
      </div>
      <div style="background:rgba(0,0,0,.18);border-radius:10px;padding:8px 10px;font-size:11.5px;">
        <div style="color:var(--muted);font-size:10.5px;">重启</div>
        <div style="margin-top:3px;"><span style="color:#86efac;font-weight:600;">${restartSuccess} 成功</span> · <span style="color:#fca5a5;font-weight:600;">${restartFail} 失败</span></div>
      </div>
    </div>
  </div>
  <div class="weather-card">
    <div class="weather-title">🌤 本周情绪天气</div>
    <div class="weather-main">主导情绪：<b>${esc(weekTopEmo)}</b>（出现 ${weekTopCount} 天）${weekTopSrc?`<br>最常触发情境：<b>${esc(weekTopSrc[0])}</b>`:''}</div>
    ${tip}
  </div>
  <div class="card">
    <div class="card-t"><h3>📅 最近 30 天情绪热力图</h3><span class="sub">颜色 = 当天主导情绪</span></div>
    <div class="heatmap">
      ${heat.map(h=>{const c=h.emo?(EMO_COLORS[h.emo]||'#64748b'):'rgba(255,255,255,.04)';const alpha=h.emo?0.55+Math.min(h.count*0.15,0.45):1;return `<div class="heat-cell ${h.emo?'has':''} ${h.isToday?'today':''}" style="background:${c};opacity:${alpha}" title="${h.date}${h.emo?' · '+h.emo:''}">${h.day}</div>`;}).join('')}
    </div>
    <div class="heat-legend">
      ${[...new Set(heat.filter(h=>h.emo).map(h=>h.emo))].slice(0,6).map(e=>`<span><i style="background:${EMO_COLORS[e]||'#64748b'}"></i>${esc(e)}</span>`).join('')}
    </div>
  </div>
  <div class="card">
    <div class="card-t"><h3>💭 情绪分布</h3><span class="sub">${all.length} 条</span></div>
    ${emoList.length?emoList.map(([name,cnt])=>`<div class="bar-row"><span class="bar-name">${esc(name)}</span><div class="bar-track"><div class="bar-fill" style="width:${cnt/maxEmo*100}%;background:linear-gradient(90deg,${EMO_COLORS[name]||'#a78bfa'},${EMO_COLORS[name]||'#8b5cf6'})"></div></div><span class="bar-cnt">${cnt}</span></div>`).join(''):'<div class="empty">还没有情绪记录</div>'}
  </div>
  <div class="card">
    <div class="card-t"><h3>🎯 源头分布</h3><span class="sub">最容易触发</span></div>
    ${srcList.length?srcList.map(([name,cnt])=>`<div class="bar-row"><span class="bar-name">${esc(name)}</span><div class="bar-track"><div class="bar-fill blue" style="width:${cnt/maxSrc*100}%"></div></div><span class="bar-cnt">${cnt}</span></div>`).join(''):'<div class="empty">还没有源头记录</div>'}
  </div>

  const startDate=fmtDate(addDays(parseD(today),-range+1));
  const recentFoods=state.expenses.filter(e=>e.date>=startDate&&e.date<=today&&getCat(e.catId).isFood);
  const byCat={};
  recentFoods.forEach(e=>{const cid=e.catId||'unknown';if(!byCat[cid])byCat[cid]={count:0,amount:0,junk:0};byCat[cid].count++;byCat[cid].amount+=(e.price||0);if(getCat(e.catId).isJunk)byCat[cid].junk++;});
  const catRows=Object.entries(byCat).map(([id,v])=>{const c=getCat(id);return {name:c.name,color:c.color,count:v.count,amount:v.amount,junk:v.junk};}).sort((a,b)=>b.count-a.count);
  const days7=[];

  <div class="diet-hero">
    <div style="display:flex;justify-content:space-between;align-items:center;"><span style="font-size:12px;color:var(--muted);">今日食物</span><span style="font-size:10px;padding:3px 9px;border-radius:20px;background:rgba(74,222,128,.15);color:#86efac;">${todayFoods.length} 项</span></div>

  </div>
  <div class="card">
    <div class="card-t"><h3>📅 最近 7 天日报</h3></div>
    <table class="data-table"><thead><tr><th>日期</th><th class="num">食物</th><th class="num">垃圾</th><th class="num">花费</th><th class="num">违规</th></tr></thead><tbody>
      ${days7.map(d=>`<tr><td>${d.label} 周${d.day}</td><td class="num">${d.count}</td><td class="num ${d.junkCount>0?'bad':''}">${d.junkCount}</td><td class="num">¥${d.spent.toFixed(0)}</td><td class="num ${d.hasViolation?'bad':'ok'}">${d.hasViolation?'是':'—'}</td></tr>`).join('')}
    </tbody></table>
  </div>
  <div class="card">
    <div class="card-t"><h3>📊 近 30 天分类汇总</h3><span class="sub">${recentFoods.length} 项</span></div>
    ${catRows.length?`<table class="data-table"><thead><tr><th>分类</th><th class="num">次数</th><th class="num">金额</th><th class="num">垃圾</th></tr></thead><tbody>${catRows.map(c=>`<tr><td><span class="color-dot" style="background:${c.color}"></span>${esc(c.name)}</td><td class="num">${c.count}</td><td class="num">¥${c.amount.toFixed(0)}</td><td class="num ${c.junk>0?'bad':''}">${c.junk>0?c.junk:'—'}</td></tr>`).join('')}</tbody></table>`:'<div class="hint">近30天没有食物记录</div>'}
  </div>
  <div class="card">
    <div class="card-t"><h3>📈 最近 7 天趋势</h3></div>
    <div class="trend">${days7.map(d=>`<div class="trend-bar"><div class="bar food ${d.junkCount>0?'junk':''}" style="height:${(d.count/maxCount)*70}%;"></div><div class="lbl">${d.label}</div></div>`).join('')}</div>
  </div>
  <div class="card">
    <div class="card-t"><h3>🍽 今日吃了什么</h3><span class="sub">来自记录页</span></div>
    ${todayFoods.length?todayFoods.map(e=>{const cat=getCat(e.catId);return `<div class="rec"><span class="rec-dot" style="background:${cat.color}"></span><div class="rec-mid"><div class="rec-name">${esc(e.name)}</div><div class="rec-meta"><span>${esc(cat.name)}</span>${cat.isJunk?'<span style="color:#fca5a5">· 垃圾</span>':''}</div></div><span class="rec-amt ${cat.isJunk?'bad':''}">¥${(e.price||0).toFixed(2)}</span></div>`;}).join(''):'<div class="hint">今天还没有食物记录</div>'}
  </div>
  ${state.violations.length?`<div class="card"><div class="card-t"><h3>⚠️ 19:00 后违规</h3><span class="sub">${state.violations.length} 条</span></div>${state.violations.map(v=>`<div class="violation-item ${v.isEmergency?'emergency':''}"><b>${v.date} ${v.time}</b> · ${esc(v.itemName)} ${v.isEmergency?'<span style="color:#fde68a;">（紧急例外）</span>':'<span style="color:#fca5a5;">（违规）</span>'}${v.note?`<div style="color:var(--muted);margin-top:3px;font-size:11.5px;">${esc(v.note)}</div>`:''}</div>`).join('')}</div>`:''}

/* ========== Toast / Sheet ========== */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),2400);}
function openSheet(html,mount){const l=$('#layer');l.innerHTML=`<div class="mask" id="mask"><div class="sheet">${html}</div></div>`;const mk=$('#mask');mk.addEventListener('click',e=>{if(e.target===mk)closeSheet();});if(mount)mount($('.sheet'));}
function closeSheet(){$('#layer').innerHTML='';}

/* ========== 记录弹窗 ========== */
function showActionDialog(type){
  const selEmo=new Set(),selSrc=new Set();
  let result='success';
  openSheet(`
    <h3>${type==='resist'?'💪 意志力抵抗':'🔄 重新启动'}</h3>
    <label class="fl">结果</label>
    <div class="chips" id="resChips">
      <div class="chip on" data-val="success">${type==='resist'?'抵抗成功':'重启成功'}</div>
      <div class="chip" data-val="fail">${type==='resist'?'抵抗失败':'重启失败'}</div>
    </div>
    <label class="fl">冲动强度 <span style="color:var(--dim);font-weight:400;">（≥7 才计入连续）</span></label>
    <div class="slider-wrap"><input type="range" id="intRange" min="1" max="10" value="7" step="1"><div class="slider-val" id="intVal">7</div></div>
    <label class="fl">冲动对象 / 想做什么 <span style="color:#fca5a5;">*必填</span></label>
    <input class="txt" id="targetInput" placeholder="${type==='resist'?'例如：想吃甜食、想刷手机':'例如：想放弃学习、想躺平'}">
    <label class="fl">当时的情绪 <span style="color:#fca5a5;">*至少选一个</span></label>
    <div class="chips" id="emoChips">${EMOTIONS.map(e=>`<div class="chip emotion" data-val="${esc(e)}">${esc(e)}</div>`).join('')}</div>
    <label class="fl">情绪源头（多选）</label>
    <div class="chips" id="srcChips">${SOURCES.map(s=>`<div class="chip source" data-val="${esc(s)}">${esc(s)}</div>`).join('')}</div>
    <label class="fl">备注（可选）</label>
    <textarea class="txt" id="noteInput" placeholder="写点什么..."></textarea>
    <div class="close-row" style="margin-top:16px;">
      <button class="btn btn-g" id="cancelBtn">取消</button>
      <button class="btn ${type==='resist'?'btn-p':'btn-purple'}" id="saveBtn">保存</button>
    </div>
  `,sheet=>{
    sheet.querySelectorAll('#resChips .chip').forEach(ch=>{
      ch.onclick=()=>{sheet.querySelectorAll('#resChips .chip').forEach(c=>c.classList.remove('on'));ch.classList.add('on');result=ch.dataset.val;};
    });
    const range=sheet.querySelector('#intRange');
    const rangeVal=sheet.querySelector('#intVal');
    range.oninput=()=>rangeVal.textContent=range.value;
    sheet.querySelectorAll('#emoChips .chip').forEach(ch=>{
      ch.onclick=()=>{const v=ch.dataset.val;if(selEmo.has(v)){selEmo.delete(v);ch.classList.remove('on');}else{selEmo.add(v);ch.classList.add('on');}};
    });
    sheet.querySelectorAll('#srcChips .chip').forEach(ch=>{
      ch.onclick=()=>{const v=ch.dataset.val;if(selSrc.has(v)){selSrc.delete(v);ch.classList.remove('on');}else{selSrc.add(v);ch.classList.add('on');}};
    });
    sheet.querySelector('#cancelBtn').onclick=closeSheet;
    sheet.querySelector('#saveBtn').onclick=()=>{
      const target=sheet.querySelector('#targetInput').value.trim();
      const note=sheet.querySelector('#noteInput').value.trim();
      const intensity=parseInt(range.value,10);
      if(!target){toast('请填写冲动对象');return;}
      if(!selEmo.size){toast('请至少选一个情绪');return;}
      const sKey=type==='resist'?'resistStreak':'restartStreak';
      const rec=addAction({type,result,intensity,target,emotions:[...selEmo],sources:[...selSrc],note});
      closeSheet();
      render();
      if(rec._tierReached){
        playCheer(state[sKey].current,rec._tierReached);
        setTimeout(()=>{toast(`🎁 已发放「${rec._tierReached.label}」到明天的卡包`);},1200);
      } else if(result==='success'&&intensity>=INTENSITY_MIN){
        playCheer(state[sKey].current,null);
      } else if(result==='fail'){
        playCheer(0,null);
        setTimeout(()=>toast('记录下来 · 从中学习'),800);
      } else {
        toast('已记录（强度不足，未计入连续）');
      }
    };
  });
}

/* ========== 全局点击 ========== */
document.addEventListener('click',e=>{
  const tab=e.target.closest('.tab');
  if(tab){activeTab=tab.dataset.tab;scrollPos=0;render(false);window.scrollTo(0,0);return;}
  if(e.target.closest('#undoBtn')){doUndo();return;}
  const el=e.target.closest('[data-act],[data-checkin],[data-add-tag],[data-jj-set],[data-rm-expense],[data-rm-pending]');
  if(!el)return;
  const act=el.dataset.act;

  if(el.dataset.rmPending!==undefined){e.stopPropagation();const r=getRecord(todayStr());if(r._moneyPending)r._moneyPending=r._moneyPending.filter(p=>p.id!==el.dataset.rmPending);saveState();render();return;}
  if(el.dataset.rmExpense!==undefined){e.stopPropagation();if(confirm('删除这条记录？')){pushUndo('删除支出');state.expenses=state.expenses.filter(x=>x.id!==el.dataset.rmExpense);saveState();render();toast('已删除');}return;}

  if(el.dataset.checkin!==undefined){doCheckin(el.dataset.checkin);return;}
  if(el.dataset.jjSet!==undefined){const r=getRecord(todayStr());r._jjPending=el.dataset.jjSet;saveState();render();return;}

  if(el.dataset.addTag!==undefined){
    const tag=getTag(el.dataset.addTag);if(!tag)return;
    const cat=getCat(tag.catId);
    if(cat.isFood&&nowMin()>=CUTOFF_MIN){
      showViolationDialog(tag.name,cat.isJunk,cat.catId,tag.id,tag.price);
      return;
    }
    const r=getRecord(todayStr());
    if(!r._moneyPending)r._moneyPending=[];
    r._moneyPending.push({id:nid('p'),tagId:tag.id,name:tag.name,price:tag.price,catId:tag.catId});
    saveState();render();
    toast(`已添加：${tag.name} ¥${tag.price}${cat.isJunk?' ⚠':''}`);
    return;
  }

  if(!act)return;
  if(act==='goRecord'){activeTab='record';scrollPos=0;render(false);window.scrollTo(0,0);return;}
  if(act==='willTab'){willTab=el.dataset.v;render(false);return;}
  if(act==='addAction'){showActionDialog(el.dataset.t);return;}
  if(act==='useCard'){if(!confirm('确认使用这张奖励卡？'))return;resolveCard(el.dataset.id,'use');return;}

/* ========== 打卡 ========== */
function doCheckin(project){
  const today=todayStr();const rec=getRecord(today);
  const sch=computeSchedule();const info=sch[today]||{};
  const isReward=info.isReward;
  if(info.isRest){toast('休息日无需打卡');return;}
  if(rec.birthdayCard){toast('生日豁免日');return;}
  pushUndo('打卡：'+project);
  if(project==='sleep'){
    if(!inSleepWindow()){toast('不在打卡窗口（23:00-次日5:00）');return;}
    const t=nowTimeStr();const j=judgeSleep(t,rec.sleepReason);
    rec.sleep={time:t,success:j.success,msg:j.msg,checked:true};
    saveState();render();
    toast(j.success?'睡觉打卡成功 ✓ '+t:'睡觉未达标');
    return;
  }
  if(project==='wake'){
    if(!inWakeWindow()){toast('不在打卡窗口（4:00-7:00）');return;}
    const t=nowTimeStr();const j=judgeWake(t);
    rec.wake={time:t,fitness:j.fitness,msg:j.msg,checked:true};
    saveState();render();
    toast(j.fitness?'起床打卡成功 ✓ '+t:'起床未达标');
    return;
  }
  if(project==='study'){
    const h=parseFloat($('#in_study')?.value);
    if(!h||h<=0){toast('请输入学习小时数');return;}
    const j=judgeStudy(h,isReward);
    rec.study={hours:h,tier:j.tier,label:j.label,msg:j.msg,checked:true};
    saveState();render();
    if(j.tier.startsWith('cool'))toast('学习未达标 · '+j.msg);
    else toast('学习打卡成功 ✓');
    return;
  }
  if(project==='jingji'){
    if(!rec._jjPending){toast('请先选择状态');return;}
    const ok=rec._jjPending==='ok';
    rec.jingji={ok,broken:!ok,msg:ok?'坚持住了 ✓':'破戒，周期重新计数',checked:true};
    delete rec._jjPending;
    if(ok){state.jj.current++;if(state.jj.current>=state.jj.cycleLength){state.jj.completed++;state.jj.lastReleaseDate=today;state.jj.cycleLength+=state.settings.jjIncrement;state.jj.current=0;}}
    else{state.jj.current=0;}
    saveState();render();
    toast(ok?'养精蓄锐 ✓':'破戒，周期重置');
    return;
  }
}

/* ========== 总结报告生成器 ========== */
function downloadReport(type){
  // type: 'small' | 'big'
  const isSmall = type === 'small';
  const days = isSmall ? 7 : 31;
  const today = todayStr();
  const endDate = today;
  const startDate = fmtDate(addDays(parseD(today), -(days - 1)));

  // 收集数据
  const sch = computeSchedule();
  const dayList = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = addDays(parseD(today), -i);
    const k = fmtDate(d);
    const rec = state.records[k] || {};
    const info = sch[k] || {};
    const dayExp = state.expenses.filter(e => e.date === k);
    const dayFoods = dayExp.filter(e => getCat(e.catId).isFood);
    const dayJunk = dayFoods.filter(e => getCat(e.catId).isJunk);
    const dayViolations = state.violations.filter(v => v.date === k);
    let score = 0;
    if (rec.sleep && rec.sleep.success) score++;
    if (rec.wake && rec.wake.fitness) score++;
    if (rec.study && (rec.study.tier === 'normal' || rec.study.tier === 'reward')) score++;
    if (dayExp.length > 0 && isMoneyOk(k)) score++;
    if (dayExp.length > 0 && isDietOk(k)) score++;
    if ((rec.jingji && rec.jingji.checked && rec.jingji.ok === true) || info.isJJRelease) score++;
    dayList.push({
      date: k, day: +k.slice(8), score, total: 6,
      sleep: rec.sleep || null,
      wake: rec.wake || null,
      study: rec.study || null,
      jingji: rec.jingji || null,
      info,
      spent: dayExp.reduce((a, b) => a + (b.price || 0), 0),
      foodCount: dayFoods.length,
      junkCount: dayJunk.length,
      violations: dayViolations,
      expenseCount: dayExp.length
    });
  }

  // 意志力统计（仅该时段）
  const actionsInRange = state.actions.filter(a => a.date >= startDate && a.date <= endDate);
  const resistActions = actionsInRange.filter(a => a.type === 'resist');
  const restartActions = actionsInRange.filter(a => a.type === 'restart');
  const resistOK = resistActions.filter(a => a.result === 'success').length;
  const resistFail = resistActions.filter(a => a.result === 'fail').length;
  const restartOK = restartActions.filter(a => a.result === 'success').length;
  const restartFail = restartActions.filter(a => a.result === 'fail').length;
  const resistRate = resistActions.length ? Math.round(resistOK / resistActions.length * 100) : 0;
  const restartRate = restartActions.length ? Math.round(restartOK / restartActions.length * 100) : 0;

  // 情绪统计
  const emoCnt = {};
  const srcCnt = {};
  actionsInRange.forEach(a => {
    (a.emotions || []).forEach(e => emoCnt[e] = (emoCnt[e] || 0) + 1);
    (a.sources || []).forEach(s => srcCnt[s] = (srcCnt[s] || 0) + 1);
  });
  const emoList = Object.entries(emoCnt).sort((a, b) => b[1] - a[1]);
  const srcList = Object.entries(srcCnt).sort((a, b) => b[1] - a[1]);
  const maxEmo = Math.max(...emoList.map(x => x[1]), 1);
  const maxSrc = Math.max(...srcList.map(x => x[1]), 1);

  // 资金统计
  const totalSpent = dayList.reduce((a, b) => a + b.spent, 0);
  const totalFood = dayList.reduce((a, b) => a + b.foodCount, 0);
  const totalJunk = dayList.reduce((a, b) => a + b.junkCount, 0);
  const totalViolations = dayList.reduce((a, b) => a + b.violations.length, 0);
  const greenDays = dayList.filter(d => d.score >= 5).length;
  const perfectDays = dayList.filter(d => d.score === 6).length;

  // 生成 HTML
  const title = isSmall ? '小周期报告' : '大周期报告';
  const html = `<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>自律花园 · ${title}</title>

/* ========== 迁移 ========== */
function migrate(){
  const def=defaultState();
  if(!state.settings)state.settings=def.settings;
  Object.keys(def.settings).forEach(k=>{if(state.settings[k]===undefined)state.settings[k]=def.settings[k];});
  if(state.enabled===undefined)state.enabled=false;
  if(state.activated===undefined)state.activated=!!state.settings.startDate;
  if(!state.records)state.records={};
  if(!state.cats)state.cats=def.cats;
  if(!state.tags)state.tags=def.tags;
  if(!state.expenses)state.expenses=[];
  if(state.budget===undefined)state.budget=def.budget;
  if(!state.cards)state.cards=def.cards;
  if(!state.stats)state.stats=def.stats;
  if(!state.trees)state.trees=[];
  if(!state.birthdayCard)state.birthdayCard=def.birthdayCard;

  const startTs=state.settings.startTimestamp;

    const diff=startTs-Date.now();
    if(diff<=0){
      clearInterval(quoteTimer);clearInterval(tickTimer);
      triggerUnlockAnimation();
      return;
    }
    const totalSec=Math.floor(diff/1000);
    const d=Math.floor(totalSec/86400);
    const h=Math.floor((totalSec%86400)/3600);
    const m=Math.floor((totalSec%3600)/60);
    const s=totalSec%60;
    const setTxt=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=pad2(v);};

function spawnCrackFireworks(){
  const colors=['#4ade80','#fbbf24','#60a5fa','#a78bfa','#f472b6'];
  for(let i=0;i<60;i++){
    const ang=(i/60)*Math.PI*2;
    const dist=100+Math.random()*220;
    const p=document.createElement('div');
    p.className='firework';
    p.style.left='50%';p.style.top='50%';
    p.style.color=colors[i%5];
    p.style.setProperty('--fx',(Math.cos(ang)*dist).toFixed(0)+'px');
    p.style.setProperty('--fy',(Math.sin(ang)*dist).toFixed(0)+'px');
    p.style.width='8px';p.style.height='8px';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),2200);
  }
}

function playUnlockSequence(){
  const welcome=document.createElement('div');
  welcome.className='unlock-welcome';
  welcome.innerHTML=`<div class="uw-main">🌱 系统已开启</div><div class="uw-sub">愿你从此，与更好的自己相遇</div>`;

  const tabs=document.querySelectorAll('.tab');
  tabs.forEach((tab,i)=>{
    tab.style.opacity=0;tab.style.transform='translateY(20px) scale(0.8)';
    setTimeout(()=>{
      tab.style.transition='all .5s cubic-bezier(.34,1.56,.64,1)';

      const rect=tab.getBoundingClientRect();
      smallFirework(rect.left+rect.width/2, rect.top+rect.height/2);

  if(view){view.style.opacity=0;view.style.transition='opacity .8s';setTimeout(()=>{view.style.opacity=1;},1800);}
  setTimeout(()=>{welcome.classList.remove('show');setTimeout(()=>welcome.remove(),600);},3000);
  state.settings.unlockAnimationPlayed=true;
  saveState();
  setTimeout(()=>cloudPush(true),100);
}

function smallFirework(x,y){
  for(let i=0;i<10;i++){
    const ang=(i/10)*Math.PI*2;
    const dist=20+Math.random()*30;
    const p=document.createElement('div');
    p.className='firework';
    p.style.left=x+'px';p.style.top=y+'px';
    p.style.color='#4ade80';
    p.style.setProperty('--fx',(Math.cos(ang)*dist).toFixed(0)+'px');
    p.style.setProperty('--fy',(Math.sin(ang)*dist).toFixed(0)+'px');
    p.style.width='5px';p.style.height='5px';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),1400);
  }
}

function viewCalendar(){
  if(!calCursor){const d=parseD(todayStr());calCursor={y:d.getFullYear(),m:d.getMonth()}}
  const{y,m}=calCursor;
  const first=new Date(y,m,1);const startDay=first.getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const today=todayStr();const sch=computeSchedule();
  let html='';
  for(let i=0;i<startDay;i++)html+='<div class="cal-day empty"></div>';
  for(let day=1;day<=daysInMonth;day++){
    const key=`${y}-${pad2(m+1)}-${pad2(day)}`;
    const info=sch[key]||{};const rec=state.records[key];
    const isFuture=key>today;
    const cls=['cal-day'];
    if(key===today)cls.push('today');
    if(isFuture)cls.push('future');
    if(info.isBirthday)cls.push('birthday');
    if(info.isRest)cls.push('rest');
    if(info.isRestCandidate)cls.push('rest-candidate');
    if(info.type==='cooldown'||info.type==='future-cooldown')cls.push('cool');
    else if(info.isReward)cls.push('reward');
    else if(info.isMealDay)cls.push('meal');
    else if(info.type==='green')cls.push('green');
    else if(info.type==='partial')cls.push('partial');
    if(info.isJJRelease)cls.push('jj-release');
    const dots=[
      rec&&rec.sleep&&rec.sleep.success?'on sleep':'',
      rec&&rec.study&&rec.study.tier&&rec.study.tier!=='conservative'?'on study':'',
      rec&&rec.jingji&&rec.jingji.ok?'on jj':'',
      rec&&rec.wake&&rec.wake.fitness?'on wake':''
    ].filter(Boolean).map(c=>`<i class="dot ${c}"></i>`).join('');
    html+=`<div class="${cls.join(' ')}" data-date="${key}" ${isFuture?'data-future="1"':''}><span class="cal-num">${day}</span><span class="cal-dots">${dots}</span></div>`;
  }
  const todayInfo=sch[today]||{};
  const canSmall=todayInfo.isReward===true;const canBig=todayInfo.isRest===true;

function render(preserve){
  if(!state)state=defaultState();
  checkStreakTimeout();

  // 1) 未启用 → 显示启用页
  const notActivated = !state.enabled || !state.settings.startDate;
  if(notActivated){
    document.body.classList.remove('cold','rest','bd-celebration');
    document.querySelector('.app').style.display='none';
    const cd=document.getElementById('countdownScreen'); if(cd) cd.remove();
    showActivationScreen();
    return;
  }

  // 2) 有起始时间且还没到 → 显示倒计时
  const startTs = state.settings.startTimestamp;
  if(startTs && Date.now() < startTs){
    document.querySelector('.app').style.display='none';
    const act=document.getElementById('activationScreen'); if(act) act.remove();
    if(!document.getElementById('countdownScreen')) showCountdownScreen();
    return;
  }

  // 3) 正常渲染
  const cd=document.getElementById('countdownScreen'); if(cd) cd.remove();
  document.querySelector('.app').style.display='block';
  autoCheckJJRelease();
  if(preserve!==false)scrollPos=window.scrollY;
  updateUndoBtn();
  const v=$('#view');if(!v)return;
  try{
    if(activeTab==='home')v.innerHTML=viewHome();
    else if(activeTab==='calendar')v.innerHTML=viewCalendar();
    else if(activeTab==='record')v.innerHTML=viewRecord();
    else if(activeTab==='willpower')v.innerHTML=viewWillpower();
    else if(activeTab==='emotion')v.innerHTML=viewEmotion();
    else if(activeTab==='finance')v.innerHTML=viewFinance();
    else if(activeTab==='diet')v.innerHTML=viewDiet();
    else if(activeTab==='me')v.innerHTML=viewMe();
  }catch(err){console.error(err);v.innerHTML=`<div class="alert danger"><span class="ico">⚠</span><div><b>渲染出错</b><p>${esc(err.message)}</p></div></div>`;}
  renderDateNav();renderTabbar();applyTheme();spawnWeather();
  if(preserve!==false)window.scrollTo(0,scrollPos);

}

function viewCalendar(){

  const today=todayStr();const sch=computeSchedule();
  let html='';
  for(let i=0;i<startDay;i++)html+='<div class="cal-day empty"></div>';
  for(let day=1;day<=daysInMonth;day++){
    const key=`${y}-${pad2(m+1)}-${pad2(day)}`;
    const info=sch[key]||{};const rec=state.records[key];
    const isFuture=key>today;
    const cls=['cal-day'];
    if(key===today)cls.push('today');
    if(isFuture)cls.push('future');
    if(info.isBirthday)cls.push('birthday');
    if(info.isRest)cls.push('rest');
    if(info.isRestCandidate)cls.push('rest-candidate');
    if(info.type==='cooldown'||info.type==='future-cooldown')cls.push('cool');

      rec&&rec.sleep&&rec.sleep.success?'on sleep':'',
      rec&&rec.study&&rec.study.tier&&rec.study.tier!=='conservative'?'on study':'',
      rec&&rec.jingji&&rec.jingji.ok?'on jj':'',
      rec&&rec.wake&&rec.wake.fitness?'on wake':''
    ].filter(Boolean).map(c=>`<i class="dot ${c}"></i>`).join('');
    html+=`<div class="${cls.join(' ')}" data-date="${key}" ${isFuture?'data-future="1"':''}><span class="cal-num">${day}</span><span class="cal-dots">${dots}</span></div>`;
  }
  const todayInfo=sch[today]||{};
  const canSmall=todayInfo.isReward===true;const canBig=todayInfo.isRest===true;
  return `
  <div class="card">
    <div class="cal-head"><button data-act="calPrev">‹</button><div class="cal-title">${y}年${m+1}月</div><button data-act="calNext">›</button></div>
    <div class="cal-week">${['日','一','二','三','四','五','六'].map(d=>`<span>${d}</span>`).join('')}</div>
    <div class="cal-grid">${html}</div>
  </div>
  <div class="card"><div class="card-t"><h3>图例</h3></div>
    <div style="display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--muted)">
      <span>🟢 全绿</span><span>🟡 部分</span><span>❄ 冷静（冰冻）</span>
      <span>◆ 减脂餐日</span><span>★ 奖励日</span><span>💧 释放日</span>
      <span>🎂 生日</span><span>🏖 休息日</span><span>? 候选</span>
    </div>
    <div class="hint" style="margin-top:8px;">可往后翻查看未来排程。冷静期会显示冰冻标记。</div>
  </div>`;
}
  /* ========== v9：手动休息日改为按日期定位（10-09 优先，遇冷静期顺延） ========== */
(function(){
  var _prevCS9 = computeSchedule;
  computeSchedule = function(){
    var result = _prevCS9();
    // 1. 撤销之前补丁（v6/v7）对"手动休息日"的标记
    for(var k in result){
      if(result[k].isManualRest){
        var di = result[k];
        var origType = (k < todayStr()) ? 'green' : 'future';
        result[k] = Object.assign({}, di, {
          type: origType,
          isRest: false,
          isRestConfirmed: false,
          isManualRest: false,
          isRestCandidate: false
        });
      }
    }
    // 2. 从 10-09 起，往后找第一个"非冷静日"作为休息日
    var plan = state.settings && state.settings.manualRestPlan;
    if(!plan || !plan.date) return result;
    var planD = parseD(plan.date);
    for(var i = 0; i < 30; i++){
      var key = fmtDate(addDays(planD, i));
      if(!result[key]) break;
      var d = result[key];
      // 冷静期跳过
      if(d.type === 'cooldown' || d.type === 'future-cooldown') continue;
      // 已经是休息日就不重复
      if(d.isRest) break;
      // 标记为休息日
      result[key] = Object.assign({}, d, {
        type: 'rest',
        isRest: true,
        isManualRest: true,
        isRestConfirmed: true,
        isReward: false,
        isMealDay: false,
        isRestCandidate: false,
        cooldownRemaining: 0,
        isJJRelease: false,
        cooldownBreakdown: null
      });
      break;
    }
    return result;
  };
  var _origMigrateV9 = migrate;
  migrate = function(){
    _origMigrateV9();
    if(state.settings) state.settings.manualRestPlan = { date: '2026-10-09' };
  };
})();
  /* ========== v10：休息日跟随冷静期顺延 + 睡觉打卡弹窗询问 ========== */
(function(){
  // 1. 睡觉判定（凌晨打卡按晚睡处理）
  judgeSleep = function(time, reason){
    if(!time) return {success:false, msg:'未打卡'};
    var t = timeToMin(time);
    var d = timeToMin(state.settings.sleepDeadline || '23:30');
    if(t < d - 12*60) t += 24*60;
    if(t <= d) return {success:true, msg:'按时上床 ✓'};
    if(reason === 'work') return {success:true, msg:'晚睡原因：工作/不可抗力 ✓'};
    return {success:false, msg:'超过截止时间且非不可抗力'};
  };

  // 2. 睡觉打卡：晚睡时弹窗问原因
  var _origDoCheckinV10 = doCheckin;
  doCheckin = function(project){
    if(project !== 'sleep') return _origDoCheckinV10(project);
    var today = todayStr();
    var rec = getRecord(today);
    if(rec.birthdayCard){ toast('生日豁免日'); return; }
    if(rec.sleep && rec.sleep.checked){ toast('已打卡'); return; }
    if(!inSleepWindow()){ toast('不在打卡窗口（23:00-次日5:00）'); return; }

    var nowT = nowTimeStr();
    var nowM = timeToMin(nowT);
    var deadline = timeToMin(state.settings.sleepDeadline || '23:30');
    var adjM = nowM < deadline - 12*60 ? nowM + 24*60 : nowM;
    var isLate = adjM > deadline;

    if(!isLate){
      pushUndo('打卡：睡觉');
      var j = judgeSleep(nowT, null);
      rec.sleep = {time:nowT, success:j.success, msg:j.msg, checked:true};
      saveState(); render();
      toast('睡觉打卡成功 ✓ ' + nowT);
      return;
    }

    openSheet('<h3>晚睡原因</h3>'
      + '<div style="font-size:13px;color:var(--muted);line-height:1.8;">'
      + '<p>当前时间 <b style="color:#fff">' + nowT + '</b>，已超过截止时间 ' + (state.settings.sleepDeadline || '23:30') + '。</p>'
      + '<p style="margin-top:10px">请选择晚睡原因：</p>'
      + '</div>'
      + '<div class="chips" style="margin-top:14px;">'
      + '<div class="chip" data-pick="work">工作 / 不可抗力</div>'
      + '<div class="chip" data-pick="fun">娱乐 / 自己拖的</div>'
      + '</div>',
      function(sheet){
        sheet.querySelectorAll('[data-pick]').forEach(function(ch){
          ch.onclick = function(){
            var reason = ch.dataset.pick;
            pushUndo('打卡：睡觉');
            var rec2 = getRecord(today);
            var j = judgeSleep(nowT, reason);
            rec2.sleep = {time:nowT, success:j.success, msg:j.msg, checked:true};
            saveState();
            closeSheet();
            render();
            if(j.success) toast('睡觉打卡 ✓ ' + j.msg);
            else toast('睡觉打卡 ✗ ' + j.msg);
          };
        });
      }
    );
  };
})();

(function(){
  // 3. 手动休息日跟随冷静期顺延
  var _prevCSV10 = computeSchedule;
  computeSchedule = function(){
    var result = _prevCSV10();
    // 撤销旧补丁留下的"手动休息日"标记
    for(var k in result){
      if(result[k].isManualRest){
        result[k].isRest = false;
        result[k].isManualRest = false;
        result[k].isRestConfirmed = false;
        result[k].isRestCandidate = false;
      }
    }
    var plan = state.settings && state.settings.manualRestPlan;
    if(!plan || !plan.date || !state.settings.startDate) return result;

    // 从 startDate 数"有效日"（非冷静日），数到目标天数，那天就是休息日
    var targetDays = diffDays(parseD(state.settings.startDate), parseD(plan.date)) + 1;
    var count = 0;
    var d = parseD(state.settings.startDate);
    var targetKey = null;
    for(var i = 0; i < 60; i++){
      var key = fmtDate(d);
      if(!result[key]) break;
      var info = result[key];
      var isCooldown = (info.type === 'cooldown' || info.type === 'future-cooldown');
      if(!isCooldown){
        count++;
        if(count === targetDays){
          targetKey = key;
          break;
        }
      }
      d = addDays(d, 1);
    }
    if(targetKey && result[targetKey]){
      result[targetKey] = Object.assign({}, result[targetKey], {
        type: 'rest',
        isRest: true,
        isManualRest: true,
        isRestConfirmed: true,
        isReward: false,
        isMealDay: false,
        isRestCandidate: false,
        cooldownRemaining: 0,
        isJJRelease: false,
        cooldownBreakdown: null
      });
    }
    return result;
  };
})();
/* ========== 启动 ========== */
(function(){
  const raw=localStorage.getItem(LS_STATE);
  if(raw){try{state=JSON.parse(raw);}catch(e){state=defaultState();}}
  else{state=defaultState();}
  migrate();
  // 修复：只有已有 startDate 才做唤醒检查
  if(state.enabled && state.settings.startDate){
    autoCheckWakeFail();
  }
  render(false);
  booted=true;
  setTimeout(()=>{
    cloudPull(false).then(res=>{
      if(res.pulled)render(false);
    });
  },300);
})();
</script>
